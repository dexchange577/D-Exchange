const MA=(m,...ks)=>{for(const k of ks){if(m[k]!=null&&m[k]!=='')return m[k]}return null};
function txModel(t){
  const m=(t.meta&&typeof t.meta==='object')?t.meta:{};
  const type=String(t.type||'');const cur=String(t.currency||'');
  const A=num(t.amount);
  const used=new Set(['rate','exchangeRate','rateText','side','rateKey','rateLabel','grossAmount','feePercent','feeAmount','feeCurrency','netAmount','fromCurrency','toCurrency','toBalanceBefore','toBalanceAfter','atomic',
    'baseFeeUSDT','feeRateUsed','feeRateText','totalDeducted','totalDeductedCurrency','feeBalanceBefore','feeBalanceAfter','provider','withdrawal_id','session_id','payment_url','refunded','credited','pointsAwarded',
    'statusChangedAt','providerReference','reference','tx_hash','txHash','hash','txid','deposit_address','address','depositAddress','deposit_id','providerFee']);
  const rows=[];const add=(k,v,o)=>{if(v==null||v==='')return;rows.push(Object.assign({k,v:String(v)},o||{}))};
  const core=(k,v,o)=>rows.push(Object.assign({k,v:(v==null||v==='')?'—':String(v)},o||{}));
  const money=(x,c)=>x==null?null:`${fmt(x)} ${c||''}`.trim();
  const d=new Date(t.time);const okd=!isNaN(d);
  const id=String(t.txId||t.id||'');
  let heroAmt=money(A,cur)||'—';
  core('Transaction Type',type);
  core('Status',statusText(t.status));
  core('Date',okd?d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}):null);
  core('Exact Time',okd?d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZoneName:'short'}):null);
  const sc=MA(m,'statusChangedAt')||t.statusChangedAt;
  if(sc&&!isNaN(new Date(sc)))add('Status Changed',new Date(sc).toLocaleString());

  if(type==='Swap'){
    const fc=m.fromCurrency||cur,tc=m.toCurrency||t.to||'';
    const rate=num(MA(m,'exchangeRate','rate'));
    const net=num(MA(m,'netAmount'))??num(t.out);
    const gross=num(m.grossAmount)??((rate!=null&&A!=null)?q8(A*rate):null);
    const pct=num(m.feePercent)??num(t.fee);
    const feeAmt=num(m.feeAmount)??((gross!=null&&net!=null)?q8(gross-net):null);
    const rtxt=m.rateText||(rate!=null?`1 ${fc} = ${fmtRate(rate)} ${tc}`:null);
    heroAmt=`${money(A,fc)} → ${net!=null?money(net,tc):'—'}`;
    core('From',money(A,fc));
    core('To',net!=null?money(net,tc):null);
    add('Rate Type',m.rateLabel);add('Exchange Rate',rtxt);
    add('Gross Amount',gross!=null?money(gross,tc):null);
    if(feeAmt!=null||pct!=null)core('Fee',`${feeAmt!=null?money(feeAmt,tc):'—'}${pct!=null?` (${pctText(pct)})`:''}`);
    if(feeAmt!=null)add('Fee Currency',tc);
    core('You Receive',net!=null?money(net,tc):null,{hl:true});
    add('Account',t.from);
  }else if(type==='Withdraw'){
    const feeAmt=num(m.feeAmount)??num(t.fee);
    const feeCur=m.feeCurrency||cur;
    const net=num(m.netAmount)??A;
    core('Withdrawal Amount',money(A,cur));
    if(feeAmt!=null)core('Fee',money(feeAmt,feeCur));
    if(feeAmt!=null)add('Fee Currency',feeCur);
    if(m.baseFeeUSDT!=null)add('Base Fee',`${fmt(m.baseFeeUSDT)} USDT`);
    add('Fee Conversion Rate',m.feeRateText);
    core('Net Amount',money(net,cur));
    let total=null;
    if(num(m.totalDeducted)!=null){
      total=(feeCur&&feeCur!==cur&&feeAmt!=null)?`${money(m.totalDeducted,cur)} + ${money(feeAmt,feeCur)}`:money(m.totalDeducted,cur);
    }else if(t.balanceBefore!=null&&t.balanceAfter!=null){total=money(q8(Number(t.balanceBefore)-Number(t.balanceAfter)),cur)}
    core('Total Deducted',total,{hl:true});
    add('Destination',t.dest||t.to);
    add('Phone Number',t.phone);
    add('Network',t.network);
    add('Provider',m.provider);
    add('Provider Reference',MA(m,'providerReference','withdrawal_id','reference'));
    add('TX Hash',MA(m,'tx_hash','txHash','hash','txid'));
  }else if(type==='Deposit'){
    core('Deposit Amount',money(A,cur));
    core('Currency',cur);
    add('Network',t.network);
    add('Deposit Address',MA(m,'deposit_address','depositAddress','address'));
    add('TX Hash',MA(m,'tx_hash','txHash','hash','txid'));
    add('Provider',m.provider);
    add('Provider Reference',MA(m,'providerReference','session_id','deposit_id','reference'));
    add('From',t.from);add('To',t.to||t.dest);
  }else{
    core('Currency',cur);core('Amount',money(A,cur));
    if(t.out!=null)add('Received',money(num(t.out),t.to||''));
    add('From',t.from);add('To',t.to||t.dest||t.phone);
    add('Network',t.network);
    if(num(t.fee)!=null&&num(t.fee)!==0)add('Fee',money(num(t.fee),cur));
  }
  if(type==='Swap'){add('Network',t.network)}
  add('Approval Mode',t.approvalMode);
  add('Balance Before',t.balanceBefore!=null?money(num(t.balanceBefore),cur):null);
  add('Balance After',t.balanceAfter!=null?money(num(t.balanceAfter),cur):null);
  if(type==='Swap'){
    const tc=m.toCurrency||t.to||'';
    if(num(m.toBalanceBefore)!=null)add('Destination Balance Before',money(num(m.toBalanceBefore),tc));
    if(num(m.toBalanceAfter)!=null)add('Destination Balance After',money(num(m.toBalanceAfter),tc));
  }
  if(num(m.feeBalanceBefore)!=null)add('Fee Balance Before',money(num(m.feeBalanceBefore),'USDT'));
  if(num(m.feeBalanceAfter)!=null)add('Fee Balance After',money(num(m.feeBalanceAfter),'USDT'));
  // remaining primitive metadata that is already stored (no secrets / urls / sessions)
  const extra=[];
  for(const k of Object.keys(m)){
    if(used.has(k)||/key|secret|token|password|url|session|signature/i.test(k))continue;
    const v=m[k];if(v==null||typeof v==='object'||v==='')continue;
    extra.push({k:k.replace(/_/g,' '),v:String(v),raw:true});
  }
  return {id,type,icon:type==='Swap'?'⇄':type==='Deposit'?'↓':type==='Withdraw'?'↑':type==='Easyload'?'📱':'★',heroAmt,rows,extra,status:t.status||'pending',statusLabel:statusText(t.status)};
}

  const isAr=s=>/[\u0590-\u08FF]/.test(s);
  const wrap=(ctx,text,maxW,font)=>{
    ctx.font=font;const lines=[];
    String(text).split('\n').forEach(par=>{
      let line='';const push=()=>{lines.push(line);line=''};
      for(const word of par.split(' ')){
        const test=line?line+' '+word:word;
        if(ctx.measureText(test).width<=maxW){line=test;continue}
        if(line)push();
        if(ctx.measureText(word).width<=maxW){line=word;continue}
        for(const ch of Array.from(word)){const t2=line+ch;if(!line||ctx.measureText(t2).width<=maxW)line=t2;else{push();line=ch}}
      }
      push();
    });
    return lines;
  };
  const rowsAll=mdl.rows.concat(mdl.extra);
  const stCol={confirmed:['#e3f6ee','#0a7a58'],rejected:['#fde8e8','#b42318'],pending:['#fff3d6','#9a6700']}[mdl.status]||['#fff3d6','#9a6700'];
  function run(ctx,draw){

    const HH=230;

    text('D Exchange',xs,108,`800 58px ${fam}`,'#e6cf94',al,'ltr');
    text(T('Transaction Details'),xs,166,`500 30px ${fam}`,'rgba(255,255,255,.85)',al);
    let y=HH+70;
    text(T(mdl.type),W/2,y,`500 30px ${fam}`,'#6b7385','center');y+=30;
    const aLines=wrap(ctx,mdl.heroAmt,CW,`800 64px ${fam}`);
    aLines.forEach(l=>{y+=76;text(l,W/2,y,`800 64px ${fam}`,'#0f1b3d','center','ltr')});
    y+=36;
    ctx.font=`700 28px ${fam}`;const pw=ctx.measureText(mdl.statusLabel).width+64;
    if(draw){ctx.fillStyle=stCol[0];ctx.beginPath();if(ctx.roundRect)ctx.roundRect((W-pw)/2,y,pw,56,28);else ctx.rect((W-pw)/2,y,pw,56);ctx.fill()}
    text(mdl.statusLabel,W/2,y+38,`700 28px ${fam}`,stCol[1],'center');
    y+=56+44;
    if(draw){ctx.fillStyle='#e8ebf2';ctx.fillRect(P,y,CW,2)}
    y+=14;
    // transaction id block (always complete, wraps)
    text(T('Transaction ID'),xs,y+44,`500 26px ${fam}`,'#6b7385',al);y+=44;
    const idFont=`600 28px ui-monospace, Menlo, Consolas, monospace`;
    wrap(ctx,mdl.id,CW,idFont).forEach(l=>{y+=40;text(l,xs,y,idFont,'#0f1b3d',al,'ltr')});
    y+=26;if(draw){ctx.fillStyle='#e8ebf2';ctx.fillRect(P,y,CW,2)}y+=6;
    rowsAll.forEach(r=>{
      const label=r.raw?r.k:T(r.k);
      const lf=`500 26px ${fam}`,vf=`700 30px ${fam}`;
      ctx.font=lf;const lw=ctx.measureText(label).width;
      ctx.font=vf;const vw=ctx.measureText(r.v).width;
      const inline=lw<=CW*0.4&&vw<=CW*0.56;
      if(inline){
        const top=y;y+=52;
        text(label,xs,y,lf,'#6b7385',al);
        text(r.v,xe,y,vf,r.hl?'#7a5c1e':'#0f1b3d',ale,isAr(r.v)?'rtl':'ltr');
        y+=22;
      }else{
        y+=46;text(label,xs,y,lf,'#6b7385',al);
        wrap(ctx,r.v,CW,vf).forEach(l=>{y+=42;text(l,xs,y,vf,r.hl?'#7a5c1e':'#0f1b3d',al,isAr(l)?'rtl':'ltr')});
        y+=22;
      }
      if(draw){ctx.fillStyle='#eef0f5';ctx.fillRect(P,y,CW,2)}
      y+=4;
    });
    y+=46;
    text('D Exchange · '+new Date().toLocaleString(),W/2,y,`500 24px ${fam}`,'#8a91a3','center','ltr');
    y+=40;
    return y;
  }
  const H=Math.ceil(run(mctx,false))+10;
  const out=document.createElement('canvas');out.width=W*S;out.height=H*S;
  const ctx=out.getContext('2d');ctx.scale(S,S);

  run(ctx,true);

}

      if(!blob){const a=document.createElement('a');a.href=cvs.toDataURL('image/png');a.download=name;document.body.appendChild(a);a.click();a.remove();toast(T('Downloaded'));return}

      if(!('download' in HTMLAnchorElement.prototype))window.open(url,'_blank');
      setTimeout(()=>URL.revokeObjectURL(url),10000);toast(T('Downloaded'));

<script id="dx-notify">
(function(){
'use strict';

/* ---- translations (only added when missing; uses the existing I18N/tr system) ---- */
var TXT={
 'Notifications':['خبرتیاوې','اعلان‌ها','Notifications'],
 'No notifications yet':['تر اوسه هیڅ خبرتیا نشته','هنوز اعلانی وجود ندارد','No notifications yet'],
 'Admin announcement':['د مدیر اعلان','اعلان مدیر','Admin announcement'],
 'Send announcement to all users':['ټولو کاروونکو ته اعلان ولېږئ','ارسال اعلان به همه کاربران','Send an announcement to all users'],
 'Title (optional)':['سرلیک (اختیاري)','عنوان (اختیاری)','Title (optional)'],

 'Send to all users':['ټولو ته ولېږه','ارسال به همه','Send to all users'],
 'Announcement sent to all users':['اعلان ټولو کاروونکو ته ولېږل شو','اعلان به همه کاربران ارسال شد','Announcement sent to all users'],
 'Write a message first':['لومړی پیغام ولیکئ','ابتدا پیام را بنویسید','Write a message first'],
 'Sent announcements':['لېږل شوي اعلانونه','اعلان‌های ارسال‌شده','Sent announcements'],
 'Delete':['ړنګول','حذف','Delete'],
 'Pending':['په انتظار کې','در انتظار','Pending'],
 'Confirmed':['تایید شو','تأیید شد','Confirmed'],
 'Rejected':['رد شو','رد شد','Rejected'],
 'Database not connected':['ډیټابیس نه دی وصل','پایگاه داده متصل نیست','Database not connected'],
 'Could not send':['ونه لېږل شو','ارسال نشد','Could not send'],
 'Close':['بندول','بستن','Close']
};
try{['ps','fa','en'].forEach(function(l,i){I18N[l]=I18N[l]||{};Object.keys(TXT).forEach(function(k){if(!I18N[l][k])I18N[l][k]=TXT[k][i]})})}catch(e){console.warn('dx-notify i18n',e)}

var KEY='announcements',ann=[],lastFetch=0;
function E(x){return typeof esc==='function'?esc(x):String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function readKey(u){return 'dx_notif_read_'+u.id}
function readSet(u){try{return JSON.parse(ls(readKey(u))||'null')}catch(e){return null}}
function writeSet(u,set){ls(readKey(u),JSON.stringify(set))}

/* ---- build the list: announcements + the user's own transactions ---- */
var TYPE={Deposit:['💰','Deposit'],Withdraw:['📤','Withdraw'],Swap:['🔄','Swap'],Easyload:['📱','Easyload']};
function statusLabel(st){
 st=String(st||'pending').toLowerCase();
 if(st==='confirmed'||st==='completed'||st==='success'||st==='approved'||st==='active')return 'Confirmed';

}
function build(){
 var u=me();if(!u)return [];
 var out=[];
 ann.forEach(function(a){out.push({key:'a:'+a.id,icon:'📢',title:a.title||tr('Admin announcement'),body:a.body||'',time:a.time||''})});
 (u.tx||[]).slice(-80).forEach(function(t){
  var ty=TYPE[t.type]||['🧾',t.type||'Transactions'],sl=statusLabel(t.status),id=t.txId||t.id;

 });

function seed(u,items){ // first use on this device: existing history is not "new"

var prevOpen=window.openView;
window.openView=function(name){

 if(!me())return prevOpen.apply(this,arguments);

/* ---- announcements: stored in the existing Supabase system_settings table (key 'announcements') ---- */
async function readRemote(){
 if(typeof dbReady!=='function'||!dbReady())return null;
 var r=await supabaseClient.from('system_settings').select('value').eq('key',KEY).limit(1);

async function fetchAnn(force){

  var items=await readRemote();
  if(items){ann=items.filter(function(a){return a&&a.id&&a.body});ls('dx_ann_cache',JSON.stringify(ann))}
  await syncTxStatus();
 }catch(e){console.warn('dx-notify fetch',e&&e.message||e)}
 window.dxNotifyBadge();

/* =====================================================================
   PART 1 - ADMIN STATUS
   Causes found in the frontend:
   (a) dbSaveManagedUser() wrote role+status from the locally cached user straight into profiles (stale value overwrote the real one);

       so the next dbLoadAllUsers()/login reloaded the real role and the admin "disappeared";
   (c) on refresh / reopen the app trusted the cached localStorage user and never re-read the role from the database.
   ===================================================================== */
async function setRoleVerified(userId,role,status){
  if(!ready())throw new Error('Database is not connected');
  const rr=await supabaseClient.rpc('dexchange_set_user_role',{p_target_user_id:userId,p_role:role,p_status:status||'active'});
  if(rr.error)throw rr.error;
  const {data,error}=await supabaseClient.from('profiles').select('role,status').eq('id',userId).maybeSingle();
  if(error)throw error;
  if(!data||String(data.role)!==String(role))throw new Error('The database did not keep the role "'+role+'" (stored: '+(data?data.role:'unknown')+')');
  return data;
}

/* Session restore: the stored role/status is read from the database on every start, on return to the tab, and BEFORE any local data is synced back */
let readyRes;window.__dxSessionReady=new Promise(r=>{readyRes=r});setTimeout(()=>readyRes(),8000);
let lastRefresh=0,refreshing=null;
async function refreshSession(force){
  if(refreshing)return refreshing;
  if(!force&&Date.now()-lastRefresh<20000)return;
  refreshing=(async()=>{
    try{
      if(!ready())return;
      const {data}=await supabaseClient.auth.getSession();
      const au=data&&data.session&&data.session.user;if(!au)return;
      const before=cur(),oldRole=before&&before.role,oldStatus=before&&before.status,oldId=before&&before.id;
      await dbHydrateUser(au);
      lastRefresh=Date.now();
      if(typeof ensureAdmin==='function'&&ensureAdmin()&&typeof dbHydrateAdminSettings==='function')await dbHydrateAdminSettings();
      const now=cur();
      if(now&&(!before||now.id!==oldId||now.role!==oldRole||now.status!==oldStatus)){
        if(now.status!=='active'){state.current=null;save();if(typeof showAuth==='function')showAuth();return}
        if((before||window.__dxBooted)&&typeof enterApp==='function')enterApp();   /* before boot, dxBoot() enters the app itself */
      }
    }catch(e){console.warn('session refresh:',e)}
    finally{refreshing=null}
  })();
  return refreshing;
}

const OK=['confirmed','completed','success','approved','paid'],BAD=['rejected','failed','cancelled','canceled','declined','refunded','expired'];
const phase=s=>{s=String(s||'pending').toLowerCase();return OK.includes(s)?'ok':BAD.includes(s)?'bad':'wait'};
const isReq=t=>t&&(t.type==='Withdraw'||t.type==='Easyload');
const idOf=t=>String(t.txId||t.id);
const pendingReqs=u=>((u&&u.tx)||[]).filter(t=>isReq(t)&&phase(t.status)==='wait');

/* adopt final statuses (and the real wallet) from the database. Returns the requests that just finished. */
async function reconcile(){
  if(!ready())return [];
  const u=cur();if(!u||!u.id)return [];
  const list=pendingReqs(u);if(!list.length)return [];
  /* read the requests AND the wallet first, then apply both together, so status and balance always change at the same moment */
  const [tr_,wr_]=await Promise.all([
    supabaseClient.from('transactions').select('tx_id,status,metadata,balance_after').eq('user_id',u.id).in('tx_id',list.map(idOf)),
    supabaseClient.from('wallets').select('*').eq('user_id',u.id).maybeSingle()
  ]);
  if(tr_.error||!tr_.data)return [];
  const finished=tr_.data.filter(r=>phase(r.status)!=='wait');
  if(!finished.length)return [];
  const u2=cur();if(!u2||u2.id!==u.id)return [];
  const w=wr_&&!wr_.error?wr_.data:null;
  if(w)u2.balances=Object.assign({},u2.balances,{AFN:Number(w.afn||0),USDT:Number(w.usdt||0),AZAD:Number(w.azad||0)});
  const done=[];
  finished.forEach(r=>{
    const t=(u2.tx||[]).find(x=>idOf(x)===String(r.tx_id));
    if(!t||phase(t.status)!=='wait')return;
    t.status=String(r.status).toLowerCase();
    t.statusChangedAt=new Date().toISOString();
    t.meta=Object.assign({},t.meta||{},r.metadata||{},{statusChangedAt:t.statusChangedAt});
    if(r.balance_after!=null)t.balanceAfter=Number(r.balance_after);
    done.push(t);
  });
  if(done.length){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  return done;
}

function fmtAmt(n){const x=Number(n);if(!Number.isFinite(x))return String(n);return String(Number(x.toFixed(8)))}
function findReq(id){const u=cur();return u&&(u.tx||[]).find(t=>idOf(t)===String(id))}
function renderProc(){

  if(!t){if(host)host.remove();procId=null;document.documentElement.style.overflow='';return}
  const ph=phase(t.status),isW=t.type==='Withdraw';
  const dest=t.to||t.dest||t.phone||'-';
  const title=ph==='wait'?T('Processing'):ph==='ok'?T('Confirmed'):T('Rejected');
  const sub=ph==='wait'?T('Your request is being processed.'):ph==='ok'?T('Your request was confirmed.'):T('Your request was rejected. The amount was returned to your balance.');
  const ico=ph==='wait'?'<div class="ring"></div><div class="dot">\u23F3</div>':ph==='ok'?'<div class="dot">\u2705</div>':'<div class="dot">\u274C</div>';

  const step=(cls,sym,label)=>`<div class="dxproc-step ${cls}"><i>${sym}</i>${E(label)}</div>`;
  const steps=step('done','\u2713',T('Request submitted'))
    +step(ph==='wait'?'now':'done',ph==='wait'?'\u2022':'\u2713',T('Processing'))
    +step(ph==='ok'?'done':ph==='bad'?'badstep':'',ph==='ok'?'\u2713':ph==='bad'?'\u2715':'',ph==='bad'?T('Rejected'):T('Confirmed'));
  const html=`<div class="dxproc-card" role="dialog" aria-modal="true" aria-live="polite">
    <div class="dxproc-ico ${ph}">${ico}</div>
    <h2>${E(title)}</h2><p class="sub">${E(sub)}</p>
    <div class="amt">${E(fmtAmt(t.amount))} ${E(t.currency||'')}</div>
    <div class="dxproc-steps">${steps}</div>
    <div class="dxproc-rows">
      <div class="dxproc-row"><span>${E(T(isW?'Withdrawal Request':'Easyload Request'))}</span><b>${E(T(t.type))}</b></div>
      <div class="dxproc-row"><span>${E(T('Amount'))}</span><b>${E(fmtAmt(t.amount))} ${E(t.currency||'')}</b></div>
      <div class="dxproc-row"><span>${E(T('Destination'))}</span><b>${E(dest)}</b></div>
      <div class="dxproc-row"><span>${E(T('Request ID'))}</span><b>${E(idOf(t))} <button type="button" id="dxProcCopy" aria-label="Copy">\u{1F4CB}</button></b></div>
      <div class="dxproc-row"><span>${E(T('Status'))}</span><b>${badge}</b></div>
    </div>
    ${ph==='wait'?`<div class="dxproc-note">${E(T('You can leave this page. Your request keeps processing and you will be notified.'))}</div>`:''}
    <div class="dxproc-actions"><button class="outline" type="button" id="dxProcHist">${E(T('View History'))}</button><button class="primary gold" type="button" id="dxProcDone">${E(ph==='wait'?T('Close'):T('Done'))}</button></div>
  </div>`;
  let el=$('dxProc');
  if(!el){el=document.createElement('div');el.id='dxProc';el.className='dxproc';document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target===el)closeProc()});document.documentElement.style.overflow='hidden'}
  el.innerHTML=html;
  $('dxProcDone').onclick=closeProc;
  $('dxProcHist').onclick=()=>{closeProc();try{openView(isW?'withdrawHistory':'dashboard')}catch(e){}};
  $('dxProcCopy').onclick=async()=>{try{if(window.dxCopyText)await window.dxCopyText(idOf(t));else await navigator.clipboard.writeText(idOf(t));toast(T('Copied'))}catch(e){}};
}
function closeProc(){const el=$('dxProc');if(el)el.remove();procId=null;document.documentElement.style.overflow=''}   /* closing never cancels the request */
window.dxShowProcessing=function(id){procId=String(id);renderProc();startPolling()};

function refreshViews(){
  try{
    const f=document.activeElement;if(f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName))return;
    if(['dashboard','withdrawHistory','history','transactions'].includes(currentView))openView(currentView);
  }catch(e){}
}
function handleDone(done){
  if(!done||!done.length)return;
  done.forEach(t=>{
    const ph=phase(t.status);
    if(procId&&String(procId)===idOf(t)){renderProc()}
    else toast(T(t.type==='Withdraw'?(ph==='ok'?'Withdrawal confirmed':'Withdrawal rejected'):(ph==='ok'?'Easyload confirmed':'Easyload rejected'))+' '+(ph==='ok'?'\u2705':'\u274C'));
  });
  refreshViews();
}
let polling=null,busy=false;
async function tick(){
  if(busy)return;busy=true;
  try{
    const u=cur();
    if(!u||!pendingReqs(u).length){stopPolling();return}
    handleDone(await reconcile());
    if(!pendingReqs(cur()||{}).length)stopPolling();
  }catch(e){console.warn('request watcher:',e)}
  finally{busy=false}
}
function startPolling(){if(polling)return;polling=setInterval(()=>{if(!document.hidden)tick()},3000);subscribeRealtime()}
function stopPolling(){if(polling){clearInterval(polling);polling=null}}
/* instant updates when Supabase Realtime is enabled for the table; polling above is the guaranteed fallback */
let rtFor=null;
function subscribeRealtime(){
  try{
    const u=cur();if(!ready()||!u||rtFor===u.id||typeof supabaseClient.channel!=='function')return;
    rtFor=u.id;
    supabaseClient.channel('dx-req-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:'user_id=eq.'+u.id},()=>tick()).subscribe();
  }catch(e){}
}
/* resume watching requests that are still pending after a refresh / reopen */
function resume(){const u=cur();if(u&&pendingReqs(u).length){startPolling();tick()}}
(function(){
  const oe=window.enterApp;
  if(typeof oe==='function')window.enterApp=function(){const r=oe.apply(this,arguments);setTimeout(resume,600);return r};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(resume,1200));else setTimeout(resume,1200);
})();

/* show the Processing screen right after a request is created */
function wrapSubmit(name,type){
  const orig=window[name];if(typeof orig!=='function')return;
  window[name]=async function(){
    const u0=cur();const before=new Set(((u0&&u0.tx)||[]).map(idOf));
    const r=await orig.apply(this,arguments);
    try{
      const u1=cur();
      const nt=((u1&&u1.tx)||[]).find(t=>t.type===type&&!before.has(idOf(t))&&phase(t.status)!=='bad');
      if(nt){window.dxShowProcessing(idOf(nt));if(phase(nt.status)==='wait')startPolling()}
    }catch(e){console.warn('processing screen:',e)}
    return r;
  };
}
['dxWithdrawAFN','dxWithdrawCrypto','v20SubmitWithdraw'].forEach(n=>wrapSubmit(n,'Withdraw'));
wrapSubmit('doEasy','Easyload');
})();
</script>
