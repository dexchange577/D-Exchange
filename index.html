<script>
/* D Exchange v22 financial/provider patch. Loaded after v21. */
(function(){
  'use strict';
  const GATEWAY='https://srakzgpwxmxtpxbvnelq.supabase.co/functions/v1/dexchange-gateway';
  state.api=state.api||{};
  state.api.afn=state.api.afn||{};
  state.api.crypto=state.api.crypto||{};
  state.api.afn.endpoint=state.api.afn.endpoint||GATEWAY;
  state.api.crypto.endpoint=state.api.crypto.endpoint||GATEWAY;

  function escv(x){return typeof esc==='function'?esc(String(x??'')):String(x??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));}
  function cfgLocal(c){
    const x=String(c||'').toUpperCase();
    const lc=(state.currencies||[]).find(z=>String(z.code||'').toUpperCase()===x)||{};
    return {code:x,symbol:lc.symbol||x,min_deposit:Number(lc.min_deposit||0),min_withdraw:Number(lc.min_withdraw||0),min_swap:Number(lc.min_swap||0),deposit_enabled:lc.deposit_enabled!==false,withdraw_enabled:lc.withdraw_enabled!==false,swap_enabled:lc.swap_enabled!==false,network:lc.network||((x==='USDT'||x==='AZAD')?'BEP20':'')};
  }
  async function dbCurrency(code){
    if(typeof dbReady!=='function'||!dbReady()) return cfgLocal(code);
    const {data,error}=await supabaseClient.from('currencies').select('*').eq('code',String(code).toUpperCase()).maybeSingle();
    if(error||!data)return cfgLocal(code);
    return Object.assign(cfgLocal(code),data);
  }
  async function allCurrencies(){
    if(typeof dbReady==='function'&&dbReady()){
      const {data}=await supabaseClient.from('currencies').select('*').eq('enabled',true).order('code');
      if(data?.length)return data;
    }
    return (state.currencies||[]).filter(c=>c.enabled!==false).map(c=>Object.assign(cfgLocal(c.code),c));
  }
  async function authHeaders(){
    if(!dbReady())throw new Error('Database is not connected');
    const {data,error}=await supabaseClient.auth.getSession();
    if(error||!data?.session?.access_token)throw new Error('Please login again');
    return {'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token};
  }
  async function gateway(path,body){
    const h=await authHeaders();
    const r=await fetch(GATEWAY+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.ok===false)throw new Error(d.message||('Gateway HTTP '+r.status));
    return d;
  }
  function minNotice(cfg,kind){
    const n=Number(cfg?.[kind==='deposit'?'min_deposit':kind==='withdraw'?'min_withdraw':'min_swap']||0);
    return n>0?`<small class="muted" style="display:block;margin-top:6px">Minimum: ${n} ${escv(cfg.symbol||cfg.code)}</small>`:'';
  }

  window.renderDepositMode=async function(){
    const c=document.getElementById('depCur')?.value,box=document.getElementById('depositMode');
    if(!c||!box)return;
    const cfg=await dbCurrency(c);
    if(c==='AFN'){
      box.innerHTML=`<div class="field"><label>AFN Amount</label><input id="depAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00">${minNotice(cfg,'deposit')}</div><div class="notice">AFN Deposit د HesabPay له لارې ترسره کېږي. د تادیې لپاره به HesabPay Checkout خلاص شي.</div><button class="primary gold" style="width:100%" onclick="dxDepositAFN()">💳 Pay With HesabPay</button>`;
      return;
    }
    if(c==='USDT'||c==='AZAD'){
      box.innerHTML=`<div class="notice">Network: <b>BEP20</b></div><div class="field"><label>${c} BEP20 Deposit Address</label><div style="display:flex;gap:7px"><input id="depAddress" readonly placeholder="Loading address..."><button class="outline" onclick="copyText('depAddress')">${tr('Copy')}</button></div></div><small class="muted">یوازې همدې BEP20 ادرس ته ${c} ولېږئ.</small>`;
      try{
        const d=await gateway('/azadcoin/deposit-address',{currency:c});
        const addr=d?.data?.address||'';
        const el=document.getElementById('depAddress');if(el)el.value=addr;
      }catch(e){const el=document.getElementById('depAddress');if(el)el.value='';toast(e.message||'Deposit address could not be loaded')}
    }
  };

  window.deposit=async function(v){
    if(!state.features.deposit)return v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;
    const cs=(await allCurrencies()).filter(c=>c.deposit_enabled!==false);
    v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'),tr('Deposit subtitle'))}<div class="panel"><div class="field"><label>${tr('Currency')}</label><select id="depCur" onchange="renderDepositMode()">${cs.map(c=>`<option>${escv(c.code)}</option>`).join('')}</select></div><div id="depositMode"></div></div></div>`;
    renderDepositMode();
  };

  window.dxDepositAFN=async function(){
    const u=current(),a=Number(document.getElementById('depAmt')?.value||0);
    if(!u||a<=0)return toast('Amount is required');
    const cfg=await dbCurrency('AFN');
    if(a<Number(cfg.min_deposit||0))return toast(`Minimum AFN Deposit is ${cfg.min_deposit} AFN`);
    try{
      const d=await gateway('/hesabpay/deposit',{amount:a,origin:location.origin});
      const txId=d.tx_id||uid();
      u.tx.unshift({id:txId,txId,type:'Deposit',amount:a,currency:'AFN',from:'HesabPay',to:`Account ${u.email}`,status:'pending',approvalMode:'automatic',time:new Date().toISOString(),fee:0,balanceBefore:Number(u.balances.AFN||0),balanceAfter:Number(u.balances.AFN||0),meta:{provider:'hesabpay',session_id:d.session_id||null,payment_url:d.payment_url||null}});

  };

  window.renderWithdrawMode=async function(){
    const c=document.getElementById('wdCur')?.value,box=document.getElementById('withdrawMode');if(!c||!box)return;
    const cfg=await dbCurrency(c);
    if(c==='AFN'){
      box.innerHTML=`<div class="field"><label>HesabPay Account / Phone</label><input id="wdPhone" placeholder="079..." inputmode="tel"></div><div class="field"><label>AFN Amount</label><input id="wdAmt" type="number" min="0" step="any" inputmode="decimal">${minNotice(cfg,'withdraw')}</div><button class="primary gold" style="width:100%" onclick="dxWithdrawAFN()">📤 Confirm Withdraw</button>`;
    }else{
      box.innerHTML=`<div class="notice">Network: <b>BEP20</b></div><div class="field"><label>BEP20 Destination Address</label><input id="wdDest" placeholder="0x..." inputmode="text"></div><div class="field"><label>${c} Amount</label><input id="wdAmt" type="number" min="0" step="any" inputmode="decimal">${minNotice(cfg,'withdraw')}</div><button class="primary gold" style="width:100%" onclick="dxWithdrawCrypto()">📤 Confirm Withdraw</button>`;
    }
  };
  window.withdraw=async function(v){
    if(!state.features.withdraw)return v.innerHTML=`<div class="screen">${screenHead(tr('Withdraw'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;
    const cs=(await allCurrencies()).filter(c=>c.withdraw_enabled!==false);

    renderWithdrawMode();
  };

  window.dxWithdrawAFN=async function(){
    const u=current(),a=Number(document.getElementById('wdAmt')?.value||0),phone=document.getElementById('wdPhone')?.value.trim();
    if(!u||!a||!phone)return toast('Amount and HesabPay account are required');

    if(Number(u.balances.AFN||0)<a)return toast(tr('Insufficient balance'));

  window.dxWithdrawCrypto=async function(){
    const u=current(),c=document.getElementById('wdCur')?.value,a=Number(document.getElementById('wdAmt')?.value||0),address=document.getElementById('wdDest')?.value.trim();

  const oldSwap=window.doSwap;
  window.doSwap=async function(){
    const u=current(),f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value,a=Number(document.getElementById('swAmt')?.value||0);

  /* Bot page: make the connection code prominent and easy to copy. */

      const username=String(state.telegramBot?.username||'@Darwish_577_bot').replace(/^@/,'');
      const url='https://t.me/'+username;
      v.innerHTML=`<div class="screen">${screenHead(tr('Bot'),'@'+e255(username))}<div class="panel">

(function(){

<!-- D Exchange Production Hardening Layer -->
<script>
(function(){
  'use strict';
  /*
   * Production rule: provider secrets NEVER belong in HTML, localStorage,
   * Supabase client state, or browser memory beyond a single explicit request.
   * Real provider credentials must be configured as Supabase Edge Function secrets.
   */
  function scrubSecrets(x){
    if(!x || typeof x!=='object') return;
    if(Array.isArray(x)){ x.forEach(scrubSecrets); return; }
    ['key','secret','apiKey','apiSecret','secretKey','token','botToken','pin'].forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(x,k)) delete x[k];
    });
    Object.keys(x).forEach(function(k){
      if(k==='publishableKey' || k==='anonKey') return; // public Supabase client key is not a provider secret.
      if(x[k] && typeof x[k]==='object') scrubSecrets(x[k]);
    });
  }
  try{ scrubSecrets(state); }catch(e){}

  /* Replace the old save with a safe save: secrets are scrubbed before persistence. */
  var oldSave=window.save;
  window.save=function(){
    try{scrubSecrets(state)}catch(e){}
    return oldSave.apply(this,arguments);
  };

  /* Remove credentials from any old localStorage copy created by earlier builds. */
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var cached=JSON.parse(raw);scrubSecrets(cached);localStorage.setItem(KEY,JSON.stringify(cached));}
  }catch(e){}

  /* Financial actions require an authenticated Supabase session in production. */
  window.requireFinancialBackend=async function(){
    if(!dbReady()){
      toast('اصلي مالي عملیات یوازې د Supabase Backend له نښلېدو وروسته فعالېږي.');
      return false;
    }
    try{
      var r=await supabaseClient.auth.getUser();
      if(!r.data || !r.data.user){toast('مهرباني وکړئ لومړی Login وکړئ.');return false;}
      return true;
    }catch(e){toast('Supabase authentication is not ready.');return false;}
  };

  /* Never allow the browser-only balance mutations to be treated as real-money settlement. */
  window.DX_PRODUCTION_FINANCIAL_LOCK=true;
  window.DX_FINANCIAL_RPC={
    swap:'dexchange_execute_swap',
    redeem:'dexchange_redeem_points',
    easyload:'dexchange_create_easyload'
  };

  /* Secure swap path: the server/RPC must atomically validate balances, rate, fee,
     write the transaction and return the new balances. No client-side settlement. */
  window.v20DoSwap=async function(){
    if(!(await requireFinancialBackend())) return;
    var u=current(), f=document.getElementById('swFrom')?.value, t=document.getElementById('swTo')?.value;
    var a=Number(document.getElementById('swAmt')?.value||0);
    if(!u||!a||a<=0||!f||!t||f===t)return toast(tr('Invalid swap'));
    try{
      var q=await supabaseClient.rpc(DX_FINANCIAL_RPC.swap,{p_from_currency:f,p_to_currency:t,p_amount:a});
      if(q.error) throw q.error;
      var d=q.data;
      if(!d || d.ok!==true) throw new Error(d?.message||'Secure swap RPC is not deployed/configured yet.');
      if(d.balances){u.balances=Object.assign(u.balances,d.balances);}
      if(d.transaction){u.tx.unshift(d.transaction);}
      save();
      toast(tr('Swap complete'));
      openView('swapHistory');
    }catch(e){
      console.error('Secure swap failed:',e);
      toast('سواپ تر هغه نه اجرا کېږي څو د Supabase امن RPC فعال نه شي.');
    }
  };

  /* Points conversion changes monetary balance too, so it also requires a server transaction. */
  var oldRedeem=window.redeemPoints;
  window.redeemPoints=async function(){
    if(!(await requireFinancialBackend())) return;
    var u=current(), requested=Math.floor(Number(document.getElementById('redeemPts')?.value||0));
    if(!u||!requested)return toast('Invalid points amount');
    try{
      var q=await supabaseClient.rpc(DX_FINANCIAL_RPC.redeem,{p_points:requested});
      if(q.error)throw q.error;
      var d=q.data;
      if(!d || d.ok!==true)throw new Error(d?.message||'Secure points RPC is not deployed/configured yet.');
      if(d.points!=null)u.points=Number(d.points);
      if(d.balances)u.balances=Object.assign(u.balances,d.balances);
      if(d.transaction)u.tx.unshift(d.transaction);
      save();toast(tr('Points converted'));openView('benefits');
    }catch(e){console.error('Secure redeem failed:',e);toast('Points conversion requires the secure Supabase RPC.');}
  };

  /* EasyLoad creates a financial reservation; confirmation/refund must remain server-side. */
  window.doEasy=async function(){
    if(!(await requireFinancialBackend())) return;
    var u=current(), a=Number(document.getElementById('elAmt')?.value||0), p=String(document.getElementById('elPhone')?.value||'').trim();
    if(!u||!a||a<=0||!p)return toast(tr('Amount and phone required'));
    try{
      var q=await supabaseClient.rpc(DX_FINANCIAL_RPC.easyload,{p_amount:a,p_phone:p});
      if(q.error)throw q.error;
      var d=q.data;
      if(!d || d.ok!==true)throw new Error(d?.message||'Secure EasyLoad RPC is not deployed/configured yet.');
      if(d.balances)u.balances=Object.assign(u.balances,d.balances);
      if(d.transaction)u.tx.unshift(d.transaction);
      save();toast('EasyLoad request ثبت شو');openView('dashboard');
    }catch(e){console.error('Secure EasyLoad failed:',e);toast('EasyLoad requires the secure Supabase RPC.');}
  };


  /* Deposit/withdraw must also have a real authenticated Supabase session before
     the provider gateway is contacted. The gateway remains responsible for the
     provider credentials, idempotency and final ledger settlement. */
  var rawDepositAFN=window.doDepositAFN;
  if(typeof rawDepositAFN==='function') window.doDepositAFN=async function(){
    if(!(await requireFinancialBackend())) return;
    return rawDepositAFN.apply(this,arguments);
  };
  var rawWithdrawAFN=window.doWithdrawAFN;
  if(typeof rawWithdrawAFN==='function') window.doWithdrawAFN=async function(){
    if(!(await requireFinancialBackend())) return;
    return rawWithdrawAFN.apply(this,arguments);
  };
  var rawWithdrawCrypto=window.doWithdrawCrypto;
  if(typeof rawWithdrawCrypto==='function') window.doWithdrawCrypto=async function(){
    if(!(await requireFinancialBackend())) return;
    return rawWithdrawCrypto.apply(this,arguments);
  };

  /* Provider API configuration UI deliberately contains no secret fields. */
  window.adminAPIs=function(){
    if(typeof ensureAdmin==='function'&&!ensureAdmin())return toast('Admin access required');
    state.api=state.api||{};state.api.afn=state.api.afn||{};state.api.crypto=state.api.crypto||{};state.api.easyload=state.api.easyload||{};
    var gw=state.api.crypto.endpoint||state.api.afn.endpoint||((state.db?.url||'')+'/functions/v1/dexchange-gateway');
    showModal('<h3>🔐 Secure API Settings</h3>'+
      '<div class="notice">API Key، Secret، PIN او Telegram Token دلته نه ساتل کېږي. دا معلومات باید یوازې د Supabase Edge Function Secrets کې تنظیم شي. Website یوازې Gateway URL او فعال/غیرفعال حالت ساتي.</div>'+
      '<div class="panel" style="margin:10px 0"><h4>HesabPay — AFN</h4><div class="field"><label>Secure Gateway URL</label><input id="prod_gw_afn" value="'+esc(state.api.afn.endpoint||gw)+'"></div><label class="tile"><input id="prod_en_afn" type="checkbox" '+(state.api.afn.enabled?'checked':'')+'> Enable AFN Gateway</label></div>'+
      '<div class="panel" style="margin:10px 0"><h4>USDT + AZAD — Shared API</h4><div class="field"><label>Secure Gateway URL</label><input id="prod_gw_crypto" value="'+esc(state.api.crypto.endpoint||gw)+'"></div><label class="tile"><input id="prod_en_crypto" type="checkbox" '+(state.api.crypto.enabled?'checked':'')+'> Enable Crypto Gateway</label></div>'+
      '<div class="panel"><h4>EasyLoad</h4><div class="field"><label>Secure Gateway URL</label><input id="prod_gw_easy" value="'+esc(state.api.easyload.endpoint||gw)+'"></div><label class="tile"><input id="prod_en_easy" type="checkbox" '+(state.api.easyload.enabled?'checked':'')+'> Enable EasyLoad Gateway</label></div>'+
      '<button class="primary gold" onclick="saveProductionAPISettings()">💾 Save</button> <button class="outline" onclick="closeModal()">Close</button>');
  };
  window.saveProductionAPISettings=function(){
    state.api.afn.endpoint=document.getElementById('prod_gw_afn')?.value.trim().replace(/\/$/,'')||'';
    state.api.crypto.endpoint=document.getElementById('prod_gw_crypto')?.value.trim().replace(/\/$/,'')||'';
    state.api.easyload.endpoint=document.getElementById('prod_gw_easy')?.value.trim().replace(/\/$/,'')||'';
