<script id="dx-cache-guard">
/* D Exchange cache guard r3 - atomic open/refresh.
   The page stays hidden (html.dx-boot) until BOTH are true:
     (1) this HTML build was confirmed as the newest on the server (or a single cache-busted reload fetched it), and
     (2) the app finished its first render (dxBoot calls window.__dxBootDone) and late UI updates settled.
   Root causes handled here:
     - a leftover Service Worker could answer the page AND the version check itself with stale HTML -> it is removed first
       (awaited, not fire-and-forget) and, if it was controlling this page, the page reloads once through a cache-busting URL;
     - the page used to be revealed by the version check alone, which could fire before the app had booted
       (login screen / half-built dashboard visible for a moment) -> reveal now waits for the boot gate;
     - the version check no longer downloads the whole file: it reads only the first bytes where the build meta lives. */
(function(){
 var BUILD='2026-10-03-r3',d=document.documentElement,done=false,gate={ver:false,boot:false};
 function noop(){}
 function raf(f){(window.requestAnimationFrame||function(g){setTimeout(g,16)})(f)}
 function reveal(){if(done)return;done=true;d.classList.remove('dx-boot')}
 function settle(){setTimeout(function(){raf(function(){raf(reveal)})},80)}
 function tryReveal(){if(gate.ver&&gate.boot&&!done)settle()}
 window.__dxBootDone=function(){gate.boot=true;tryReveal()};
 try{d.classList.add('dx-boot')}catch(e){}
 setTimeout(reveal,8000); /* hard failsafe: never leave a blank page */
 try{var cu=new URL(location.href);if(cu.searchParams.has('_dxv')){cu.searchParams.delete('_dxv');history.replaceState(null,'',cu.pathname+cu.search+cu.hash)}}catch(e){}
 function cleanup(){
  var ps=[];
  try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)ps.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(noop))}catch(e){}
  try{if(window.caches&&caches.keys)ps.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).catch(noop))}catch(e){}
  try{localStorage.setItem('dx_build',BUILD)}catch(e){}
  return Promise.all(ps);
 }
 function bust(tag){try{var ru=new URL(location.href);ru.searchParams.set('_dxv',tag);location.replace(ru.href)}catch(e){location.reload()}}
 function serverBuild(){
  var base;try{var bu=new URL(location.href);bu.hash='';bu.searchParams.delete('_dxv');base=bu.href}catch(e){return Promise.resolve('')}
  return fetch(base,{cache:'no-cache',credentials:'same-origin'}).then(function(r){
   if(!r.ok)return '';
   if(!r.body||!r.body.getReader||!window.TextDecoder)return r.text();
   var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
   function pump(){return rd.read().then(function(x){
    if(x.done)return buf;
    buf+=dec.decode(x.value,{stream:true});
    if(/name="dx-build" content="[^"]+"/.test(buf)||buf.length>16384){try{rd.cancel()}catch(e){}return buf}
    return pump();
   })}
   return pump();
  });
 }
 function verify(allowReload){
  return serverBuild().then(function(t){
   var m=/name="dx-build" content="([^"]+)"/.exec(t||'');
   if(m&&m[1]!==BUILD){
    var k='dx_reloaded_'+m[1];
    try{if(sessionStorage.getItem(k))return true;sessionStorage.setItem(k,'1')}catch(e){}
    if(allowReload){bust(m[1]);return false}
   }
   return true;
  }).catch(function(){return true});
 }
 function start(){
  if(location.protocol==='file:'||!window.fetch){gate.ver=true;tryReveal();return}
  var hadSW=false;try{hadSW=!!(navigator.serviceWorker&&navigator.serviceWorker.controller)}catch(e){}
  cleanup().then(function(){
   if(hadSW){
    var k='dx_swpurged_'+BUILD;
    try{if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');bust('sw'+Date.now());return false}}catch(e){}
   }
   return verify(true);
  }).then(function(ok){if(ok){gate.ver=true;tryReveal()}},function(){gate.ver=true;tryReveal()});
 }
 start();
 window.addEventListener('pageshow',function(e){if(e.persisted)verify(true)});
})();
</script>

.admin-section-label-v2{grid-column:1/-1;margin:4px 2px -2px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.2px}
.admin-grid-v2 .admin-priority{border-color:rgba(184,137,47,.45);background:linear-gradient(180deg,#fffdf7,#fff)}
.admin-grid-v2 .admin-priority .pico{background:#f4e7c7}
.dark .admin-hero-v2{background:linear-gradient(135deg,#1b1915,#15181d);border-color:#4b402a}
.dark .admin-role-v2{background:#2b261b;color:#d8b86b;border-color:#5a4a2c}
.dark .admin-grid-v2 .profiletile{background:#15181d}
.dark .admin-grid-v2 .profiletile .pico{background:#28231a}

<style id="dx-v27-css">
.dxic img.dxic-flag{object-fit:cover}
.dxq-cur{display:inline-flex;align-items:center;gap:6px;direction:ltr}
.dxr-arrow{color:var(--muted);font-size:14px}
.dxr-grid.dxr-pairs{grid-template-columns:1fr!important}
@media(min-width:760px){.dxr-grid.dxr-pairs{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.dxr-pairs .dxr-head b{font-size:14px;white-space:nowrap}
.dxr-pairs .dxr-val{font-size:15px}
.dxr-mini-h{display:inline-flex;align-items:center;gap:6px}
.dpay-bal span{display:inline-flex;align-items:center;gap:5px}
.dxar-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.dxar{width:100%;border-collapse:collapse;font-size:12px}
.dxar th{padding:8px;text-align:start;color:var(--muted);font-weight:800;font-size:11px;white-space:nowrap}
.dxar td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
.dxar-pair{white-space:nowrap}.dxar-pair span{margin-inline-start:6px;font-weight:800;direction:ltr;display:inline-block}
.dxar-side{font-style:normal;font-weight:800;font-size:10px;margin-inline-start:8px;padding:2px 8px;border-radius:999px;display:inline-block;background:rgba(17,131,111,.12);color:#11836f}.dxar-side.sell{background:rgba(211,32,17,.10);color:#c0392b}
.dxar input{width:100%;min-width:92px;padding:8px;direction:ltr}
.dxar-buy{direction:ltr;text-align:left;font-weight:800;color:#11836f;word-break:break-all}
.dxphone{display:flex;gap:8px;direction:ltr}
.dxphone select{flex:0 0 118px;width:118px;min-width:0}
.dxphone input{flex:1 1 auto;min-width:0}
#rCountry.dx-invalid,#rDial.dx-invalid{border-color:#c94343;box-shadow:0 0 0 2px rgba(201,67,67,.18)}
.dx-eyewrap{position:relative;display:block;width:100%}
.dx-eyewrap>input,.field .dx-eyewrap>input,#loginPass,#rPass{width:100%;padding-inline-end:46px!important}
.dx-eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted,#667085);cursor:pointer;border-radius:10px;padding:0;z-index:2}
.dx-eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dx-eye:hover,.dx-eye:focus-visible{background:rgba(127,127,127,.14);outline:none}
.dxc-table th,.dxc-table td{padding:6px 7px;font-size:12px;line-height:1.25;vertical-align:middle}
.dxc-user{display:flex;align-items:center;gap:8px;min-width:0}
.dxc-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;font-weight:700}
.dxc-av{position:relative;flex:0 0 auto;width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#d9b86b,#a8802f);color:#fff;font-weight:800;font-size:12px}
@media(max-width:480px){.dxc-name{max-width:78px}.dxc-table th,.dxc-table td{padding:5px 4px;font-size:11px}.dxc-table th{white-space:normal;line-height:1.15}.dxc-av{width:22px;height:22px;font-size:11px}.dxc-user{gap:5px}}
.dxc-av i{font-style:normal}
.dxc-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>

  <h1>D Exchange</h1>
  <div class="authsub" data-i18n="authsub">خپل حساب ته ننوزئ یا نوی حساب جوړ کړئ</div>
  <div class="tabs">
   <button id="loginTab" class="active" onclick="authMode('login')">Login</button>
   <button id="regTab" onclick="authMode('register')">Register</button>
  </div>
  <form id="loginForm" onsubmit="login(event)">
   <div class="field"><label>Email</label><input id="loginEmail" type="email" required></div>
   <div class="field"><label>Password</label><input id="loginPass" type="password" required></div>
   <button class="primary gold" style="width:100%">Login</button>
   <div class="note">OTP ته اړتیا نشته. له Login وروسته Session تر هغه دوام کوي چې کاروونکی په خپله Logout وکړي.</div>
  </form>
  <form id="regForm" class="hidden" onsubmit="register(event)">
   <div class="formgrid">
    <div class="field"><label>نوم / First name</label><input id="rFirst" required></div>
    <div class="field"><label>تخلص / Last name</label><input id="rLast" required></div>
    <div class="field"><label>Email</label><input id="rEmail" type="email" required></div>
    <div class="field"><label id="rCountryLbl">Country</label><select id="rCountry" required autocomplete="country"><option value="" selected disabled>Select country</option></select></div>
    <div class="field"><label id="rPhoneLbl">Phone / Country code</label><div class="dxphone"><select id="rDial" aria-label="Country calling code" required></select><input id="rPhone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="70 123 4567" required></div></div>
    <div class="field"><label>Strong password</label><input id="rPass" type="password" minlength="8" required></div>
    <div class="field"><label>Referral code</label><input id="rRef" inputmode="numeric" pattern="[0-9]*" placeholder="1010"></div>
   </div>
   <button class="primary gold" style="width:100%">Create account</button>
   <div class="note">لږ تر لږه 8 کرکټر قوي پاسورډ. OTP نه شته.</div>
  </form>
 </div>
</section>

async function dbHydrateUser(authUser){

    const [{data:profile,error:pe},{data:wallet,error:we},{data:txs,error:te}]=await Promise.all([
      supabaseClient.from("profiles").select("*").eq("id",authUser.id).limit(1).maybeSingle(),
      supabaseClient.from("wallets").select("*").eq("user_id",authUser.id).limit(1).maybeSingle(),
      supabaseClient.from("transactions").select("*").eq("user_id",authUser.id).order("created_at",{ascending:false})

    if(we)throw we;
    if(te)throw te;

        email:authUser.email||"",
        phone:authUser.user_metadata?.phone||"",
        role:"user",
        status:"active",
        points_balance:0
      }).select("*");
      if(ce && ce.code!=="23505")throw ce;
      if(createdProfile&&createdProfile[0])profile=createdProfile[0];
      else {
        const {data:retryProfile,error:re}=await supabaseClient.from("profiles").select("*").eq("id",authUser.id).limit(1).maybeSingle();
        if(re)throw re;
        if(!retryProfile)throw new Error("Profile record not found for this account.");
        profile=retryProfile;
      }
    }
    if(!wallet){
      const {data:createdWallet,error:ce}=await supabaseClient.from("wallets").insert({user_id:authUser.id,afn:0,usdt:0,azad:0}).select("*");
      if(ce && ce.code!=="23505")throw ce;
      if(createdWallet&&createdWallet[0])wallet=createdWallet[0];
      else {
        const {data:retryWallet,error:re}=await supabaseClient.from("wallets").select("*").eq("user_id",authUser.id).limit(1).maybeSingle();
        if(re)throw re;
        if(!retryWallet)throw new Error("Wallet record not found for this account.");

    state.users=state.users.filter(x=>x.id!==u.id);
    state.users.push(u);
    state.current=u.id;

  }catch(e){

/* D Exchange withdrawal safety guard (frontend layer only).
   Prevents double-clicks, same-account duplicate pending withdrawals,
   and repeated submissions from multiple tabs on the same browser.
   Final financial protection must also be enforced server-side/RPC. */
function withdrawSafetyLock(currency){
  const u=current();
  if(!u)return {ok:false};
  const pending=(u.tx||[]).some(t=>t.type==="Withdraw" && t.currency===currency && (!t.status || t.status==="pending"));
  if(pending){ toast(tr("A withdrawal is already pending")); return {ok:false}; }
  const key=`dexchange_withdraw_lock_${u.id||u.email}_${currency}`;
  try{
    const now=Date.now(), existing=Number(localStorage.getItem(key)||0);
    if(existing && now-existing < 15*60*1000){ toast(tr("A withdrawal is already being processed")); return {ok:false}; }
    localStorage.setItem(key,String(now));
  }catch(e){}
  return {ok:true};
}
function releaseWithdrawSafetyLock(currency){
  /* Intentionally not released after a successful submission: the pending
     transaction itself remains the primary frontend guard until its status changes. */

async function syncBotLinkCode(u,force=false){
  if(!dbReady()||!u?.id)return false;
  try{
    if(force||!u.botCode||!u.botCodeExpires||Date.now()>=Number(u.botCodeExpires)){
      const bytes=new Uint32Array(1);
      crypto.getRandomValues(bytes);
      u.botCode=String(100000+(bytes[0]%900000));
      u.botCodeExpires=Date.now()+600000;
    }
    if(force){
      await supabaseClient.from("telegram_link_codes").update({used_at:new Date().toISOString()}).eq("user_id",u.id).is("used_at",null);
    }
    const {error}=await supabaseClient.from("telegram_link_codes").insert({user_id:u.id,code:String(u.botCode),expires_at:new Date(u.botCodeExpires).toISOString()});
    if(error){console.warn("Telegram link code sync",error);return false;}
    save();
    return true;
  }catch(e){console.warn("Telegram link code sync",e);return false}
}

async function dbSaveManagedUser(u){
  /* ROOT CAUSE FIX (admin status disappearing): this used to write role+status straight into profiles from the locally cached copy of the user,
     so a stale/cached role silently overwrote the real one (and a direct role write is not what the secure database path accepts).
     Name/phone/points/balances are saved here; the ROLE is never written from here - only through dexchange_set_user_role (see dxSetRoleVerified). */
  if(!dbReady()||!u)return;
  const pr=await supabaseClient.from("profiles").update({first_name:u.first||"",last_name:u.last||"",phone:u.phone||"",points_balance:Number(u.points||0)}).eq("id",u.id);
  if(pr.error)console.warn("profile save:",pr.error.message);
  const wr=await supabaseClient.from("wallets").update({afn:Number(u.balances.AFN||0),usdt:Number(u.balances.USDT||0),azad:Number(u.balances.AZAD||0)}).eq("user_id",u.id);
  if(wr.error)console.warn("wallet save:",wr.error.message);
  try{
    const {data:cur}=await supabaseClient.from("profiles").select("role,status").eq("id",u.id).maybeSingle();
    if(cur){
      if(u.status&&cur.status!==u.status){
        const rr=await supabaseClient.rpc("dexchange_set_user_role",{p_target_user_id:u.id,p_role:cur.role,p_status:u.status});
        if(rr.error){const fb=await supabaseClient.from("profiles").update({status:u.status}).eq("id",u.id);if(fb.error)throw rr.error}
      }
      u.role=cur.role;   /* the stored role is the truth - never push the cached one back */
    }

function adminTelegramBot(){const b=state.telegramBot||{};const webhook=telegramWebhookUrl();showModal(`<h3>🤖 ${tr("Telegram Bot Settings")}</h3><div class="notice">${tr("Telegram security notice")}</div><div class="field"><label>${tr("Bot Backend / Edge Function URL")}</label><input id="tgBackend" type="url" value="${esc(b.backendUrl||`${state.db.url}/functions/v1/telegram-bot`)}" placeholder="https://YOUR_PROJECT.supabase.co/functions/v1/telegram-bot"></div><div class="field"><label>${tr("D Exchange Website URL")}</label><input id="tgWebsite" type="url" value="${esc(b.websiteUrl||"https://dexchange577.github.io/D-Exchange/")}" placeholder="https://dexchange577.github.io/D-Exchange/"></div><div class="field"><label>${tr("Telegram Bot Token")}</label><input id="tgToken" type="password" autocomplete="new-password" placeholder="123456:AA..."><small class="muted">${b.tokenConfigured?tr("Token is configured on secure backend"):tr("Token is not configured")}</small></div><div class="field"><label>${tr("Bot Username")}</label><input id="tgUsername" value="${esc(b.username||"@Darwish_577_bot")}" placeholder="@YourBot"></div><label style="display:flex;gap:8px;align-items:center;padding:9px 0"><input id="tgOn" type="checkbox" ${b.enabled?"checked":""}> ${tr("Enable Telegram Bot")}</label><div class="field"><label>${tr("Welcome Message")}</label><textarea id="tgWelcome">${esc(b.welcomeMessage||"")}</textarea></div><div class="panel" style="margin:10px 0"><b>${tr("Webhook URL")}</b><div class="copyline" style="margin-top:7px"><input id="tgWebhook" readonly value="${esc(webhook)}"><button class="outline" onclick="copyText('tgWebhook')">${tr("Copy")}</button></div><small class="muted">${tr("Telegram webhook notice")}</small></div><div class="panel" style="margin:10px 0"><b>${tr("Bot Feature Controls")}</b>${telegramFeatureRows()}</div><div class="actions"><button class="primary gold" onclick="saveTelegramBot()">${tr("Save Bot Settings")}</button><button class="outline" onclick="testTelegramBot()">${tr("Test Token")}</button><button class="outline" onclick="setTelegramWebhook()">${tr("Connect Webhook")}</button><button class="outline" onclick="deleteTelegramWebhook()">${tr("Disconnect Webhook")}</button><button class="outline" onclick="closeModal()">${tr("Close")}</button></div>`)}
function toggleTelegramFeature(k){state.telegramBot.features=state.telegramBot.features||{};state.telegramBot.features[k]=state.telegramBot.features[k]===false;save();adminTelegramBot()}
async function saveTelegramBot(){const backend=document.getElementById("tgBackend").value.trim().replace(/\/$/,"");const username=document.getElementById("tgUsername").value.trim();const token=document.getElementById("tgToken").value.trim();state.telegramBot.backendUrl=backend;state.telegramBot.webhookUrl=backend;state.telegramBot.websiteUrl=document.getElementById("tgWebsite").value.trim();state.telegramBot.username=username||"@YourBot";state.telegramBot.enabled=document.getElementById("tgOn").checked;state.telegramBot.welcomeMessage=document.getElementById("tgWelcome").value.trim();save();if(dbReady()){try{await dbSyncAdminSettings()}catch(e){console.warn(e)} }if(token){const r=await botBackend("save_token",{token,username:state.telegramBot.username});if(r?.error)return toast(r.error);state.telegramBot.tokenConfigured=true;save();}toast(tr("Telegram bot settings saved"));adminTelegramBot()}
async function testTelegramBot(){const token=document.getElementById("tgToken")?.value.trim();const r=token?await botBackend("test_token",{token}):await botBackend("status",{});if(r?.error)return toast(r.error);toast(r?.username?`@${r.username} — ${tr("Bot connection successful")}`:tr("Bot connection successful"))}
async function setTelegramWebhook(){const backend=document.getElementById("tgBackend")?.value.trim().replace(/\/$/,"")||telegramWebhookUrl();state.telegramBot.backendUrl=backend;state.telegramBot.webhookUrl=backend;save();const r=await botBackend("set_webhook",{webhookUrl:backend,features:state.telegramBot.features});if(r?.error)return toast(r.error);toast(tr("Telegram webhook connected"));adminTelegramBot()}
async function deleteTelegramWebhook(){const r=await botBackend("delete_webhook",{});if(r?.error)return toast(r.error);toast(tr("Telegram webhook disconnected"));adminTelegramBot()}
function adminAPIs(){const a=state.api;showModal(`<h3>${tr("API Settings")}</h3><div class="notice">${tr("API settings ready notice")}</div><div class="panel" style="margin:10px 0"><h4>AFN — HesabPay</h4><div class="field"><label>API Key</label><input id="afnkey" type="password" autocomplete="off" value="${esc(a.afn.key||"")}" placeholder="HesabPay API Key"></div><div class="field"><label>Secret Key</label><input id="afnsecret" type="password" autocomplete="off" value="${esc(a.afn.secret||"")}" placeholder="Secret Key"></div><label style="display:flex;gap:8px;align-items:center;padding:8px 0"><input id="afnon" type="checkbox" ${a.afn.enabled?"checked":""}> ${tr("Enable")}</label></div><div class="panel" style="margin:10px 0"><h4>USDT + AZAD</h4><div class="field"><label>API Key</label><input id="cryptokey" type="password" autocomplete="off" value="${esc(a.crypto.key||"")}" placeholder="USDT / AZAD API Key"></div><div class="field"><label>Secret Key</label><input id="cryptosecret" type="password" autocomplete="off" value="${esc(a.crypto.secret||"")}" placeholder="Secret Key"></div><label style="display:flex;gap:8px;align-items:center;padding:8px 0"><input id="cryptoon" type="checkbox" ${a.crypto.enabled?"checked":""}> ${tr("Enable")}</label></div><div class="notice">${tr("API security notice")}</div><button class="primary gold" onclick="saveAPIs()">${tr("Save")}</button> <button class="outline" onclick="closeModal()">${tr("Cancel")}</button>`) }
function apiBlock(k,title,a){return `<div class="panel" style="margin:10px 0"><h4>${title}</h4><div class="field"><label>${tr("Endpoint")}</label><input id="${k}ep" value="${esc(a.endpoint||"")}"></div><div class="field"><label>${tr("API Key")}</label><input id="${k}key" type="password" value="${esc(a.key||"")}" autocomplete="off"></div><label style="display:flex;gap:7px;align-items:center;font-size:10px"><input id="${k}on" type="checkbox" ${a.enabled?"checked":""}> ${tr("Enabled")}</label><div class="field" style="margin-top:8px"><label>${tr("Webhook URL")}</label><div class="copyline"><input id="${k}wh" readonly value="${esc(webhookUrl(k))}"><button class="outline" onclick="copyText('${k}wh')">${tr("Copy")}</button></div></div>${k==="crypto"?`<div class="field"><label>${tr("USDT BEP20 deposit address")}</label><input id="cryptoUSDTAddr" value="${esc((a.addresses||{}).USDT||"")}"></div><div class="field"><label>${tr("AZAD BEP20 deposit address")}</label><input id="cryptoAZADAddr" value="${esc((a.addresses||{}).AZAD||"")}"></div>`:""}</div>`}
function saveAPIs(){state.api.afn.key=document.getElementById("afnkey").value.trim();state.api.afn.secret=document.getElementById("afnsecret").value.trim();state.api.afn.enabled=document.getElementById("afnon").checked;state.api.crypto.key=document.getElementById("cryptokey").value.trim();state.api.crypto.secret=document.getElementById("cryptosecret").value.trim();state.api.crypto.enabled=document.getElementById("cryptoon").checked;save();closeModal();openView("admin");toast(tr("API settings saved"))}
function adminUsers(){showModal(`<h3>${tr("User Management")}</h3><div class="field"><label>${tr("Search")}</label><input id="userSearch" oninput="renderUserTable()" placeholder="${tr("Search by name or email")}"></div><div id="userTable"></div><button class="outline" style="margin-top:10px" onclick="closeModal()">${tr("Close")}</button>`);renderUserTable()}
function renderUserTable(){const q=(document.getElementById("userSearch")?.value||"").trim().toLowerCase();const list=state.users.filter(u=>u.status!=="deleted"&&(u.email.toLowerCase().includes(q)||(u.first+" "+u.last).toLowerCase().includes(q)));document.getElementById("userTable").innerHTML=`<div class="tablewrap"><table class="table"><tr><th>${tr("User")}</th><th>${tr("Email")}</th><th>${tr("Role")}</th><th>${tr("Status")}</th><th>${tr("Balance")}</th><th>${tr("Manage")}</th></tr>${list.map(u=>`<tr><td>${esc(u.first+" "+u.last)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.status)}</td><td>AFN ${u.balances.AFN.toFixed(2)} / USDT ${u.balances.USDT.toFixed(2)} / AZAD ${u.balances.AZAD.toFixed(2)}</td><td><button class="outline" onclick="manageUser('${u.id}')">${tr("Manage")}</button></td></tr>`).join("")||`<tr><td colspan="6">${tr("No users")}</td></tr>`}</table></div>`}
function manageUser(id){const u=state.users.find(x=>x.id===id);if(!u)return;showModal(`<h3>${tr("Manage")}: ${esc(u.first+" "+u.last)}</h3><div class="compact-grid"><div class="tile"><b>${tr("Email")}</b><small>${esc(u.email)}</small></div><div class="tile"><b>${tr("Phone")}</b><small>${esc(u.phone)}</small></div></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>${tr("AFN Balance")}</label><input id="mA" type="number" value="${u.balances.AFN}"></div><div class="field"><label>${tr("USDT Balance")}</label><input id="mU" type="number" value="${u.balances.USDT}"></div><div class="field"><label>${tr("AZAD Balance")}</label><input id="mZ" type="number" value="${u.balances.AZAD}"></div><div class="field"><label>${tr("Role")}</label><select id="mR"><option value="user" ${u.role==="user"?"selected":""}>${tr("User")}</option><option value="admin" ${u.role==="admin"?"selected":""}>${tr("Admin")}</option></select></div><div class="field"><label>${tr("Status")}</label><select id="mS"><option value="active" ${u.status==="active"?"selected":""}>${tr("Active")}</option><option value="blocked" ${u.status==="blocked"?"selected":""}>${tr("Blocked")}</option><option value="deleted" ${u.status==="deleted"?"selected":""}>${tr("Deleted")}</option></select></div></div><div class="notice">${tr("Password not viewable")}</div><button class="primary gold" onclick="saveManagedUser('${u.id}')">${tr("Save")}</button> <button class="outline" onclick="resetUserPassword('${u.id}')">${tr("Reset Password")}</button> <button class="outline" onclick="adminUsers()">${tr("Back")}</button>`)}
function saveManagedUser(id){const u=state.users.find(x=>x.id===id);u.balances.AFN=+document.getElementById("mA").value||0;u.balances.USDT=+document.getElementById("mU").value||0;u.balances.AZAD=+document.getElementById("mZ").value||0;u.role=document.getElementById("mR").value;u.status=document.getElementById("mS").value;if(u.email.toLowerCase()===ADMIN_EMAIL)u.role="admin";save();if(dbReady())dbSaveManagedUser(u).catch(console.warn);closeModal();adminUsers();toast(tr("User updated"))}
function resetUserPassword(id){const u=state.users.find(x=>x.id===id);if(!u)return;const p=prompt(tr("Enter new password"));if(!p||p.length<8)return toast(tr("Password too short"));u.pass=p;save();toast(tr("Password reset"))}
function adminTransactions(){const all=[];state.users.forEach(u=>u.tx.forEach(t=>all.push({...t,userId:u.id,user:u.email,name:u.first+" "+u.last})));all.sort((a,b)=>b.time.localeCompare(a.time));showModal(`<h3>${tr("All Transactions")}</h3><div class="tablewrap"><table class="table"><tr><th>${tr("User")}</th><th>${tr("Type")}</th><th>${tr("Amount")}</th><th>${tr("Currency")}</th><th>${tr("Transaction Status")}</th><th>${tr("Time")}</th><th>${tr("Details")}</th></tr>${all.map(t=>`<tr><td>${esc(t.name)}<br>${esc(t.user)}</td><td>${esc(t.type)}</td><td>${t.amount}</td><td>${esc(t.currency)}</td><td><select onchange="adminSetTxStatus('${t.userId}','${t.id}',this.value)"><option value="pending" ${(!t.status||t.status==="pending")?"selected":""}>${tr("Status Pending")}</option><option value="confirmed" ${t.status==="confirmed"?"selected":""}>${tr("Status Confirmed")}</option><option value="rejected" ${t.status==="rejected"?"selected":""}>${tr("Status Rejected")}</option></select></td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.ref||t.dest||t.phone||t.address||t.to||"—")}</td></tr>`).join("")||`<tr><td colspan="7">${tr("No transactions")}</td></tr>`}</table></div><button class="outline" style="margin-top:10px" onclick="closeModal()">${tr("Close")}</button>`)}
function adminSetTxStatus(userId,txId,status){const u=state.users.find(x=>x.id===userId),t=u?.tx.find(x=>x.id===txId);if(!u||!t)return;const prev=t.status||"pending";if(prev===status)return;if(status==="rejected"&&prev!=="rejected"&&t.type==="Withdraw"){u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||0);t.balanceAfter=u.balances[t.currency];t.meta={...(t.meta||{}),refunded:true}}if(status==="confirmed"&&prev!=="confirmed"&&t.type==="Deposit"){u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||t.out||0);t.balanceAfter=u.balances[t.currency]}t.status=status;t.statusChangedAt=new Date().toISOString();save();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr("Status updated"));adminTransactions()}

<script>
(function(){
  'use strict';

  /* D EXCHANGE v14 - production safety + EasyLoad manual approval patch */
  state.processingModes = state.processingModes || {deposit:'automatic',withdraw:'automatic',easyload:'manual'};
  if(state.easyloadModeInitialized !== true){
    state.processingModes.easyload='manual';
    state.easyloadModeInitialized=true;
  }
  state.processingModes.deposit = state.processingModes.deposit==='manual' ? 'manual' : 'automatic';
  state.processingModes.withdraw = state.processingModes.withdraw==='manual' ? 'manual' : 'automatic';
  state.processingModes.easyload = state.processingModes.easyload==='automatic' ? 'automatic' : 'manual';

  /* Never keep provider secrets in browser state/localStorage. */
  function sanitizeApiState(){
    state.api=state.api||{};
    for(const k of ['afn','crypto','easyload']){
      state.api[k]=state.api[k]||{};
      delete state.api[k].key;
      delete state.api[k].secret;
    }
  }
  sanitizeApiState();

  /* Keep the existing save function but make every future save sanitize first. */
  const baseSave=window.save;
  window.save=function(){sanitizeApiState(); return baseSave.apply(this,arguments)};

  /* EasyLoad: deduct/reserve AFN once, then confirm/reject from admin. */
  window.doEasy=function(){
    const u=current(), a=Number(document.getElementById('elAmt')?.value||0), p=String(document.getElementById('elPhone')?.value||'').trim();
    if(!u||!a||a<=0||!p)return toast(tr('Amount and phone required'));
    if(Number(u.balances.AFN||0)<a)return toast(tr('Insufficient balance'));
    const mode=state.processingModes?.easyload||'manual';
    const before=Number(u.balances.AFN||0), after=before-a;
    const t={
      id:uid(),txId:uid(),type:'Easyload',amount:a,currency:'AFN',
      from:`Account ${u.email}`,to:`Mobile ${p}`,phone:p,
      status:mode==='automatic'?'confirmed':'pending',approvalMode:mode,
      time:new Date().toISOString(),fee:0,balanceBefore:before,balanceAfter:after,
      meta:{processingMode:mode,phone:p,reserved:true,refunded:false,pointsAwarded:false}
    };
    u.balances.AFN=after;
    if(mode==='automatic' && state.pointsRules.enabled){
      u.points+=Number(state.pointsRules.easyload)||0;
      t.meta.pointsAwarded=true;
    }
    u.tx.unshift(t);
    saveV14();
    if(dbReady())dbSyncCurrent().catch(console.warn);
    toast(mode==='automatic'?tr('Easyload successful'):tr('Easyload request sent'));
    openView('dashboard');
  };

  /* Idempotent admin status transition for Deposit / Withdraw / EasyLoad. */
  window.adminSetTxStatus=function(userId,txId,status){
    if(!ensureAdmin())return toast(tr('Admin only'));
    const u=state.users.find(x=>x.id===userId), t=u?.tx.find(x=>x.id===txId);
    if(!u||!t)return;
    const prev=t.status||'pending';
    if(prev===status)return;
    t.meta=t.meta||{};

    if(t.type==='Withdraw' && status==='rejected' && prev!=='rejected' && !t.meta.refunded){
      u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||0);
      t.balanceAfter=u.balances[t.currency];
      t.meta.refunded=true;
    }

    if(t.type==='Deposit' && status==='confirmed' && prev!=='confirmed' && !t.meta.credited){
      const amount=Number(t.amount||t.out||0);
      if(amount>0){
        u.balances[t.currency]=(Number(u.balances[t.currency])||0)+amount;
        t.balanceAfter=u.balances[t.currency];
      }
      t.meta.credited=true;
    }

    if(t.type==='Easyload'){
      if(status==='confirmed' && prev!=='confirmed'){
        if(t.meta.refunded)return toast('This Easyload was already refunded and cannot be approved');
        if(!t.meta.pointsAwarded && state.pointsRules.enabled){
          u.points=(Number(u.points)||0)+Number(state.pointsRules.easyload||0);
          t.meta.pointsAwarded=true;
        }
        t.meta.approvedAt=new Date().toISOString();
      }
      if(status==='rejected' && prev!=='rejected'){
        if(!t.meta.refunded){
          u.balances.AFN=(Number(u.balances.AFN)||0)+Number(t.amount||0);
          t.balanceAfter=u.balances.AFN;
          t.meta.refunded=true;
        }

<script>
/* D EXCHANGE v16 — functional referral + secure provider flow patch */
(function(){
  function awardFirstSwapReferral(u, swapTx){
    if(!u || u.refRewardGiven || !u.referredBy) return false;
    const inviter=state.users.find(x=>String(x.referralCode)===String(u.referredBy) && x.id!==u.id && x.status==='active');
    if(!inviter) return false;
    const reward=5;
    inviter.points=(Number(inviter.points)||0)+reward;
    inviter.activeRef=(Number(inviter.activeRef)||0)+1;
    inviter.refRewardGiven=inviter.refRewardGiven||false;
    inviter.tx=Array.isArray(inviter.tx)?inviter.tx:[];
    inviter.tx.unshift({id:uid(),txId:uid(),type:'Referral Bonus',amount:reward,currency:'POINTS',from:`Referral ${u.email}`,to:`Account ${inviter.email}`,status:'confirmed',time:new Date().toISOString(),fee:0,balanceBefore:Number(inviter.points)-reward,balanceAfter:Number(inviter.points),meta:{reward:5,sourceUserId:u.id,sourceSwapTxId:swapTx?.txId||null,firstSwap:true,awardedOnce:true}});
    u.refRewardGiven=true;
    if(dbReady()){
      Promise.allSettled([dbSyncCurrent(), (async()=>{
        const profile={id:inviter.id,points_balance:Number(inviter.points||0)};
        await supabaseClient.from('profiles').upsert(profile,{onConflict:'id'});
        const t=inviter.tx[0];
        await supabaseClient.from('transactions').upsert({user_id:inviter.id,tx_id:String(t.txId),type:'points_adjustment',currency:'POINTS',amount:reward,received_amount:reward,fee:0,from_value:t.from,to_value:t.to,approval_mode:'automatic',status:'confirmed',balance_before:t.balanceBefore,balance_after:t.balanceAfter,metadata:t.meta,created_at:t.time},{onConflict:'tx_id'});
      })()]).catch(console.warn);
    }
    return true;
  }
  window.awardFirstSwapReferral=awardFirstSwapReferral;

  const originalDoSwap=window.doSwap;
  window.doSwap=function(){
    const before=current();
    if(!before) return;
    const result=originalDoSwap();
    try{
      const u=current();
      const latest=u?.tx?.[0];
      if(u && latest && latest.type==='Swap' && latest.status==='confirmed' && !u.refRewardGiven){
        const ok=awardFirstSwapReferral(u,latest);
        if(ok){ save(); if(dbReady()) dbSyncCurrent().catch(console.warn); toast('Referral bonus: +5 points'); }
      }
    }catch(e){console.warn('Referral first-swap award',e)}
    return result;
  };

  /* Make Referral navigation independent of dashboard markup. */
  const originalOpen=window.openView;
  window.openView=function(name){
    if(name==='referral'){
      if(!current()) return showAuth();
      try { return referral(document.getElementById('view')); } catch(e){ console.error(e); return toast('Referral page error'); }
    }
    return originalOpen(name);
  };

  /* Correct provider-facing AFN deposit payload: create a transaction id first and send it as item id/memo. */
  window.doDepositAFN=async function(){
    const u=current(), phone=document.getElementById('depPhone')?.value.trim(), a=Number(document.getElementById('depAmt')?.value||0);
    if(!u||!phone||a<=0)return toast(tr('Amount and phone required'));
    if(!state.api?.afn?.enabled)return toast(tr('AFN API is not configured'));
    const endpoint=String(state.api.afn.endpoint||'').replace(/\/$/,''); if(!endpoint)return toast('Secure gateway URL is not configured');
    const txId=uid(), before=Number(u.balances.AFN||0);
    const t={id:txId,txId,type:'Deposit',amount:a,currency:'AFN',from:`HesabPay ${phone}`,to:`Account ${u.email}`,phone,status:'pending',approvalMode:'automatic',time:new Date().toISOString(),fee:0,balanceBefore:before,balanceAfter:before,meta:{provider:'hesabpay',external_user_id:u.id,credited:false}};
    u.tx.unshift(t); save();
    try{
      const r=await fetch(endpoint+'/hesabpay/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:String(a),phone,email:u.email,external_user_id:u.id,transaction_id:txId})});
      const d=await r.json().catch(()=>({})); if(!r.ok||!d.ok)throw new Error(d.message||('HTTP '+r.status));
      t.meta.payment_id=d.payment_id||null; t.meta.session_id=d.session_id||null; t.meta.payment_url=d.payment_url||null; save();

    }catch(e){ u.tx=u.tx.filter(x=>x.id!==txId); save(); toast(e.message||'HesabPay request failed'); }
  };
})();

window.v20AddCurrency=function(){const code=document.getElementById('v20ccode')?.value.trim().toUpperCase(),name=document.getElementById('v20cname')?.value.trim(),symbol=(document.getElementById('v20csymbol')?.value.trim().toUpperCase()||code);if(!/^[A-Z0-9_]{2,12}$/.test(code))return toast('Invalid currency code');if(!name)return toast('Currency name is required');if(v20Currency(code))return toast('Currency already exists');state.currencies.push({code,name,symbol,enabled:true,deposit:true,withdraw:true,processing:{deposit:'manual',withdraw:'manual'},api:{enabled:false,endpoint:'',integrationId:uid()}});v20EnsureAllBalances(code);v20PersistSettings();adminCurrencyControls();toast('Currency added')};

window.v20RemoveCurrency=function(code){const c=v20Currency(code);if(!c)return;if(V20_CORE.includes(code)){c.enabled=false;c.deposit=false;c.withdraw=false}else{state.currencies=state.currencies.filter(x=>x.code!==code)}v20PersistSettings();adminCurrencyControls();toast(V20_CORE.includes(code)?'Currency disabled':'Currency removed')};
window.v20EditCurrency=function(code){const c=v20Currency(code);if(!c)return;showModal(`<h3>⚙️ ${v20Esc(c.code)} Settings</h3><div class="field"><label>Name</label><input id="v20en" value="${v20Esc(c.name)}"></div><div class="field"><label>Symbol</label><input id="v20es" value="${v20Esc(c.symbol)}"></div><div class="compact-grid"><label class="tile"><input id="v20ed" type="checkbox" ${c.deposit?'checked':''}> Deposit فعال</label><label class="tile"><input id="v20ew" type="checkbox" ${c.withdraw?'checked':''}> Withdraw فعال</label></div><div class="panel" style="margin-top:10px"><b>Processing Mode</b><div class="compact-grid" style="margin-top:8px"><button class="outline" onclick="v20SetMode('${code}','deposit','automatic')">⚡ Deposit Automatic</button><button class="outline" onclick="v20SetMode('${code}','deposit','manual')">✋ Deposit Manual</button><button class="outline" onclick="v20SetMode('${code}','withdraw','automatic')">⚡ Withdraw Automatic</button><button class="outline" onclick="v20SetMode('${code}','withdraw','manual')">✋ Withdraw Manual</button></div><small class="muted">Deposit: ${c.processing.deposit} · Withdraw: ${c.processing.withdraw}</small></div><button class="primary gold" onclick="v20SaveCurrency('${code}')">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`)};
window.v20SetMode=function(code,kind,mode){const c=v20Currency(code);if(c)c.processing[kind]=mode;v20EditCurrency(code)};
window.v20SaveCurrency=function(code){const c=v20Currency(code);if(!c)return;c.name=document.getElementById('v20en').value.trim()||c.name;c.symbol=document.getElementById('v20es').value.trim().toUpperCase()||c.code;c.deposit=document.getElementById('v20ed').checked;c.withdraw=document.getElementById('v20ew').checked;c.enabled=true;v20PersistSettings();closeModal();adminCurrencyControls();toast('Currency settings saved')};
window.swap=function(v){const opts=v20Active().map(c=>c.code);if(!state.features.swap)return v.innerHTML=`<div class="screen">${screenHead(tr('Swap'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;v.innerHTML=`<div class="screen">${screenHead(tr('Swap'),'Dynamic Currency Exchange')}<div class="panel"><div class="quickform"><div class="field"><label>${tr('From')}</label><select id="swFrom" onchange="quoteSwap()">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${tr('To')}</label><select id="swTo" onchange="quoteSwap()">${opts.map((x,i)=>`<option ${i===1?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>${tr('Amount')}</label><input id="swAmt" type="number" min="0" step="any" oninput="quoteSwap()"></div><div class="quote" id="swQuote">${tr('Quote here')}</div><button class="primary gold" style="width:100%;margin-top:10px" onclick="v20DoSwap()">${tr('Confirm Swap')}</button><button class="outline" style="width:100%;margin-top:8px" onclick="openView('swapHistory')">🧾 Swap History</button></div></div>`};
window.v20DoSwap=function(){const u=current(),f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value,a=Number(document.getElementById('swAmt')?.value||0);if(!u||!a||a<=0||f===t)return toast('Invalid swap');v20EnsureBalances(u);if(Number(u.balances[f]||0)<a)return toast(tr('Insufficient balance'));const q=window.dxSwapQuote(f,t,a);if(!q.valid)return toast(tr('Rate is not configured'));if(window.__dxLastQuote&&window.__dxLastQuote!==q.key){if(typeof quoteSwap==='function')quoteSwap();return toast(tr('Quote updated, please review'))}const out=q.net,bf=Number(u.balances[f]||0),bt=Number(u.balances[t]||0);u.balances[f]=Math.max(0,Math.round((bf-a)*1e8)/1e8);u.balances[t]=Math.round((bt+out)*1e8)/1e8;u.tx.unshift({id:uid(),txId:'DX-'+uid().toUpperCase(),type:'Swap',amount:a,currency:f,out,from:`Account ${u.email}`,to:t,status:'confirmed',approvalMode:'automatic',time:new Date().toISOString(),fee:q.feePct,balanceBefore:bf,balanceAfter:u.balances[f],meta:{toBalanceBefore:bt,toBalanceAfter:u.balances[t],rate:q.rate,exchangeRate:q.rate,rateText:q.rateText,side:q.side,rateKey:q.rateKey,rateLabel:q.rateLabel,fromCurrency:f,toCurrency:t,grossAmount:q.gross,feePercent:q.feePct,feeAmount:q.fee,feeCurrency:t,netAmount:q.net}});window.__dxLastQuote=null;if(state.pointsRules?.enabled)u.points=(Number(u.points)||0)+Number(state.pointsRules.swap||0);save();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr('Swap complete'));openView('swapHistory')};
function v20TxPage(type,title,icon){const u=current();const map={Deposit:'Deposit',Withdraw:'Withdraw',Swap:'Swap',Easyload:'Easyload'};const rows=(u?.tx||[]).filter(t=>t.type===map[type]);return `<div class="screen">${screenHead(title,'Full transaction history')}<div class="v20-history-tabs">${[['Deposit','💳'],['Withdraw','📤'],['Swap','⇄'],['Easyload','📱'],['Benefits','⭐']].map(([k,i])=>`<button class="${type===k?'active':''}" onclick="openView('${k.toLowerCase()}History')">${i} ${k}</button>`).join('')}</div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Amount</th><th>Currency</th><th>Status</th><th>Time</th><th>Details</th></tr>${rows.slice().reverse().map(t=>`<tr onclick="showTxDetails('${esc(t.id)}')"><td>${esc(t.type)}</td><td>${t.amount}${t.out!=null?' → '+t.out:''}</td><td>${esc(t.currency)}</td><td>${txStatusBadge(t.status)}</td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.txId||t.to||'—')}</td></tr>`).join('')||`<tr><td colspan="6">No ${type} transactions.</td></tr>`}</table></div></div>`}
function v20BenefitsHistory(){const u=current();const rows=(u?.tx||[]).filter(t=>/Points|Bonus|Referral/i.test(t.type||'')||t.currency==='POINTS');return `<div class="screen">${screenHead('Benefits Transactions','Points and rewards history')}<div class="v20-history-tabs">${[['Deposit','💳'],['Withdraw','📤'],['Swap','⇄'],['Easyload','📱'],['Benefits','⭐']].map(([k,i])=>`<button class="${'Benefits'===k?'active':''}" onclick="openView('${k.toLowerCase()}History')">${i} ${k}</button>`).join('')}</div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Amount</th><th>Currency</th><th>Status</th><th>Time</th><th>Details</th></tr>${rows.slice().reverse().map(t=>`<tr><td>${esc(t.type)}</td><td>${t.amount}</td><td>${esc(t.currency)}</td><td>${txStatusBadge(t.status)}</td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.txId||t.to||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No benefits transactions.</td></tr>'}</table></div></div>`}
window.openView=(function(old){return function(name){if(name==='depositHistory')return document.getElementById('view').innerHTML=v20TxPage('Deposit','Deposit Transactions','💳');if(name==='withdrawHistory')return document.getElementById('view').innerHTML=v20TxPage('Withdraw','Withdraw Transactions','📤');if(name==='swapHistory')return document.getElementById('view').innerHTML=v20TxPage('Swap','Swap Transactions','⇄');if(name==='easyloadHistory')return document.getElementById('view').innerHTML=v20TxPage('Easyload','Easyload Transactions','📱');if(name==='benefitsHistory')return document.getElementById('view').innerHTML=v20BenefitsHistory();return old(name)}})(window.openView);
function v20AddHistoryButton(selector,name,label){const root=document.getElementById('view');if(!root)return;if(root.querySelector('[data-v20-history="'+name+'"]'))return;const b=document.createElement('button');b.className='outline';b.dataset.v20History=name;b.style.cssText='width:100%;margin-top:8px';b.textContent='🧾 '+label;b.onclick=()=>openView(name);root.querySelector('.panel')?.appendChild(b)}
for(const [fn,history,label] of [['deposit','depositHistory','Deposit History'],['withdraw','withdrawHistory','Withdraw History'],['easyload','easyloadHistory','Easyload History'],['benefits','benefitsHistory','Benefits Transactions']]){const old=window[fn];if(typeof old==='function')window[fn]=function(v){old(v);setTimeout(()=>v20AddHistoryButton(null,history,label),0)}}
/* Remove Tasks completely from user/admin UI. */
function v20RemoveTasks(){document.querySelectorAll('.action,.profiletile,button,a').forEach(el=>{if(/Tasks|Task Verification|Task Submissions|دندې|ټاسک/i.test(el.textContent||'')){el.remove()}})}
const oldDash=window.dashboard;window.dashboard=function(v){oldDash(v);v20RemoveTasks();v.querySelector('.walletlogo')?.remove()};
const oldAdmin=window.admin;window.admin=function(v){oldAdmin(v);v20RemoveTasks();const grid=v.querySelector('.profilegrid');if(grid&&!grid.querySelector('[data-v20-currency]')){const b=document.createElement('button');b.className='profiletile';b.dataset.v20Currency='1';b.onclick=adminCurrencyControls;b.innerHTML='<span class="pico">💱</span><span><b>Currency Control</b><small>Add, remove, rates, processing and API</small></span>';grid.prepend(b)}const oldCur=grid&&grid.querySelector('[data-v13-admin="currency"]');if(oldCur)oldCur.remove()};
window.adminAPIs=function(){const cs=v20Active();showModal(`<h3>🔌 API Settings</h3><div class="notice">د هرې کرنسي API یوازې هغه وخت ښکاري چې د هغې processing mode Automatic وي. Manual/Approval کې یوازې فعال/غیر فعال کنټرول پاتې کېږي.</div>${cs.map(c=>{const auto=c.processing.deposit==='automatic'||c.processing.withdraw==='automatic';return `<div class="panel" style="margin:10px 0"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${v20Esc(c.code)} — ${v20Esc(c.name)}</b><small class="muted" style="display:block">Deposit: ${c.processing.deposit} · Withdraw: ${c.processing.withdraw}</small></div><label><input id="v20api_on_${c.code}" type="checkbox" ${c.api.enabled?'checked':''}> فعال</label></div>${auto?`<div class="field" style="margin-top:8px"><label>Secure API / Gateway URL</label><input id="v20api_ep_${c.code}" value="${v20Esc(c.api.endpoint)}" placeholder="https://.../functions/v1/dexchange-gateway"></div><div class="notice">API Key / Secret باید یوازې په Supabase Secrets کې وساتل شي.</div>`:'<div class="notice" style="margin-top:8px">✋ Manual/Admin Approval: API settings پټ دي.</div>'}</div>`}).join('')}<button class="primary gold" onclick="v20SaveAPIs()">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`) };
window.v20SaveAPIs=function(){for(const c of v20Active()){c.api.enabled=document.getElementById('v20api_on_'+c.code)?.checked||false;if(c.processing.deposit==='automatic'||c.processing.withdraw==='automatic')c.api.endpoint=document.getElementById('v20api_ep_'+c.code)?.value.trim()||'';else{c.api.enabled=false;c.api.endpoint=''}}v20PersistSettings();closeModal();toast('API settings saved');openView('admin')};
/* Profile: structured actions + real Supabase Storage avatar upload. */
window.profile=function(v){const u=current();v20EnsureBalances(u);v.innerHTML=`<div class="screen">${screenHead(tr('Profile'),tr('Account settings'))}<div class="panel"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="v20-avatar">${u.avatar?`<img src="${esc(u.avatar)}">`:(esc((u.first||'D').charAt(0).toUpperCase()))}</div><div style="flex:1;min-width:180px"><h3 style="margin:0">${esc((u.first||'')+' '+(u.last||''))}</h3><small class="muted">${esc(u.email)}</small><div class="muted" style="margin-top:5px">${esc(u.phone||'—')}</div></div><button class="primary gold" onclick="openProfileEdit()">✏️ ${tr('Edit')}</button></div></div><div class="v20-profile-actions"><button class="profiletile" onclick="v20EditField('first')">👤 <b>نوم</b><small>${esc(u.first||'—')}</small></button><button class="profiletile" onclick="v20EditField('last')">📝 <b>تخلص</b><small>${esc(u.last||'—')}</small></button><button class="profiletile" onclick="v20EditField('email')">✉️ <b>ایمیل</b><small>${esc(u.email||'—')}</small></button><button class="profiletile" onclick="v20EditField('phone')">📱 <b>موبایل شمېره</b><small>${esc(u.phone||'—')}</small></button><button class="profiletile" onclick="v20EditField('referral')">🔗 <b>Referral</b><small>${esc(u.referralCode||'—')}</small></button><button class="profiletile" onclick="v20AvatarPick()">🖼️ <b>انځور</b><small>انځور بدلول</small></button><button class="profiletile" onclick="openSecurity()">🔐 <b>امنیت</b><small>Email / Password</small></button><button class="profiletile" onclick="openAppearance()">🌐 <b>ژبه او بڼه</b><small>پښتو / دری / English</small></button><button class="profiletile" onclick="openView('transactions')">🧾 <b>عمومي معاملات</b><small>ټوله تاریخچه</small></button>${ensureAdmin()?`<button class="profiletile" onclick="openView('admin')">⚙️ <b>Admin Panel</b><small>System Control</small></button>`:''}<button class="profiletile" onclick="logout()">↪ <b>وتل</b><small>Logout</small></button></div><input id="v20avatarInput" type="file" accept="image/*" style="display:none" onchange="v20UploadAvatar(this)"></div>`};
window.v20EditField=function(field){const u=current();const labels={first:'نوم',last:'تخلص',email:'ایمیل',phone:'موبایل شمېره',referral:'Referral Code'};showModal(`<h3>✏️ ${labels[field]}</h3><div class="field"><label>${labels[field]}</label><input id="v20field" value="${esc(field==='referral'?u.referralCode:u[field]||'')}" ${field==='referral'?'readonly':''}></div><button class="primary gold" onclick="v20SaveField('${field}')">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`)};
window.v20SaveField=async function(field){const u=current(),val=document.getElementById('v20field')?.value.trim();if(!val)return toast('Value is required');if(field==='email'&&!/^\S+@\S+\.\S+$/.test(val))return toast('Invalid email');if(field!=='referral')u[field]=val;save();if(dbReady())await dbSyncCurrent().catch(console.warn);closeModal();openView('profile');toast('Profile updated')};
window.v20AvatarPick=function(){document.getElementById('v20avatarInput')?.click()};
window.v20UploadAvatar=async function(input){const f=input.files?.[0],u=current();if(!f||!u)return;if(f.size>5*1024*1024)return toast('Image must be 5MB or less');if(!/^image\//.test(f.type))return toast('Select an image');if(!dbReady())return toast('Database is not connected');try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`${u.id}/avatar-${Date.now()}.${ext}`;const up=await supabaseClient.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(up.error)throw up.error;const pub=supabaseClient.storage.from('avatars').getPublicUrl(path).data.publicUrl;u.avatar=pub;await supabaseClient.from('profiles').update({avatar_url:pub}).eq('id',u.id);save();openView('profile');toast('Profile image updated')}catch(e){console.error(e);toast(e.message||'Image upload failed')}};
/* Link code: always create a fresh code on manual refresh, invalidate previous active codes first. */
window.syncBotLinkCode=async function(u,force=false){if(!dbReady()||!u?.id)return false;try{await supabaseClient.from('telegram_link_codes').update({used_at:new Date().toISOString()}).eq('user_id',u.id).is('used_at',null);const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);u.botCode=String(100000+(bytes[0]%900000));u.botCodeExpires=Date.now()+600000;const {error}=await supabaseClient.from('telegram_link_codes').insert({user_id:u.id,code:u.botCode,expires_at:new Date(u.botCodeExpires).toISOString()});if(error)throw error;save();return true}catch(e){console.error('Telegram link code',e);toast('Telegram code could not be saved');return false}};
window.refreshBotCode=async function(){const u=current();if(!u)return;const ok=await syncBotLinkCode(u,true);if(ok)openView('bot')};
const oldBot=window.bot;window.bot=async function(v){const u=current();if(!u)return;await syncBotLinkCode(u,false);return oldBot(v)};
/* Load v20 settings from Supabase for admin sessions. */
const oldHydrate=window.dbHydrateAdminSettings;window.dbHydrateAdminSettings=async function(){if(typeof oldHydrate==='function')await oldHydrate();if(!dbReady()||!ensureAdmin())return;try{const {data}=await supabaseClient.from('system_settings').select('key,value').in('key',['currencies_v20']);(data||[]).forEach(r=>{if(r.key==='currencies_v20'&&Array.isArray(r.value))state.currencies=r.value});v20Init();save()}catch(e){console.warn('v20 settings hydrate',e)}};
/* Hide legacy task routing. */
const oldOpen=window.openView;window.openView=function(name){if(name==='tasks')return openView('dashboard');return oldOpen(name)};
})();

<script>
(function(){
'use strict';
function activeFor(mode){return state.currencies.filter(c=>c.enabled!==false && c[mode]!==false)}
function curMode(code,kind){return (state.currencies.find(c=>c.code===code)?.processing?.[kind])||'manual'}
window.renderDepositMode=function(){const c=document.getElementById('depCur')?.value,box=document.getElementById('depositMode');if(!c||!box)return;const cfg=v20Currency(c);if(!cfg)return;const mode=curMode(c,'deposit');box.innerHTML=`<div class="field"><label>Amount (${esc(c)})</label><input id="depAmt" type="number" min="0" step="any"></div><div class="field"><label>Reference / Address / Phone</label><input id="depRef" placeholder="Optional"></div><div class="notice">${mode==='automatic'?'⚡ Automatic processing — API will handle this currency.':'✋ Manual/Admin approval — request will wait for admin confirmation.'}</div><button class="primary gold" style="width:100%" onclick="v20SubmitDeposit()">${mode==='automatic'?'Continue':'Submit Deposit'}</button><button class="outline" style="width:100%;margin-top:8px" onclick="openView('depositHistory')">🧾 Deposit History</button>`}
window.deposit=function(v){if(!state.features.deposit)return v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;const cs=activeFor('deposit');v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'),'All active currencies')}<div class="panel"><div class="field"><label>${tr('Currency')}</label><select id="depCur" onchange="renderDepositMode()">${cs.map(c=>`<option>${esc(c.code)}</option>`).join('')}</select></div><div id="depositMode"></div></div></div>`;renderDepositMode()}
window.v20SubmitDeposit=async function(){const u=current(),c=document.getElementById('depCur')?.value,a=Number(document.getElementById('depAmt')?.value||0),ref=document.getElementById('depRef')?.value.trim();if(!u||!c||a<=0)return toast('Amount is required');const cfg=v20Currency(c),mode=curMode(c,'deposit'),txId='DX-'+uid().toUpperCase();const t={id:txId,txId,type:'Deposit',amount:a,currency:c,from:ref||'External',to:`Account ${u.email}`,status:mode==='automatic'?'pending':'pending',approvalMode:mode,time:new Date().toISOString(),fee:0,balanceBefore:Number(u.balances?.[c]||0),balanceAfter:Number(u.balances?.[c]||0),meta:{currency_code:c,reference:ref,api_enabled:!!cfg.api.enabled}};u.tx.unshift(t);save();if(mode==='manual'){toast('Deposit sent for admin approval');return openView('depositHistory')}const endpoint=String(cfg.api.endpoint||'').replace(/\/$/,'');if(!cfg.api.enabled||!endpoint){t.status='rejected';t.meta.error='Automatic API is not configured';save();return toast('API is not configured for this currency')}try{const r=await fetch(endpoint+'/currency/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currency:c,amount:String(a),reference:ref,external_user_id:u.id,transaction_id:txId})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.message||('HTTP '+r.status));t.meta.provider_reference=d.reference_id||d.deposit_id||null;save();toast('Deposit request sent');openView('depositHistory')}catch(e){t.status='rejected';t.meta.error=e.message;save();toast(e.message||'Deposit failed')}};

<script id="dx-v6-js">
(function(){
const FULL=(c)=>Object.assign({enabled:true,deposit_enabled:true,withdraw_enabled:true,swap_enabled:true,min_deposit:0,min_withdraw:0,min_swap:0,decimals:2,network:null},c);
const DEFAULTS=[
 FULL({code:'AFN',name:'AFN',symbol:'؋',api_provider:'hesabpay'}),
 FULL({code:'USDT',name:'Tether USD',symbol:'$',network:'BEP20',decimals:4,api_provider:'azadcoin'}),
 FULL({code:'AZAD',name:'Azad Coin',symbol:'A',network:'BEP20',decimals:2,api_provider:'azadcoin'})];
const sb=()=>supabaseClient;
function syncLocal(rows){try{state.currencies=rows.map(r=>Object.assign({},r));save()}catch(e){}}
// Load currencies; create AFN / USDT / AZAD rows if the table is empty or missing some of them.
async function loadCur(){
 let {data,error}=await sb().from('currencies').select('*').order('code');
 if(error)throw error;data=data||[];
 const have=new Set(data.map(c=>String(c.code).toUpperCase()));
 const missing=DEFAULTS.filter(d=>!have.has(d.code));
 let warn='';
 if(missing.length){
  const r=await sb().from('currencies').upsert(missing,{onConflict:'code'});
  if(r.error){warn=r.error.message;data=data.concat(missing)}
  else{const r2=await sb().from('currencies').select('*').order('code');data=r2.data||data.concat(missing)}
 }
 data=data.map(c=>dxIsAFN(c.code)?Object.assign({},c,{name:'AFN'}):c);
 syncLocal(data);return {rows:data,warn};
}
async function patchCur(code,patch){
 const r=await sb().from('currencies').update(Object.assign({updated_at:new Date().toISOString()},patch)).eq('code',code);
 if(r.error){toast(r.error.message);return false}
 const l=(state.currencies||[]).find(c=>c.code===code);if(l)Object.assign(l,patch);save();return true;
}
const warnBox=w=>w?'<div class="notice" style="background:#fdecec;color:#b42318">⚠ '+esc(w)+'<br>Run <b>supabase/setup.sql</b> (currencies section) in Supabase SQL Editor.</div>':'';
const sw=(c,f,l)=>'<label class="o">'+l+'<span class="dx-sw"><input type="checkbox" '+(c[f]!==false&&c[f]!==0&&c[f]!==null&&c[f]!==undefined?'checked':'')+' onchange="dxCurToggle(\''+esc(c.code)+'\',\''+f+'\',this)"><i></i></span></label>';
window.dxCurToggle=async function(code,f,el){const ok=await patchCur(code,{[f]:el.checked});if(!ok)el.checked=!el.checked;else toast(code+' · '+f.replace('_enabled','')+': '+(el.checked?'ON':'OFF'))};
window.toggleCurrencyV21=async function(code,f,v){await patchCur(code,{[f]:!!v})};
window.adminCurrenciesV21=window.adminCurrencyControls=async function(){
 if(!ensureAdmin())return toast('Admin access required');
 if(!dbReady())return toast('Supabase backend is not connected');
 try{
  const {rows,warn}=await loadCur();
  showModal('<h3>Currency Control</h3><div class="notice">Each currency is controlled separately. Switching one off does not change the others.</div>'+warnBox(warn)+
  rows.map(c=>'<div class="dx-cur"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h4>'+esc(c.symbol||'')+' '+esc(dxCurrencyLabel(c.code))+'</h4><button class="outline" onclick="editCurrencyV21(\''+esc(c.code)+'\')">Edit</button></div>'+
  '<div class="g">'+sw(c,'enabled','Currency')+sw(c,'deposit_enabled','Deposit')+sw(c,'withdraw_enabled','Withdraw')+sw(c,'swap_enabled','Swap')+'</div></div>').join('')+
  '<div class="actions"><button class="primary gold" onclick="editCurrencyV21(\'\')">Add Currency</button><button class="outline" onclick="closeModal()">Close</button></div>');
 }catch(e){showModal('<h3>Currency Control</h3><div class="notice">'+esc(e.message||e)+'<br>Run <b>supabase/setup.sql</b> in Supabase SQL Editor.</div><button class="outline" onclick="closeModal()">Close</button>')}
};
// ---- Financial controls (min limits per currency) ----
window.dxFinancialAdmin=async function(){
 if(!ensureAdmin())return toast('Admin access required');
 if(!dbReady())return toast('Supabase backend is not connected');
 try{
  const {rows,warn}=await loadCur();
  const inp=(c,k,l)=>'<div class="field"><label>'+l+'</label><input id="fin_'+k+'_'+esc(c.code)+'" type="number" min="0" step="any" value="'+Number(c[k]||0)+'"></div>';
  showModal('<h3>Financial Controls</h3><div class="notice">Minimum amount per currency for Deposit, Withdraw and Swap. 0 = no minimum.</div>'+warnBox(warn)+
  rows.map(c=>'<div class="dx-cur"><h4>'+esc(c.symbol||'')+' '+esc(dxCurrencyLabel(c.code))+'</h4><div class="g">'+inp(c,'min_deposit','Min Deposit')+inp(c,'min_withdraw','Min Withdraw')+inp(c,'min_swap','Min Swap')+'</div><button class="primary gold" style="margin-top:8px" onclick="dxFinSave(\''+esc(c.code)+'\')">Save '+esc(dxCurrencyLabel(c.code))+'</button></div>').join('')+
  '<button class="outline" onclick="closeModal()">Close</button>');
 }catch(e){showModal('<h3>Financial Controls</h3><div class="notice">'+esc(e.message||e)+'</div><button class="outline" onclick="closeModal()">Close</button>')}
};
window.dxFinSave=async function(code){
 const g=k=>Number(document.getElementById('fin_'+k+'_'+code)?.value||0);
 const p={min_deposit:g('min_deposit'),min_withdraw:g('min_withdraw'),min_swap:g('min_swap')};
 if(Object.values(p).some(x=>!Number.isFinite(x)||x<0))return toast('Minimum must be 0 or greater');
 if(await patchCur(code,p))toast(code+' limits saved');
};
// ---- Provider API: clearer message when the gateway is not deployed ----
const oldProv=window.dxProviderApi;
if(typeof oldProv==='function'){
 const wrapped=async function(){
  try{
   const {data}=await supabaseClient.auth.getSession();
   const url=String(state.db?.url||'').replace(/\/$/,'')+'/functions/v1/dexchange-gateway/health';
   const r=await fetch(url).catch(()=>null);
   if(!r||!r.ok){return showModal('<h3>Provider API Settings</h3><div class="notice">Secure gateway is not deployed yet.<br>Deploy it once, then reopen this page:<br><code>supabase functions deploy dexchange-gateway --no-verify-jwt</code><br><small>Checked: '+esc(url)+'</small></div><button class="outline" onclick="closeModal()">Close</button>')}
  }catch(e){}
  return oldProv();
 };
 window.dxProviderApi=window.adminAPIs=window.dxApiSettings=wrapped;
}
// ---- Never show "Afghanistan" as the AFN currency name ----
const BAD=/\bAfghanistan\b|\bAfghani\b/gi;
function clean(root){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const hits=[];
 while(w.nextNode()){if(BAD.test(w.currentNode.nodeValue))hits.push(w.currentNode);BAD.lastIndex=0}
 hits.forEach(n=>n.nodeValue=n.nodeValue.replace(BAD,'AFN'));
 root.querySelectorAll&&root.querySelectorAll('[placeholder],[value],option').forEach(el=>{
  ['placeholder','value'].forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v&&/Afghanistan|Afghani\b/i.test(v)&&el.tagName!=='INPUT'&&!(a==='value'&&el.tagName==='OPTION'))el.setAttribute(a,v.replace(BAD,'AFN'))})});
}
let busy=false;
new MutationObserver(()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{try{clean(document.body)}finally{busy=false}})}).observe(document.body,{childList:true,subtree:true,characterData:true});
clean(document.body);
// ---- the currency name AFN also everywhere in data coming from the database ----
try{(state.currencies||[]).forEach(c=>{if(String(c.code).toUpperCase()==='AFN')c.name='AFN'})}catch(e){}
})();
</script>
<script>
/* D EXCHANGE — Swap fee data flow: Admin Panel -> saved fee (system_settings.rates) -> every user's Swap page.
   Admin sessions already hold the live values locally; regular users read the saved row here. */
(function(){
  'use strict';
  async function loadSharedRates(){
    try{
      if(typeof dbReady!=='function'||!dbReady()||typeof supabaseClient==='undefined')return false;
      if(typeof ensureAdmin==='function'&&ensureAdmin())return false;
      const {data,error}=await supabaseClient.from('system_settings').select('key,value').in('key',['rates']);
      if(error||!data||!data.length)return false;
      const before=JSON.stringify(window.dxRates?dxRates.snapshot():null);
      const byKey={};data.forEach(r=>{byKey[r.key]=r.value});
      const rr=byKey.rates;
      if(rr){
        if(rr.prices&&typeof rr.prices==='object'&&window.dxRates)dxRates.ingest(rr.prices);
        if(rr.fee!=null){const n=Number(rr.fee);if(Number.isFinite(n)&&n>=0){state.fee=n;state.swapFee=n;state.swapFeeEnabled=true}}
      }
      if(typeof save==='function')save();
      try{if(window.dxRates&&JSON.stringify(dxRates.snapshot())!==before&&['rates','swap','dashboard'].indexOf(currentView)>=0&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))openView(currentView)}catch(e){}
      return true;
    }catch(e){console.warn('shared rates load',e);return false}
  }
  window.dxLoadSharedRates=loadSharedRates;
  window.dxRefreshSwapFee=async function(){
    const paint=()=>{const el=document.getElementById('swFeeVal');if(el)el.textContent=getSwapFeePct()+'%';if(document.getElementById('swQuote')&&typeof quoteSwap==='function')quoteSwap()};
    paint();
    if(await loadSharedRates())paint();
  };
  const oldEnter=window.enterApp;
  if(typeof oldEnter==='function')window.enterApp=function(){const r=oldEnter.apply(this,arguments);setTimeout(loadSharedRates,300);return r};
})();
</script>

/* ---------- CENTRAL RATE SYSTEM: AFN is the main reference currency ----------
   The Admin types SIX rates (kept in state.prices). Value = units of the second currency for 1 of the first.
        USDT_BUY_AFN   USDT_SELL_AFN      (USDT -> AFN)
        AZAD_BUY_AFN   AZAD_SELL_AFN      (AZAD -> AFN)
        USDT_BUY_AZAD  USDT_SELL_AZAD     (USDT -> AZAD)
   The six counter rates are calculated automatically. They are the SAME trade seen from the other currency:
        X_SELL_Y = 1 / Y_BUY_X      and      X_BUY_Y = 1 / Y_SELL_X
   e.g. USDT_SELL_AFN = 65  =>  AFN_BUY_USDT = 1/65.
   If USDT <-> AZAD was not typed in, it is derived through AFN (USDT_SELL_AFN / AZAD_BUY_AFN, ...).
   getRate(from,to,side) is the only lookup used by Rates, Dashboard, Swap, Buy/Sell and the withdrawal fee. */
const ADMIN_PAIRS=[['USDT','AFN'],['AZAD','AFN'],['USDT','AZAD']];                          // [BASE, QUOTE] the Admin types
const RATE_PAIRS=[['USDT','AFN'],['AFN','USDT'],['AZAD','AFN'],['AFN','AZAD'],['USDT','AZAD'],['AZAD','USDT']];   // every direction shown to users
const mkDefs=(pairs,sides)=>{const o=[];pairs.forEach(([b,q])=>sides.forEach(s=>o.push({key:b+'_'+s+'_'+q,base:b,quote:q,side:s,label:b+' '+(s==='BUY'?'Buy':'Sell')+' \u2192 '+q})));return o};
const ADMIN_DEFS=mkDefs(ADMIN_PAIRS,['BUY','SELL']);          // the 6 inputs of Admin -> Rates
const ADMIN_KEYS=ADMIN_DEFS.map(d=>d.key);
const RATE_DEFS=mkDefs(RATE_PAIRS,['BUY','SELL']);            // all 12 values (6 typed + 6 automatic)
const RATE_KEYS=RATE_DEFS.map(d=>d.key);
const rUp=x=>String(x==null?'':x).toUpperCase();
const flipSide=s=>s==='BUY'?'SELL':'BUY';
const adminVal=(src,k)=>{const n=Number(src&&src[k]);return Number.isFinite(n)&&n>0?n:null};

/* a rate in the direction the Admin types it (typed value, or USDT->AZAD through AFN when it was not typed) */
function directRate(prices,base,quote,side){
  const k=base+'_'+side+'_'+quote;
  if(ADMIN_KEYS.indexOf(k)<0)return null;
  const v=adminVal(prices,k);if(v)return v;
  if(base==='USDT'&&quote==='AZAD'){
    const a=adminVal(prices,side==='SELL'?'USDT_SELL_AFN':'USDT_BUY_AFN'),b=adminVal(prices,side==='SELL'?'AZAD_BUY_AFN':'AZAD_SELL_AFN');
    if(a&&b)return a/b;
  }
  return null;
}
/* {rate, source:'admin'|'auto'} or null when it cannot be known */
function rateInfo(from,to,side,prices){
  prices=prices||state.prices;
  from=rUp(from);to=rUp(to);const s=rUp(side||'SELL');
  if(!from||from===to||RATE_KEYS.indexOf(from+'_'+s+'_'+to)<0)return null;
  const typed=adminVal(prices,from+'_'+s+'_'+to);
  if(typed)return {rate:typed,source:'admin'};
  const d=directRate(prices,from,to,s);
  if(d)return {rate:d,source:'auto'};
  const inv=directRate(prices,to,from,flipSide(s));      // counter direction, opposite side -> 1 / value
  if(inv)return {rate:1/inv,source:'auto'};
  return null;
}
/* the one lookup: FROM currency, TO currency, BUY or SELL -> the rate, or null when it is not set */
function getRate(from,to,side){const i=rateInfo(from,to,side);return i?i.rate:null}
window.dxGetRate=getRate;

function pickValid(src){
  const o={};let c=0;
  ADMIN_KEYS.forEach(k=>{
    if(!src||src[k]==null||src[k]==='')return;
    const n=Number(src[k]);
    if(Number.isFinite(n)&&n>0){o[k]=n;c++}
  });
  return {o,c};
}
/* load the Admin rates that come from the database (or any stored copy). Only the 6 typed keys are accepted.
   Older copies (12 independent values, or the first six-value format) are converted once: a typed key that is
   missing is taken from its counter value (X_SELL_Y = 1/Y_BUY_X, X_BUY_Y = 1/Y_SELL_X). */
function ingest(raw){
  if(!raw||typeof raw!=='object')return false;
  let r=pickValid(raw);
  if(!r.c){
    const all={};
    RATE_KEYS.forEach(k=>{const n=Number(raw[k]);if(Number.isFinite(n)&&n>0)all[k]=n});
    const OLD={USDT_SELL_AFN:'USDT_AFN',USDT_SELL_AZAD:'USDT_AZAD',AFN_SELL_USDT:'AFN_USDT',AFN_SELL_AZAD:'AFN_AZAD',AZAD_SELL_USDT:'AZAD_USDT',AZAD_SELL_AFN:'AZAD_AFN'};
    Object.keys(OLD).forEach(k=>{const n=Number(raw[OLD[k]]);if(Number.isFinite(n)&&n>0&&all[k]==null)all[k]=n});
    const o={};
    ADMIN_DEFS.forEach(d=>{
      if(all[d.key])o[d.key]=all[d.key];
      else{const c=all[d.quote+'_'+flipSide(d.side)+'_'+d.base];if(c)o[d.key]=1/c}
    });
    r={o,c:Object.keys(o).length};
  }
  state.prices=r.o;return true;
}
/* keep state.prices clean: only the 6 typed Admin rates (automatic ones are never stored locally) */
function normalizeRates(){state.prices=pickValid(state.prices).o}
function rSnapshot(){const o={};RATE_DEFS.forEach(d=>{o[d.key]=getRate(d.base,d.quote,d.side)});return o}
/* all 12 values (typed + automatic), written to the database so every other reader (bot, gateway) sees a complete table */
function fullTable(prices){const o={};RATE_DEFS.forEach(d=>{const i=rateInfo(d.base,d.quote,d.side,prices||state.prices);if(i)o[d.key]=i.rate});return o}
window.dxRates={defs:RATE_DEFS,adminDefs:ADMIN_DEFS,pairs:RATE_PAIRS,keys:RATE_KEYS,get:getRate,info:rateInfo,full:()=>fullTable(state.prices),snapshot:rSnapshot,ingest:ingest,normalize:normalizeRates};
normalizeRates();

/* full-precision display (12 significant digits, no fixed rounding of small values) */
const fmtFull=x=>{const n=Number(x);if(!Number.isFinite(n)||n<=0)return '\u2014';return fmt(Number(n.toPrecision(12)),n<1?16:10)};

/* ---------- Swap direction: From -> To only ----------
   There is no Buy / Sell choice on the Swap page. For the selected From -> To the stored Admin rate "From -> To"
   (state.prices.<FROM>_SELL_<TO>, the rate the Admin typed for that direction) is read as-is: out = amount x rate.
   Nothing is reversed, divided, derived or modified. */
/* ---------- 1) SWAP: one quote function used by preview, calcSwap and the transaction ---------- */
function swapQuote(f,t,a){
  f=rUp(f);t=rUp(t);a=Number(a);
  const q={valid:false,from:f,to:t,amount:a,side:'SELL',rateKey:'',rateLabel:'',rate:0,rateText:'',rateBase:'',rateQuote:'',gross:0,feePct:0,fee:0,net:0,key:''};
  if(!f||!t||f===t||!Number.isFinite(a)||a<=0)return q;
  const rate=getRate(f,t,'SELL');                       // the stored Admin rate for exactly this From -> To direction
  if(!rate)return q;
  const pct=Number(getSwapFeePct())||0;                 // live, admin-controlled
  const gross=q8(a*rate);                               // amount of the TO currency before the fee
  const fee=q8(gross*pct/100);                          // fee is in the RECEIVED currency
  const net=q8(gross-fee);
  if(!(net>0))return q;
  Object.assign(q,{valid:true,rate,rateKey:f+'_SELL_'+t,rateLabel:f+' \u2192 '+t,
    rateText:`1 ${f} = ${fmtFull(rate)} ${t}`,rateBase:f,rateQuote:t,gross,feePct:pct,fee,net,key:[f,t,a,rate,pct].join('|')});
  return q;
}
window.dxSwapQuote=swapQuote;
window.calcSwap=function(f,t,a){const q=swapQuote(f,t,a);return q.valid?q.net:0};

window.quoteSwap=function(){
  const box=$('swQuote');if(!box)return;
  const f=$('swFrom')?.value,t=$('swTo')?.value,a=Number($('swAmt')?.value||0);
  const btn=$('swConfirm');
  const feeEl=$('swFeeVal');if(feeEl)feeEl.textContent=getSwapFeePct()+'%';
  const q=swapQuote(f,t,a);
  window.__dxLastQuote=q.valid?q.key:null;
  if(btn)btn.disabled=!q.valid;
  if(!q.valid){
    box.className='quote';
    box.textContent=(a>0&&f&&t&&f!==t)?T('Rate is not configured'):T('Quote here');
    return;
  }
  const u=(typeof current==='function')?current():null;
  const bal=u?Number(u.balances?.[f]||0):null;
  box.className='quote dxq-on';
  box.innerHTML=`<div class="dxq">
    <div class="dxq-row"><span>${T('Amount')}</span><b class="dxq-cur">${icon(f,16)}${fmt(a)} ${E(f)}</b></div>
    <div class="dxq-row"><span>${T('Rate Type')}</span><b>${E(q.rateLabel)}</b></div>
    <div class="dxq-row"><span>${T('Exchange Rate')}</span><b>${E(q.rateText)}</b></div>
    <div class="dxq-row"><span>${T('Gross Amount')}</span><b>${fmt(q.gross)} ${E(t)}</b></div>
    <div class="dxq-row"><span>${T('Swap Fee')}</span><b>${pctText(q.feePct)} = ${fmt(q.fee)} ${E(t)}</b></div>
    <div class="dxq-row net"><span>${T('You Receive')}</span><b class="dxq-cur">${icon(t,16)}${fmt(q.net)} ${E(t)}</b></div>
    ${bal!=null&&a>bal?`<div class="dxq-warn">${T('Insufficient balance')}</div>`:''}
  </div>`;
};

/* ---------- 3) WITHDRAWAL FEE: 0.01 USDT, charged exactly once ---------- */
function wdPlan(cur,amount){
  cur=String(cur||'').toUpperCase();const a=Number(amount);
  const u=(typeof current==='function')?current():null;
  const plan={valid:false,reason:'',currency:cur,amount:a,baseFeeUSDT:BASE_FEE_USDT,feeCurrency:null,feeAmount:0,feeRate:null,feeRateText:'',totalDeducted:0,net:a};
  if(!u||!Number.isFinite(a)||a<=0){plan.reason='amount';return plan}
  const bal=c=>Number(u.balances?.[c]||0);
  if(cur==='USDT'){
    plan.feeCurrency='USDT';plan.feeAmount=BASE_FEE_USDT;plan.feeRate=1;
    plan.totalDeducted=q8(a+BASE_FEE_USDT);
    plan.valid=bal('USDT')+1e-12>=plan.totalDeducted;
  }else if(bal('USDT')+1e-12>=BASE_FEE_USDT){
    // user has enough USDT: fee comes from the USDT balance, the withdrawal currency is only charged the amount
    plan.feeCurrency='USDT';plan.feeAmount=BASE_FEE_USDT;plan.feeRate=1;
    plan.totalDeducted=q8(a);
    plan.valid=bal(cur)+1e-12>=plan.totalDeducted;
  }else{
    // no USDT: the 0.01 USDT fee is paid in the withdrawal currency at the Admin 'USDT Buy -> <currency>' rate (units of <currency> per 1 USDT)
    const r=getRate('USDT',cur,'BUY');
    if(!(r>0)){plan.reason='rate';return plan}
    plan.feeCurrency=cur;plan.feeRate=r;plan.feeRateText=`1 USDT = ${fmtRate(r)} ${cur}`;
    plan.feeAmount=q8(BASE_FEE_USDT*r);
    plan.totalDeducted=q8(a+plan.feeAmount);
    plan.valid=bal(cur)+1e-12>=plan.totalDeducted;
  }
  if(!plan.valid)plan.reason='insufficient';
  return plan;
}
window.dxWdPlan=wdPlan;
window.dxWdPlanMsg=function(p){
  if(p.reason==='rate')return T('Rate unavailable for fee conversion');
  if(p.reason==='insufficient')return T('Insufficient funds for amount and fee');
  return T('Invalid swap');
};
/* the ONLY place a withdrawal fee is deducted */
window.dxWdApply=function(u,plan){
  const cur=plan.currency,b=c=>Number(u.balances[c]||0),out={};
  if(plan.feeCurrency==='USDT'&&cur!=='USDT'){
    out.feeBalanceBefore=b('USDT');

/* Persist the rates + fee: RPC (existing secure path) and system_settings.rates, then read the row back and
   check that every typed value really arrived. The database receives the complete table (6 typed + 6 automatic). */
async function persistRates(){
  if(typeof dbReady!=='function'||!dbReady())return;
  const prices=fullTable(state.prices),fee=Number(state.fee||0);
  let rpcErr=null,upErr=null;
  try{const r=await supabaseClient.rpc('dexchange_admin_set_rates',{p_prices:prices,p_fee:fee});rpcErr=r&&r.error||null}catch(e){rpcErr=e}
  try{const r=await supabaseClient.from('system_settings').upsert({key:'rates',value:{prices:prices,fee:fee}},{onConflict:'key'});upErr=r&&r.error||null}catch(e){upErr=e}
  if(rpcErr&&upErr)throw upErr;
  const {data,error}=await supabaseClient.from('system_settings').select('value').eq('key','rates').limit(1);
  if(error)throw error;
  const stored=(data&&data[0]&&data[0].value&&data[0].value.prices)||{};
  for(const d of ADMIN_DEFS){
    const want=state.prices[d.key],got=stored[d.key];
    if((want==null)!==(got==null)||(want!=null&&Number(got)!==Number(want)))
      throw new Error(T('The server did not store this rate correctly')+' ('+rateLabelT(d)+') - '+T('Check the dexchange_admin_set_rates function and system_settings policy'));
  }
}

window.dxCopyText=async function(text){
  text=String(text??'');
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;pointer-events:none';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy');ta.remove();return !!ok;
  }catch(e){return false}
};

function findTx(id){
  const u=(typeof current==='function')?current():null;
  let t=u?.tx?.find(x=>x.id===id||x.txId===id);
  if(!t&&typeof ensureAdmin==='function'&&ensureAdmin()){for(const x of (state.users||[])){t=(x.tx||[]).find(y=>y.id===id||y.txId===id);if(t)break}}
  return t;
