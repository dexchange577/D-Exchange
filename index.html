<script>
(function(){
'use strict';
const V20_CORE=['AFN','USDT','AZAD'];
const V20_NAMES={AFN:'AFN',USDT:'Tether USD',AZAD:'Azad Coin'};
function v20Init(){
  state.currencies=Array.isArray(state.currencies)?state.currencies:V20_CORE.map(code=>({code,name:V20_NAMES[code]||code,symbol:code,enabled:true,deposit:true,withdraw:true,processing:{deposit:state.processingModes?.deposit||'automatic',withdraw:state.processingModes?.withdraw||'automatic'},api:{enabled:false,endpoint:'',integrationId:uid()}}));
  for(const code of V20_CORE){if(!state.currencies.some(c=>c.code===code))state.currencies.push({code,name:V20_NAMES[code],symbol:code,enabled:true,deposit:true,withdraw:true,processing:{deposit:'automatic',withdraw:'automatic'},api:{enabled:false,endpoint:'',integrationId:uid()}})}
  state.currencies.forEach(c=>{c.code=String(c.code||'').toUpperCase();c.name=c.name||c.code;c.symbol=c.symbol||c.code;c.enabled=c.enabled!==false;c.deposit=c.deposit!==false;c.withdraw=c.withdraw!==false;c.processing=c.processing||{};c.processing.deposit=c.processing.deposit==='manual'?'manual':'automatic';c.processing.withdraw=c.processing.withdraw==='manual'?'manual':'automatic';c.api=c.api||{};c.api.enabled=!!c.api.enabled;c.api.endpoint=c.api.endpoint||'';c.api.integrationId=c.api.integrationId||uid()});
  state.dynamicBalances=state.dynamicBalances||{};
  state.prices=state.prices||{};
  state.prices.AFN_USDT=state.prices.AFN_USDT||((Number(state.prices.usdtBuy)||67.5)>0?1/Number(state.prices.usdtBuy):1/67.5);
  state.prices.USDT_AFN=state.prices.USDT_AFN||Number(state.prices.usdtSell)||65;
  state.prices.USDT_AZAD=state.prices.USDT_AZAD||Number(state.prices.azadPerUsdt)||1715;
  state.prices.AZAD_USDT=state.prices.AZAD_USDT||1/(Number(state.prices.USDT_AZAD)||1715);
  state.prices.AFN_AZAD=state.prices.AFN_AZAD||1/(Number(state.prices.AZAD_AFN)||1715/67.5);
  state.prices.AZAD_AFN=state.prices.AZAD_AFN||Number(state.prices.USDT_AFN||65)/Number(state.prices.USDT_AZAD||1715);
  state.prices.USDT_AFN=Number(state.prices.USDT_AFN)||65;
  state.prices.AFN_USDT=Number(state.prices.AFN_USDT)||1/67.5;
  state.prices.USDT_AZAD=Number(state.prices.USDT_AZAD)||1715;
  state.prices.AZAD_USDT=Number(state.prices.AZAD_USDT)||1/1715;
  state.prices.AFN_AZAD=Number(state.prices.AFN_AZAD)||1/(1715/67.5);
  state.prices.AZAD_AFN=Number(state.prices.AZAD_AFN)||1715/67.5;
  state.tasks=[];
  save();
}
v20Init();
function v20Active(){return state.currencies.filter(c=>c.enabled!==false)}
function v20Currency(code){return state.currencies.find(c=>c.code===String(code).toUpperCase())}
function v20EnsureBalances(u){u.balances=u.balances||{};v20Active().forEach(c=>{if(u.balances[c.code]==null)u.balances[c.code]=0})}
function v20PersistSettings(){save();if(typeof dbReady==='function'&&dbReady()&&typeof ensureAdmin==='function'&&ensureAdmin()&&typeof supabaseClient!=='undefined'){supabaseClient.from('system_settings').upsert({key:'currencies_v20',value:state.currencies},{onConflict:'key'}).then(()=>supabaseClient.from('system_settings').upsert({key:'rates_v20',value:state.prices},{onConflict:'key'})).catch(console.warn)}}
function v20Esc(s){return esc(s)}
window.adminCurrencyControls=function(){
 const rows=v20Active().map(c=>`<div class="v20-currency-row"><div><b>${v20Esc(c.code)}</b><small class="muted" style="display:block">${v20Esc(c.name)}</small></div><button class="outline" onclick="v20EditCurrency('${v20Esc(c.code)}')">✏️</button><button class="danger" onclick="v20RemoveCurrency('${v20Esc(c.code)}')">${V20_CORE.includes(c.code)?'Disable':'Delete'}</button></div>`).join('');
 showModal(`<h3>💱 Currency Control</h3><div class="panel"><div class="field"><label>Currency Code</label><input id="v20ccode" maxlength="12" placeholder="مثلاً BTC"></div><div class="field"><label>Currency Name</label><input id="v20cname" placeholder="Bitcoin"></div><div class="field"><label>Symbol</label><input id="v20csymbol" maxlength="8" placeholder="BTC"></div><button class="primary gold" onclick="v20AddCurrency()">➕ Add Currency</button></div><div class="panel" style="margin-top:10px">${rows||'<div class="notice">No currencies.</div>'}</div><button class="outline" onclick="closeModal()">Close</button>`)
};
window.v20AddCurrency=function(){const code=document.getElementById('v20ccode')?.value.trim().toUpperCase(),name=document.getElementById('v20cname')?.value.trim(),symbol=(document.getElementById('v20csymbol')?.value.trim().toUpperCase()||code);if(!/^[A-Z0-9_]{2,12}$/.test(code))return toast('Invalid currency code');if(!name)return toast('Currency name is required');if(v20Currency(code))return toast('Currency already exists');state.currencies.push({code,name,symbol,enabled:true,deposit:true,withdraw:true,processing:{deposit:'manual',withdraw:'manual'},api:{enabled:false,endpoint:'',integrationId:uid()}});v20EnsureAllBalances(code);v20PersistSettings();adminCurrencyControls();toast('Currency added')};
function v20EnsureAllBalances(code){state.users.forEach(u=>{u.balances=u.balances||{};if(u.balances[code]==null)u.balances[code]=0})}
window.v20RemoveCurrency=function(code){const c=v20Currency(code);if(!c)return;if(V20_CORE.includes(code)){c.enabled=false;c.deposit=false;c.withdraw=false}else{state.currencies=state.currencies.filter(x=>x.code!==code)}v20PersistSettings();adminCurrencyControls();toast(V20_CORE.includes(code)?'Currency disabled':'Currency removed')};
window.v20EditCurrency=function(code){const c=v20Currency(code);if(!c)return;showModal(`<h3>⚙️ ${v20Esc(c.code)} Settings</h3><div class="field"><label>Name</label><input id="v20en" value="${v20Esc(c.name)}"></div><div class="field"><label>Symbol</label><input id="v20es" value="${v20Esc(c.symbol)}"></div><div class="compact-grid"><label class="tile"><input id="v20ed" type="checkbox" ${c.deposit?'checked':''}> Deposit فعال</label><label class="tile"><input id="v20ew" type="checkbox" ${c.withdraw?'checked':''}> Withdraw فعال</label></div><div class="panel" style="margin-top:10px"><b>Processing Mode</b><div class="compact-grid" style="margin-top:8px"><button class="outline" onclick="v20SetMode('${code}','deposit','automatic')">⚡ Deposit Automatic</button><button class="outline" onclick="v20SetMode('${code}','deposit','manual')">✋ Deposit Manual</button><button class="outline" onclick="v20SetMode('${code}','withdraw','automatic')">⚡ Withdraw Automatic</button><button class="outline" onclick="v20SetMode('${code}','withdraw','manual')">✋ Withdraw Manual</button></div><small class="muted">Deposit: ${c.processing.deposit} · Withdraw: ${c.processing.withdraw}</small></div><button class="primary gold" onclick="v20SaveCurrency('${code}')">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`)};
window.v20SetMode=function(code,kind,mode){const c=v20Currency(code);if(c)c.processing[kind]=mode;v20EditCurrency(code)};
window.v20SaveCurrency=function(code){const c=v20Currency(code);if(!c)return;c.name=document.getElementById('v20en').value.trim()||c.name;c.symbol=document.getElementById('v20es').value.trim().toUpperCase()||c.code;c.deposit=document.getElementById('v20ed').checked;c.withdraw=document.getElementById('v20ew').checked;c.enabled=true;v20PersistSettings();closeModal();adminCurrencyControls();toast('Currency settings saved')};
window.adminRates=function(){const cs=v20Active();const pairs=[];for(const a of cs)for(const b of cs)if(a.code!==b.code)pairs.push([a.code,b.code]);showModal(`<h3>💱 Rates</h3><div class="formgrid">${pairs.map(([a,b])=>{const k=a+'_'+b;return `<div class="field"><label>1 ${a} → ${b}</label><input id="v20r_${k}" type="number" min="0" step="any" value="${Number(state.prices[k]||0)}"></div>`}).join('')}</div><div class="notice">هره فعاله کرنسي د نورو فعالو کرنسيو لپاره خپل نرخ لري.</div><button class="primary gold" onclick="v20SaveRates()">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`) };
window.v20SaveRates=function(){for(const a of v20Active())for(const b of v20Active())if(a.code!==b.code){const k=a.code+'_'+b.code,n=Number(document.getElementById('v20r_'+k)?.value||0);if(!n||n<0)return toast('Invalid rate: '+k);state.prices[k]=n}v20PersistSettings();closeModal();toast('Rates saved');openView('admin')};
window.calcSwap=function(f,t,a){if(f===t)return Number(a)||0;const r=Number(state.prices[String(f).toUpperCase()+'_'+String(t).toUpperCase()]);if(!r||r<=0)return 0;let out=(Number(a)||0)*r;out*=1-getSwapFeePct()/100;return out};
window.swap=function(v){const opts=v20Active().map(c=>c.code);if(!state.features.swap)return v.innerHTML=`<div class="screen">${screenHead(tr('Swap'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;v.innerHTML=`<div class="screen">${screenHead(tr('Swap'),'Dynamic Currency Exchange')}<div class="panel"><div class="quickform"><div class="field"><label>${tr('From')}</label><select id="swFrom" onchange="quoteSwap()">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${tr('To')}</label><select id="swTo" onchange="quoteSwap()">${opts.map((x,i)=>`<option ${i===1?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>${tr('Amount')}</label><input id="swAmt" type="number" min="0" step="any" oninput="quoteSwap()"></div><div class="quote" id="swQuote">${tr('Quote here')}</div><button class="primary gold" style="width:100%;margin-top:10px" onclick="v20DoSwap()">${tr('Confirm Swap')}</button><button class="outline" style="width:100%;margin-top:8px" onclick="openView('swapHistory')">🧾 Swap History</button></div></div>`};
window.v20DoSwap=function(){const u=current(),f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value,a=Number(document.getElementById('swAmt')?.value||0);if(!u||!a||f===t)return toast('Invalid swap');v20EnsureBalances(u);if(Number(u.balances[f]||0)<a)return toast(tr('Insufficient balance'));const out=calcSwap(f,t,a);if(!out)return toast('Rate is not configured');const bf=Number(u.balances[f]||0),bt=Number(u.balances[t]||0);u.balances[f]=bf-a;u.balances[t]=bt+out;u.tx.unshift({id:uid(),txId:'DX-'+uid().toUpperCase(),type:'Swap',amount:a,currency:f,out,from:`Account ${u.email}`,to:t,status:'confirmed',approvalMode:'automatic',time:new Date().toISOString(),fee:getSwapFeePct(),balanceBefore:bf,balanceAfter:u.balances[f],meta:{toBalanceBefore:bt,toBalanceAfter:u.balances[t],rate:state.prices[f+'_'+t]}});if(state.pointsRules?.enabled)u.points=(Number(u.points)||0)+Number(state.pointsRules.swap||0);save();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr('Swap complete'));openView('swapHistory')};
function v20TxPage(type,title,icon){const u=current();const map={Deposit:'Deposit',Withdraw:'Withdraw',Swap:'Swap',Easyload:'Easyload'};const rows=(u?.tx||[]).filter(t=>t.type===map[type]);return `<div class="screen">${screenHead(title,'Full transaction history')}<div class="v20-history-tabs">${[['Deposit','💳'],['Withdraw','📤'],['Swap','⇄'],['Easyload','📱'],['Benefits','⭐']].map(([k,i])=>`<button class="${type===k?'active':''}" onclick="openView('${k.toLowerCase()}History')">${i} ${k}</button>`).join('')}</div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Amount</th><th>Currency</th><th>Status</th><th>Time</th><th>Details</th></tr>${rows.slice().reverse().map(t=>`<tr onclick="showTxDetails('${esc(t.id)}')"><td>${esc(t.type)}</td><td>${t.amount}${t.out!=null?' → '+t.out:''}</td><td>${esc(t.currency)}</td><td>${txStatusBadge(t.status)}</td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.txId||t.to||'—')}</td></tr>`).join('')||`<tr><td colspan="6">No ${type} transactions.</td></tr>`}</table></div></div>`}
function v20BenefitsHistory(){const u=current();const rows=(u?.tx||[]).filter(t=>/Points|Bonus|Referral/i.test(t.type||'')||t.currency==='POINTS');return `<div class="screen">${screenHead('Benefits Transactions','Points and rewards history')}<div class="v20-history-tabs">${[['Deposit','💳'],['Withdraw','📤'],['Swap','⇄'],['Easyload','📱'],['Benefits','⭐']].map(([k,i])=>`<button class="${'Benefits'===k?'active':''}" onclick="openView('${k.toLowerCase()}History')">${i} ${k}</button>`).join('')}</div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Amount</th><th>Currency</th><th>Status</th><th>Time</th><th>Details</th></tr>${rows.slice().reverse().map(t=>`<tr><td>${esc(t.type)}</td><td>${t.amount}</td><td>${esc(t.currency)}</td><td>${txStatusBadge(t.status)}</td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.txId||t.to||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No benefits transactions.</td></tr>'}</table></div></div>`}
window.openView=(function(old){return function(name){if(name==='depositHistory')return document.getElementById('view').innerHTML=v20TxPage('Deposit','Deposit Transactions','💳');if(name==='withdrawHistory')return document.getElementById('view').innerHTML=v20TxPage('Withdraw','Withdraw Transactions','📤');if(name==='swapHistory')return document.getElementById('view').innerHTML=v20TxPage('Swap','Swap Transactions','⇄');if(name==='easyloadHistory')return document.getElementById('view').innerHTML=v20TxPage('Easyload','Easyload Transactions','📱');if(name==='benefitsHistory')return document.getElementById('view').innerHTML=v20BenefitsHistory();return old(name)}})(window.openView);
function v20AddHistoryButton(selector,name,label){const root=document.getElementById('view');if(!root)return;if(root.querySelector('[data-v20-history="'+name+'"]'))return;const b=document.createElement('button');b.className='outline';b.dataset.v20History=name;b.style.cssText='width:100%;margin-top:8px';b.textContent='🧾 '+label;b.onclick=()=>openView(name);root.querySelector('.panel')?.appendChild(b)}
for(const [fn,history,label] of [['deposit','depositHistory','Deposit History'],['withdraw','withdrawHistory','Withdraw History'],['easyload','easyloadHistory','Easyload History'],['benefits','benefitsHistory','Benefits Transactions']]){const old=window[fn];if(typeof old==='function')window[fn]=function(v){old(v);setTimeout(()=>v20AddHistoryButton(null,history,label),0)}}
/* Remove Tasks completely from user/admin UI. */
function v20RemoveTasks(){document.querySelectorAll('.action,.profiletile,button,a').forEach(el=>{if(/Tasks|Task Verification|Task Submissions|دندې|ټاسک/i.test(el.textContent||'')){el.remove()}})}
const oldDash=window.dashboard;window.dashboard=function(v){oldDash(v);v20RemoveTasks();v.querySelector('.walletlogo')?.remove()};
const oldAdmin=window.admin;window.admin=function(v){oldAdmin(v);v20RemoveTasks();const grid=v.querySelector('.profilegrid');if(grid&&!grid.querySelector('[data-v20-currency]')){const b=document.createElement('button');b.className='profiletile';b.dataset.v20Currency='1';b.onclick=adminCurrencyControls;b.innerHTML='<span class="pico">💱</span><span><b>Currency Control</b><small>Add, remove, rates, processing and API</small></span>';grid.prepend(b)}const oldCur=grid&&grid.querySelector('[data-v13-admin="currency"]');if(oldCur)oldCur.remove()};
window.adminAPIs=function(){const cs=v20Active();showModal(`<h3>🔌 API Settings</h3><div class="notice">د هرې کرنسي API یوازې هغه وخت ښکاري چې د هغې processing mode Automatic وي. Manual/Approval کې یوازې فعال/غیر فعال کنټرول پاتې کېږي.</div>${cs.map(c=>{const auto=c.processing.deposit==='automatic'||c.processing.withdraw==='automatic';return `<div class="panel" style="margin:10px 0"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${v20Esc(c.code)} — ${v20Esc(c.name)}</b><small class="muted" style="display:block">Deposit: ${c.processing.deposit} · Withdraw: ${c.processing.withdraw}</small></div><label><input id="v20api_on_${c.code}" type="checkbox" ${c.api.enabled?'checked':''}> فعال</label></div>${auto?`<div class="field" style="margin-top:8px"><label>Secure API / Gateway URL</label><input id="v20api_ep_${c.code}" value="${v20Esc(c.api.endpoint)}" placeholder="https://.../functions/v1/dexchange-gateway"></div><div class="notice">API Key / Secret باید یوازې په Supabase Secrets کې وساتل شي.</div>`:'<div class="notice" style="margin-top:8px">✋ Manual/Admin Approval: API settings پټ دي.</div>'}</div>`}).join('')}<button class="primary gold" onclick="v20SaveAPIs()">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`) };
window.v20SaveAPIs=function(){for(const c of v20Active()){c.api.enabled=document.getElementById('v20api_on_'+c.code)?.checked||false;if(c.processing.deposit==='automatic'||c.processing.withdraw==='automatic')c.api.endpoint=document.getElementById('v20api_ep_'+c.code)?.value.trim()||'';else{c.api.enabled=false;c.api.endpoint=''}}v20PersistSettings();closeModal();toast('API settings saved');openView('admin')};

<script>
/* D Exchange v22 financial/provider patch. Loaded after v21. */
(function(){
  'use strict';
  const GATEWAY='https://srakzgpwxmxtpxbvnelq.supabase.co/functions/v1/dexchange-gateway';
  state.api=state.api||{};
  state.api.afn=state.api.afn||{};
  state.api.crypto=state.api.crypto||{};
  state.api.afn.endpoint=state.api.afn.endpoint||GATEWAY;
  state.api.crypto.endpoint=state.api.crypto.endpoint||GATEWAY;

  function escv(x){return typeof esc==='function'?esc(String(x??'')):String(x??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));}
  function cfgLocal(c){
    const x=String(c||'').toUpperCase();
    const lc=(state.currencies||[]).find(z=>String(z.code||'').toUpperCase()===x)||{};
    return {code:x,symbol:lc.symbol||x,min_deposit:Number(lc.min_deposit||0),min_withdraw:Number(lc.min_withdraw||0),min_swap:Number(lc.min_swap||0),deposit_enabled:lc.deposit_enabled!==false,withdraw_enabled:lc.withdraw_enabled!==false,swap_enabled:lc.swap_enabled!==false,network:lc.network||((x==='USDT'||x==='AZAD')?'BEP20':'')};
  }
  async function dbCurrency(code){
    if(typeof dbReady!=='function'||!dbReady()) return cfgLocal(code);
    const {data,error}=await supabaseClient.from('currencies').select('*').eq('code',String(code).toUpperCase()).maybeSingle();
    if(error||!data)return cfgLocal(code);
    return Object.assign(cfgLocal(code),data);
  }
  async function allCurrencies(){
    if(typeof dbReady==='function'&&dbReady()){
      const {data}=await supabaseClient.from('currencies').select('*').eq('enabled',true).order('code');
      if(data?.length)return data;
    }
    return (state.currencies||[]).filter(c=>c.enabled!==false).map(c=>Object.assign(cfgLocal(c.code),c));
  }
  async function authHeaders(){
    if(!dbReady())throw new Error('Database is not connected');
    const {data,error}=await supabaseClient.auth.getSession();
    if(error||!data?.session?.access_token)throw new Error('Please login again');
    return {'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token};
  }
  async function gateway(path,body){
    const h=await authHeaders();
    const r=await fetch(GATEWAY+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.ok===false)throw new Error(d.message||('Gateway HTTP '+r.status));
    return d;
  }
  function minNotice(cfg,kind){
    const n=Number(cfg?.[kind==='deposit'?'min_deposit':kind==='withdraw'?'min_withdraw':'min_swap']||0);
    return n>0?`<small class="muted" style="display:block;margin-top:6px">Minimum: ${n} ${escv(cfg.symbol||cfg.code)}</small>`:'';
  }

  window.renderDepositMode=async function(){
    const c=document.getElementById('depCur')?.value,box=document.getElementById('depositMode');
    if(!c||!box)return;
    const cfg=await dbCurrency(c);
    if(dxIsAFN(c)){
      box.innerHTML=`<div class="field"><label>AFN Amount</label><input id="depAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00">${minNotice(cfg,'deposit')}</div><div class="notice">AFN Deposit د HesabPay له لارې ترسره کېږي. د تادیې لپاره به HesabPay Checkout خلاص شي.</div><button class="primary gold" style="width:100%" onclick="dxDepositAFN()">💳 Pay With HesabPay</button>`;
      return;
    }
    if(c==='USDT'||c==='AZAD'){
      box.innerHTML=`<div class="notice">Network: <b>BEP20</b></div><div class="field"><label>${c} BEP20 Deposit Address</label><div style="display:flex;gap:7px"><input id="depAddress" readonly placeholder="Loading address..."><button class="outline" onclick="copyText('depAddress')">${tr('Copy')}</button></div></div><small class="muted">یوازې همدې BEP20 ادرس ته ${c} ولېږئ.</small>`;
      try{
        const d=await gateway('/azadcoin/deposit-address',{currency:c});
        const addr=d?.data?.address||'';
        const el=document.getElementById('depAddress');if(el)el.value=addr;
      }catch(e){const el=document.getElementById('depAddress');if(el)el.value='';toast(e.message||'Deposit address could not be loaded')}
    }
  };

  window.deposit=async function(v){
    if(!state.features.deposit)return v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;
    const cs=(await allCurrencies()).filter(c=>c.deposit_enabled!==false);
    v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'),tr('Deposit subtitle'))}<div class="panel"><div class="field"><label>${tr('Currency')}</label><select id="depCur" onchange="renderDepositMode()">${dxCurrencyOptions(cs)}</select></div><div id="depositMode"></div></div></div>`;
    renderDepositMode();
  };

  window.dxDepositAFN=async function(){
    const u=current(),a=Number(document.getElementById('depAmt')?.value||0);
    if(!u||a<=0)return toast('Amount is required');
    const cfg=await dbCurrency('AFN');
    if(a<Number(cfg.min_deposit||0))return toast(`Minimum AFN Deposit is ${cfg.min_deposit} AFN`);
    try{
      const d=await gateway('/hesabpay/deposit',{amount:a,origin:location.origin});
      const txId=d.tx_id||uid();
      u.tx.unshift({id:txId,txId,type:'Deposit',amount:a,currency:'AFN',from:'HesabPay',to:`Account ${u.email}`,status:'pending',approvalMode:'automatic',time:new Date().toISOString(),fee:0,balanceBefore:Number(u.balances.AFN||0),balanceAfter:Number(u.balances.AFN||0),meta:{provider:'hesabpay',session_id:d.session_id||null,payment_url:d.payment_url||null}});
      save();
      if(d.payment_url) location.href=d.payment_url;
      else throw new Error('HesabPay payment URL was not returned');
    }catch(e){toast(e.message||'HesabPay payment failed')}
  };

  window.renderWithdrawMode=async function(){
    const c=document.getElementById('wdCur')?.value,box=document.getElementById('withdrawMode');if(!c||!box)return;
    const cfg=await dbCurrency(c);
    if(dxIsAFN(c)){
      box.innerHTML=`<div class="field"><label>HesabPay Account / Phone</label><input id="wdPhone" placeholder="079..." inputmode="tel"></div><div class="field"><label>AFN Amount</label><input id="wdAmt" type="number" min="0" step="any" inputmode="decimal">${minNotice(cfg,'withdraw')}</div><button class="primary gold" style="width:100%" onclick="dxWithdrawAFN()">📤 Confirm Withdraw</button>`;
    }else{
      box.innerHTML=`<div class="notice">Network: <b>BEP20</b></div><div class="field"><label>BEP20 Destination Address</label><input id="wdDest" placeholder="0x..." inputmode="text"></div><div class="field"><label>${c} Amount</label><input id="wdAmt" type="number" min="0" step="any" inputmode="decimal">${minNotice(cfg,'withdraw')}</div><button class="primary gold" style="width:100%" onclick="dxWithdrawCrypto()">📤 Confirm Withdraw</button>`;
    }
  };
  window.withdraw=async function(v){
    if(!state.features.withdraw)return v.innerHTML=`<div class="screen">${screenHead(tr('Withdraw'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;
    const cs=(await allCurrencies()).filter(c=>c.withdraw_enabled!==false);
    v.innerHTML=`<div class="screen">${screenHead(tr('Withdraw'),tr('Withdraw subtitle'))}<div class="panel"><div class="field"><label>${tr('Currency')}</label><select id="wdCur" onchange="renderWithdrawMode()">${dxCurrencyOptions(cs)}</select></div><div id="withdrawMode"></div></div></div>`;
    renderWithdrawMode();
  };

  window.dxWithdrawAFN=async function(){
    const u=current(),a=Number(document.getElementById('wdAmt')?.value||0),phone=document.getElementById('wdPhone')?.value.trim();
    if(!u||!a||!phone)return toast('Amount and HesabPay account are required');
    const cfg=await dbCurrency('AFN');if(a<Number(cfg.min_withdraw||0))return toast(`Minimum AFN Withdraw is ${cfg.min_withdraw} AFN`);
    if(Number(u.balances.AFN||0)<a)return toast(tr('Insufficient balance'));
    try{const d=await gateway('/hesabpay/withdraw',{amount:a,phone});const txId=d.tx_id||uid();u.balances.AFN=Number(u.balances.AFN||0)-a;u.tx.unshift({id:txId,txId,type:'Withdraw',amount:a,currency:'AFN',from:`Account ${u.email}`,to:`HesabPay ${phone}`,phone,status:'pending',approvalMode:'automatic',time:new Date().toISOString(),fee:0,balanceBefore:Number(u.balances.AFN||0)+a,balanceAfter:Number(u.balances.AFN||0),meta:{provider:'hesabpay'}});save();if(dbReady())dbSyncCurrent().catch(console.warn);toast('Withdraw request sent');openView('withdrawHistory')}catch(e){toast(e.message||'HesabPay withdrawal failed')}};

  window.dxWithdrawCrypto=async function(){
    const u=current(),c=document.getElementById('wdCur')?.value,a=Number(document.getElementById('wdAmt')?.value||0),address=document.getElementById('wdDest')?.value.trim();
    if(!u||!a||!address)return toast('Amount and BEP20 address are required');
    if(!/^0x[a-fA-F0-9]{40}$/.test(address))return toast(tr('Invalid BEP20 address'));
    const cfg=await dbCurrency(c);if(a<Number(cfg.min_withdraw||0))return toast(`Minimum ${c} Withdraw is ${cfg.min_withdraw} ${c}`);if(Number(u.balances[c]||0)<a)return toast(tr('Insufficient balance'));
    try{const d=await gateway('/azadcoin/withdraw',{currency:c,amount:a,address});const txId=d.tx_id||uid();u.balances[c]=Number(u.balances[c]||0)-a;u.tx.unshift({id:txId,txId,type:'Withdraw',amount:a,currency:c,from:`Account ${u.email}`,to:address,dest:address,status:'pending',approvalMode:'automatic',time:new Date().toISOString(),fee:Number(d.data?.fee||0),balanceBefore:Number(u.balances[c]||0)+a,balanceAfter:Number(u.balances[c]||0),network:'BEP20',meta:{provider:'azadcoin',withdrawal_id:d.data?.withdrawal_id||null}});save();if(dbReady())dbSyncCurrent().catch(console.warn);toast('Withdraw request sent');openView('withdrawHistory')}catch(e){toast(e.message||'AZADCoin withdrawal failed')}};

  const oldSwap=window.doSwap;
  window.doSwap=async function(){
    const u=current(),f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value,a=Number(document.getElementById('swAmt')?.value||0);
    if(!u||!a||f===t)return toast(tr('Invalid swap'));const cf=await dbCurrency(f),ct=await dbCurrency(t);if(cf.swap_enabled===false||ct.swap_enabled===false)return toast('Swap is disabled for this currency');if(a<Number(cf.min_swap||0))return toast(`Minimum ${f} Swap is ${cf.min_swap} ${f}`);if(Number(u.balances[f]||0)<a)return toast(tr('Insufficient balance'));return oldSwap();

  window.dxFinancialAdmin=async function(){
    if(!dbReady()||!ensureAdmin())return toast('Admin access required');

    }));

  /* Bot page: make the connection code prominent and easy to copy. */

<script>

*/
(function(){
  'use strict';
  const OLD_ADMIN_EMAIL='darwish@azad.com';
  const pairs=[
    ['AFN','USDT','AFN_USDT'],['USDT','AFN','USDT_AFN'],
    ['AFN','AZAD','AFN_AZAD'],['AZAD','AFN','AZAD_AFN'],
    ['USDT','AZAD','USDT_AZAD'],['AZAD','USDT','AZAD_USDT']
  ];

  window.saveManagedUser=async function(id){

      p_prices:prices,p_fee:Number(state.fee||0)
    });
    if(error)throw error;
    try{await supabaseClient.from('system_settings').upsert({key:'rates',value:{prices:state.prices||{},fee:Number(state.fee||0)}},{onConflict:'key'})}catch(e){console.warn('rates row sync',e)}
  }

  window.v24SaveRates=async function(){

      toast('Rate save failed: '+(e?.message||String(e)));

    const target=String(T?.[l]?.rates||'').trim().toLowerCase();

  };
})();

 if(error)throw error;data=data||[];
 const have=new Set(data.map(c=>String(c.code).toUpperCase()));
 const missing=DEFAULTS.filter(d=>!have.has(d.code));
 let warn='';
 if(missing.length){
  const r=await sb().from('currencies').upsert(missing,{onConflict:'code'});
  if(r.error){warn=r.error.message;data=data.concat(missing)}
  else{const r2=await sb().from('currencies').select('*').order('code');data=r2.data||data.concat(missing)}
 }
 data=data.map(c=>dxIsAFN(c.code)?Object.assign({},c,{name:'AFN'}):c);
 syncLocal(data);return {rows:data,warn};
}

function clean(root){

 while(w.nextNode()){if(BAD.test(w.currentNode.nodeValue))hits.push(w.currentNode);BAD.lastIndex=0}

      });

  }
