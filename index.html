<style>
:root{

}
*{box-sizing:border-box}html{scroll-behavior:smooth}

.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:50%;object-fit:contain;border:1px solid var(--line);background:#fff;box-shadow:0 5px 16px #0001}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);font-size:9px}
.top-actions{display:flex;gap:7px;align-items:center}.mini{border:1px solid var(--line);background:#fff;border-radius:11px;height:38px;padding:0 11px}.lang{position:relative}.langmenu{position:absolute;top:43px;right:0;width:130px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:5px;box-shadow:var(--shadow);z-index:100}.langmenu button{width:100%;border:0;background:transparent;padding:9px;text-align:right;border-radius:9px}.langmenu button:hover{background:#f4f5f7}

.auth{width:min(540px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow)}

.tabs{display:flex;background:#f1f2f4;padding:4px;border-radius:13px;margin-bottom:14px}.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px}.tabs .active{background:#fff;box-shadow:0 4px 14px #1111;font-weight:800}

main{padding:20px 0 calc(var(--bottom) + 20px)}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.page-title h1{margin:0;font-size:23px}.page-title p{margin:3px 0 0;color:var(--muted);font-size:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.panel h3{font-size:14px;margin:0 0 10px}.panel h4{font-size:12px;margin:0 0 8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 7px;text-align:center;min-height:75px}.action .ico{width:32px;height:32px;margin:0 auto 5px;border-radius:10px;background:#f6f0e2;display:grid;place-items:center;font-size:16px}.action b{font-size:10px}.action small{display:block;color:var(--muted);font-size:8px;margin-top:2px}

.tx{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:7px}.txl{display:flex;gap:8px;align-items:center}.txico{width:31px;height:31px;border-radius:9px;background:#f2f3f5;display:grid;place-items:center}.tx b{font-size:10px}.tx small{display:block;color:var(--muted);font-size:8px}.txamt{font-size:10px;font-weight:900}.green{color:var(--green)}.red{color:var(--red)}
.screen{min-height:calc(100vh - 65px)}.screenhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;width:38px;height:38px}.screenhead h2{font-size:20px;margin:0}.screenhead p{font-size:9px;color:var(--muted);margin:2px 0}
.quickform{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quote{padding:12px;border-radius:13px;background:#f7f8fa;border:1px solid var(--line);font-size:11px}.notice{padding:11px;border-radius:12px;background:#fbf7eb;border:1px solid #eadbb9;font-size:10px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{font-size:18px;display:block;margin-top:4px}

.profilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.profiletile{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;text-align:right}.profiletile .pico{width:35px;height:35px;border-radius:10px;background:#f6f0e2;display:grid;place-items:center}.profiletile b{font-size:10px}.profiletile small{display:block;color:var(--muted);font-size:8px}

.dark{--bg:#0d0f12;--card:#15181d;--text:#f3f4f6;--muted:#9aa1ac;--line:#282d34}.dark .top,.dark .appbar,.dark .bottom,.dark .panel,.dark .outline,.dark .mini,.dark .action,.dark .profiletile,.dark .tile,.dark .table th,.dark .modalbox,.dark .field input,.dark .field select,.dark .field textarea{background:#15181d;color:var(--text);border-color:#282d34}.dark .table th{background:#1b1f25}.dark .langmenu{background:#15181d;border-color:#282d34}.dark .tabs{background:#1c2026}.dark .tabs .active{background:#15181d}.dark .tx{border-color:#282d34}.dark .action .ico,.dark .profiletile .pico{background:#28231a}.dark .notice{background:#272218;border-color:#554522}

  <div class="authsub" data-i18n="authsub">خپل حساب ته ننوزئ یا نوی حساب جوړ کړئ</div>
  <div class="tabs">
   <button id="loginTab" class="active" onclick="authMode('login')">Login</button>
   <button id="regTab" onclick="authMode('register')">Register</button>
  </div>
  <form id="loginForm" onsubmit="login(event)">
   <div class="field"><label>Email</label><input id="loginEmail" type="email" required></div>
   <div class="field"><label>Password</label><input id="loginPass" type="password" required></div>
   <button class="primary gold" style="width:100%">Login</button>
   <div class="note">OTP ته اړتیا نشته. له Login وروسته Session تر هغه دوام کوي چې کاروونکی په خپله Logout وکړي.</div>
  </form>
  <form id="regForm" class="hidden" onsubmit="register(event)">
   <div class="formgrid">
    <div class="field"><label>نوم / First name</label><input id="rFirst" required></div>
    <div class="field"><label>تخلص / Last name</label><input id="rLast" required></div>
    <div class="field"><label>Email</label><input id="rEmail" type="email" required></div>
    <div class="field"><label>Phone / Country code</label><input id="rPhone" placeholder="+93..." required></div>
    <div class="field"><label>Strong password</label><input id="rPass" type="password" minlength="8" required></div>
    <div class="field"><label>Referral code</label><input id="rRef" inputmode="numeric" pattern="[0-9]*" placeholder="1010"></div>
   </div>
   <button class="primary gold" style="width:100%">Create account</button>
   <div class="note">لږ تر لږه 8 کرکټر قوي پاسورډ. OTP نه شته.</div>
  </form>

async function dbSyncAdminSettings(){if(!dbReady()||!ensureAdmin())return;const rows=[{key:"points_rules",value:state.pointsRules||{}},{key:"processing_modes",value:state.processingModes||{}},{key:"rates",value:{prices:state.prices||{},fee:state.fee}},{key:"features",value:state.features||{}},{key:"info",value:state.info||{}},{key:"telegram_bot",value:{enabled:!!state.telegramBot?.enabled,backendUrl:state.telegramBot?.backendUrl||"",webhookUrl:state.telegramBot?.webhookUrl||"",websiteUrl:state.telegramBot?.websiteUrl||"",username:state.telegramBot?.username||"",tokenConfigured:!!state.telegramBot?.tokenConfigured,welcomeMessage:state.telegramBot?.welcomeMessage||"",features:state.telegramBot?.features||{}}}];await supabaseClient.from("system_settings").upsert(rows,{onConflict:"key"});for(const k of ["afn","crypto","easyload"]){const row={name:k.toUpperCase(),integration_type:k,endpoint:state.api[k]?.endpoint||null,webhook_url:webhookUrl(k),enabled:!!state.api[k]?.enabled};const {data:existing}=await supabaseClient.from("api_integrations").select("id").eq("integration_type",k).limit(1);if(existing?.length)await supabaseClient.from("api_integrations").update(row).eq("id",existing[0].id);else await supabaseClient.from("api_integrations").insert(row)}}
async function dbHydrateAdminSettings(){if(!dbReady()||!ensureAdmin())return;try{const {data}=await supabaseClient.from("system_settings").select("key,value");(data||[]).forEach(r=>{if(r.key==="points_rules")state.pointsRules=Object.assign(state.pointsRules,r.value||{});if(r.key==="processing_modes")state.processingModes=Object.assign(state.processingModes,r.value||{});if(r.key==="rates"){state.prices=Object.assign(state.prices,r.value?.prices||{});if(r.value?.fee!=null)state.fee=Number(r.value.fee)}if(r.key==="features")state.features=Object.assign(state.features,r.value||{});if(r.key==="info")state.info=deepMerge(state.info,r.value||{});if(r.key==="telegram_bot")state.telegramBot=deepMerge(state.telegramBot,r.value||{})});save()}catch(e){console.warn("D Exchange settings load:",e)}}

async function dbSignUp({email,password,first,last,phone,ref}){if(!dbReady())return null;const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{first_name:first,last_name:last,phone,referred_by_code:ref||null}}});if(error)throw error;if(data.user){try{await dbHydrateUser(data.user)}catch(e){console.warn(e)} }return data}
async function dbSignIn(email,password){if(!dbReady())return null;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await dbHydrateUser(data.user);await dbHydrateAdminSettings();return data}
async function dbSignOut(){if(dbReady())await supabaseClient.auth.signOut()}

 e.preventDefault();
 if(window.__registerBusy)return;
 window.__registerBusy=true;
 try{
  const email=document.getElementById("rEmail").value.trim().toLowerCase();

function referralCodeForNewUser(email){return state.users.find(u=>u.email.toLowerCase()===email.toLowerCase())?.referralCode||allocateReferralCode(email)}
async function login(e){e.preventDefault();const email=document.getElementById("loginEmail").value.trim().toLowerCase(),pass=document.getElementById("loginPass").value;if(dbReady()){try{const data=await dbSignIn(email,pass);const u=current();if(u?.status==="blocked")return toast(tr("Blocked account"));if(u){u.lastLogin=new Date().toISOString();save()}enterApp();return}catch(err){console.error(err);return toast(err.message||tr("Wrong login"))}}const u=state.users.find(x=>x.email.toLowerCase()===email&&x.status!=="deleted");if(!u||u.pass!==pass)return toast(tr("Wrong login"));if(u.status==="blocked")return toast(tr("Blocked account"));u.lastLogin=new Date().toISOString();state.current=u.id;save();enterApp()}

function featureAction(icon,title,sub,view){const on=state.features[view]!==false;return `<button class="action" ${on?"":"disabled"} onclick="openView('${view}')"><div class="ico">${icon}</div><b>${title}</b><small>${on?sub:tr("Disabled")}</small></button>`}
function rateMini(){const p=state.prices;return `<div class="compact-grid"><div class="tile"><b>1 USDT → AFN</b><small>${p.usdtSell} AFN</small></div><div class="tile"><b>1 USDT ← AFN</b><small>${p.usdtBuy} AFN</small></div><div class="tile"><b>1 USDT → AZAD</b><small>${p.azadPerUsdt} AZAD</small></div><div class="tile"><b>${tr("Swap Fee")}</b><small>${state.fee}%</small></div></div>`}
function txStatusLabel(status){return status==="confirmed"?tr("Status Confirmed"):status==="rejected"?tr("Status Rejected"):tr("Status Pending")}
function txStatusBadge(status){const s=status||"pending";return `<span class="status-badge status-${s}">${s==="confirmed"?"✓":s==="rejected"?"×":"⌛"} ${txStatusLabel(s)}</span>`}
function txHtml(t){return `<div class="tx"><div class="txl"><div class="txico">${t.type==="Swap"?"⇄":t.type==="Deposit"?"↓":t.type==="Withdraw"?"↑":t.type==="Easyload"?"📱":"★"}</div><div><b>${esc(t.type)}</b><small>${new Date(t.time).toLocaleString()} · ${txStatusBadge(t.status)}</small></div></div><div class="txamt">${t.amount} ${esc(t.currency)}</div></div>`}
function rates(v){v.innerHTML=`<div class="screen">${screenHead(tr("Rates"),tr("Rates subtitle"))}<div class="panel">${rateMini()}<div class="notice" style="margin-top:10px">1 USDT ${tr("sell")}: ${state.prices.usdtSell} AFN · 1 USDT ${tr("buy")}: ${state.prices.usdtBuy} AFN · ${tr("Swap Fee")}: ${state.fee}%</div></div></div>`}
function swap(v){if(!state.features.swap)return v.innerHTML=`<div class="screen">${screenHead(tr("Swap"))}<div class="panel"><div class="notice">${tr("Disabled")}</div></div></div>`;v.innerHTML=`<div class="screen">${screenHead(tr("Swap"),"AFN ↔ USDT ↔ AZAD")}<div class="panel"><div class="quickform"><div class="field"><label>${tr("From")}</label><select id="swFrom"><option>AFN</option><option>USDT</option><option>AZAD</option></select></div><div class="field"><label>${tr("To")}</label><select id="swTo"><option>USDT</option><option>AFN</option><option>AZAD</option></select></div></div><div class="field"><label>${tr("Amount")}</label><input id="swAmt" type="number" min="0" step="any" oninput="quoteSwap()"></div><div class="quote" id="swQuote">${tr("Quote here")}</div><button class="primary gold" style="width:100%;margin-top:10px" onclick="doSwap()">${tr("Confirm Swap")} — ${state.fee}%</button></div></div>`}
function quoteSwap(){const a=+document.getElementById("swAmt").value||0,f=document.getElementById("swFrom").value,t=document.getElementById("swTo").value;const out=calcSwap(f,t,a);document.getElementById("swQuote").textContent=(f===t||!a)?tr("Quote here"): `${a} ${f} → ${out.toFixed(4)} ${t} (${state.fee}% ${tr("fee")})`}
function calcSwap(f,t,a){const p=state.prices;if(f===t)return a;let out=0;if(f==="AFN"&&t==="USDT")out=a/p.usdtBuy;if(f==="USDT"&&t==="AFN")out=a*p.usdtSell;if(f==="USDT"&&t==="AZAD")out=a*p.azadPerUsdt;if(f==="AZAD"&&t==="USDT")out=a/p.azadPerUsdt;if(f==="AFN"&&t==="AZAD")out=(a/p.usdtBuy)*p.azadPerUsdt;if(f==="AZAD"&&t==="AFN")out=(a/p.azadPerUsdt)*p.usdtSell;return out*(1-state.fee/100)}
function doSwap(){const u=current(),f=document.getElementById("swFrom").value,t=document.getElementById("swTo").value,a=+document.getElementById("swAmt").value||0;if(!u||!a||f===t)return toast(tr("Invalid swap"));if((u.balances[f]||0)<a)return toast(tr("Insufficient balance"));const beforeFrom=Number(u.balances[f]||0),beforeTo=Number(u.balances[t]||0),out=calcSwap(f,t,a);u.balances[f]=beforeFrom-a;u.balances[t]=beforeTo+out;if(state.pointsRules.enabled)u.points+=Number(state.pointsRules.swap)||0;u.tx.unshift({id:uid(),txId:uid(),type:"Swap",amount:a,currency:f,from:`Account ${u.email}`,to:t,out,status:"confirmed",time:new Date().toISOString(),fee:state.fee,balanceBefore:beforeFrom,balanceAfter:u.balances[f],meta:{toBalanceBefore:beforeTo,toBalanceAfter:u.balances[t],atomic:true}});save();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr("Swap complete"));openView("dashboard")}
function deposit(v){if(!state.features.deposit)return v.innerHTML=`<div class="screen">${screenHead(tr("Deposit"))}<div class="panel"><div class="notice">${tr("Disabled")}</div></div></div>`;v.innerHTML=`<div class="screen">${screenHead(tr("Deposit"),tr("Deposit subtitle"))}<div class="panel"><div class="field"><label>${tr("Currency")}</label><select id="depCur" onchange="renderDepositMode()"><option>USDT</option><option>AZAD</option><option>AFN</option></select></div><div id="depositMode"></div></div></div>`;renderDepositMode()}
function renderDepositMode(){const c=document.getElementById("depCur").value;const box=document.getElementById("depositMode");if(c==="AFN"){box.innerHTML=`<div class="field"><label>${tr("HesabPay phone")}</label><input id="depPhone" placeholder="+93..." inputmode="tel"></div><div class="field"><label>${tr("Amount")}</label><input id="depAmt" type="number" min="0" step="any"></div><div class="notice">${tr("AFN deposit notice")}</div><button class="primary gold" style="width:100%" onclick="doDepositAFN()">${tr("Continue to HesabPay")}</button>`}else{box.innerHTML=`<div class="notice">${tr("Crypto address notice")}</div><div class="field"><label>${c} ${tr("BEP20 deposit address")}</label><div style="display:flex;gap:7px"><input id="depAddress" readonly value="${esc(getDepositAddress(c))}"><button class="outline" onclick="copyText('depAddress')">${tr("Copy")}</button></div></div><div class="field"><label>${tr("TxID (optional)")}</label><input id="depTx" placeholder="0x..."></div><button class="primary gold" style="width:100%" onclick="submitCryptoDeposit()">${tr("I have deposited")}</button>`}}
function getDepositAddress(c){const a=state.api.crypto.addresses||{};return a[c]||tr("Connect crypto API to generate address")}
async function doDepositAFN(){const u=current(),phone=document.getElementById("depPhone")?.value.trim(),a=Number(document.getElementById("depAmt")?.value||0);if(!phone||a<=0)return toast(tr("Amount and phone required"));if(!state.api?.afn?.enabled)return toast(tr("AFN API is not configured"));const endpoint=String(state.api.afn.endpoint||'').replace(/\/$/,'');if(!endpoint)return toast('Secure gateway URL is not configured');try{const r=await fetch(endpoint+'/hesabpay/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:String(a),phone,email:u.email,external_user_id:u.id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||('HTTP '+r.status));u.tx.unshift({id:uid(),txId:d.transaction_id||uid(),type:'Deposit',amount:a,currency:'AFN',from:`HesabPay ${phone}`,to:`Account ${u.email}`,phone,status:'pending',approvalMode:state.processingModes.deposit,time:new Date().toISOString(),fee:0,balanceBefore:Number(u.balances.AFN||0),balanceAfter:Number(u.balances.AFN||0),meta:{provider:'hesabpay',provider_reference:d.payment_id||d.session_id||null,payment_url:d.payment_url||null}});save();if(d.payment_url)window.open(d.payment_url,'_blank','noopener');toast(tr('HesabPay request sent'));openView('transactions')}catch(e){console.error(e);toast(e.message||'HesabPay request failed')}}

/* D Exchange withdrawal safety guard (frontend layer only).
   Prevents double-clicks, same-account duplicate pending withdrawals,
   and repeated submissions from multiple tabs on the same browser.
   Final financial protection must also be enforced server-side/RPC. */
function withdrawSafetyLock(currency){
  const u=current();
  if(!u)return {ok:false};
  const pending=(u.tx||[]).some(t=>t.type==="Withdraw" && t.currency===currency && (!t.status || t.status==="pending"));
  if(pending){ toast(tr("A withdrawal is already pending")); return {ok:false}; }
  const key=`dexchange_withdraw_lock_${u.id||u.email}_${currency}`;
  try{
    const now=Date.now(), existing=Number(localStorage.getItem(key)||0);
    if(existing && now-existing < 15*60*1000){ toast(tr("A withdrawal is already being processed")); return {ok:false}; }
    localStorage.setItem(key,String(now));
  }catch(e){}
  return {ok:true};
}
function releaseWithdrawSafetyLock(currency){
  /* Intentionally not released after a successful submission: the pending
     transaction itself remains the primary frontend guard until its status changes. */
}

async function syncBotLinkCode(u,force=false){
  if(!dbReady()||!u?.id)return false;
  try{
    if(force||!u.botCode||!u.botCodeExpires||Date.now()>=Number(u.botCodeExpires)){
      const bytes=new Uint32Array(1);
      crypto.getRandomValues(bytes);
      u.botCode=String(100000+(bytes[0]%900000));
      u.botCodeExpires=Date.now()+600000;
    }
    if(force){
      await supabaseClient.from("telegram_link_codes").update({used_at:new Date().toISOString()}).eq("user_id",u.id).is("used_at",null);
    }
    const {error}=await supabaseClient.from("telegram_link_codes").insert({user_id:u.id,code:String(u.botCode),expires_at:new Date(u.botCodeExpires).toISOString()});
    if(error){console.warn("Telegram link code sync",error);return false;}
    save();
    return true;
  }catch(e){console.warn("Telegram link code sync",e);return false}
}

async function saveCurrencyV21(oldCode){

function adminDatabase(){const d=state.db||{};showModal(`<h3>${tr("Database Connection")}</h3><div class="notice">${tr("Database notice")}</div><div class="field"><label>${tr("Supabase Project URL")}</label><input id="dbUrl" type="url" value="${esc(d.url||"")}" placeholder="https://YOUR_PROJECT.supabase.co"></div><div class="field"><label>${tr("Supabase Publishable Key")}</label><input id="dbKey" type="password" value="${esc(d.publishableKey||"")}" autocomplete="off" placeholder="sb_publishable_..."></div><div class="compact-grid"><div class="tile"><b>${tr("Connection Status")}</b><small>${d.connected?tr("Connected"):tr("Not connected")}</small></div><div class="tile"><b>${tr("Last Test")}</b><small>${d.lastTest?new Date(d.lastTest).toLocaleString():"—"}</small></div></div><p class="muted" style="margin-top:10px">${tr("Database security notice")}</p><button class="primary gold" onclick="testDatabaseConnection()">${tr("Test Connection")}</button> <button class="outline" onclick="saveDatabaseConfig()">${tr("Save")}</button> <button class="outline" onclick="closeModal()">${tr("Close")}</button>`)}
function saveDatabaseConfig(){state.db.url=document.getElementById("dbUrl").value.trim().replace(/\/$/,"");state.db.publishableKey=document.getElementById("dbKey").value.trim();save();closeModal();openView("admin");toast(tr("Database settings saved"))}
async function testDatabaseConnection(){const url=document.getElementById("dbUrl").value.trim().replace(/\/$/,"");const key=document.getElementById("dbKey").value.trim();if(!url||!key)return toast(tr("Database credentials required"));state.db={url,publishableKey:key,connected:false,lastTest:new Date().toISOString()};save();try{if(!window.supabase)throw new Error("Supabase library not loaded");supabaseClient=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const r=await fetch(url+"/rest/v1/profiles?select=id&limit=1",{headers:{apikey:key,Authorization:"Bearer "+key}});state.db.connected=r.ok;state.db.lastTest=new Date().toISOString();save();toast(r.ok?tr("Database connection successful"):tr("Database connection failed"));adminDatabase()}catch(e){state.db.connected=false;state.db.lastTest=new Date().toISOString();save();toast(tr("Database connection failed"));adminDatabase()}}
function adminPoints(){const p=state.pointsRules;showModal(`<h3>${tr("Points Control")}</h3><label style="display:flex;gap:7px;align-items:center;padding:9px 0"><input id="ptOn" type="checkbox" ${p.enabled?"checked":""}> ${tr("Enable Points System")}</label><div class="formgrid"><div class="field"><label>${tr("Points per Swap")}</label><input id="ptSwap" type="number" min="0" value="${p.swap}"></div><div class="field"><label>${tr("Points per Easyload")}</label><input id="ptEasy" type="number" min="0" value="${p.easyload}"></div><div class="field"><label>${tr("Referral Reward")}</label><input id="ptRef" type="number" min="0" value="${p.referral}"></div><div class="field"><label>${tr("Points per 1 AFN")}</label><input id="ptAfn" type="number" min="1" value="${p.afnPerPoints}"></div><div class="field full"><label>${tr("Minimum Redeem Points")}</label><input id="ptMin" type="number" min="1" value="${p.minRedeem}"></div></div><div class="panel" style="margin-top:10px"><b>${tr("Manual User Points")}</b><div class="field"><label>${tr("User")}</label><select id="ptUser">${state.users.filter(u=>u.status!=="deleted").map(u=>`<option value="${u.id}">${esc(u.first+" "+u.last)} — ${esc(u.email)}</option>`).join("")}</select></div><div class="formgrid"><div class="field"><label>${tr("Add Points")}</label><input id="ptAdd" type="number" value="0"></div><div class="field"><label>${tr("Remove Points")}</label><input id="ptRemove" type="number" min="0" value="0"></div></div><button class="outline" onclick="adjustUserPoints()">${tr("Apply Points Adjustment")}</button></div><div class="notice" style="margin-top:10px">${tr("Points admin notice")}</div><button class="primary gold" onclick="savePointsRules()">${tr("Save")}</button> <button class="outline" onclick="closeModal()">${tr("Close")}</button>`)}
function savePointsRules(){state.pointsRules.enabled=document.getElementById("ptOn").checked;state.pointsRules.swap=Math.max(0,+document.getElementById("ptSwap").value||0);state.pointsRules.easyload=Math.max(0,+document.getElementById("ptEasy").value||0);state.pointsRules.referral=Math.max(0,+document.getElementById("ptRef").value||0);state.pointsRules.afnPerPoints=Math.max(1,+document.getElementById("ptAfn").value||10);state.pointsRules.minRedeem=Math.max(1,+document.getElementById("ptMin").value||100);save();closeModal();openView("admin");toast(tr("Points rules saved"))}
function adjustUserPoints(){const u=state.users.find(x=>x.id===document.getElementById("ptUser").value);if(!u)return;const add=Math.max(0,+document.getElementById("ptAdd").value||0),remove=Math.max(0,+document.getElementById("ptRemove").value||0);u.points=Math.max(0,Number(u.points||0)+add-remove);u.tx.push({id:uid(),type:"Points Adjustment",amount:add-remove,currency:"POINTS",from:"Admin",to:`Account ${u.email}`,status:"confirmed",time:new Date().toISOString(),fee:0,balanceBefore:u.points-(add-remove),balanceAfter:u.points});save();if(dbReady())dbSaveManagedUser(u).catch(console.warn);toast(tr("Points adjusted"));adminPoints()}

async function botBackend(action,payload={}){if(!dbReady()||!ensureAdmin())return {error:"Admin session required"};const endpoint=String(state.telegramBot?.backendUrl||`${state.db.url}/functions/v1/telegram-bot`).replace(/\/$/,"");if(!endpoint)return {error:"Bot backend URL required"};try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session?.access_token)return {error:"Admin session expired"};const r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json",apikey:state.db.publishableKey,Authorization:"Bearer "+session.access_token},body:JSON.stringify({action,...payload})});const data=await r.json().catch(()=>({}));if(!r.ok||data?.error)throw new Error(data?.error||`Backend HTTP ${r.status}`);return data}catch(e){console.error("D Exchange Telegram backend",e);return {error:String(e?.message||e)}}}

testTelegramBot()">${tr("Test Token")}</button><button class="outline" onclick="setTelegramWebhook()">${tr("Connect Webhook")}</button><button class="outline" onclick="deleteTelegramWebhook()">${tr("Disconnect Webhook")}</button><button class="outline" onclick="closeModal()">${tr("Close")}</button></div>`)}

async function saveTelegramBot(){const backend=document.getElementById("tgBackend").value.trim().replace(/\/$/,"");const username=document.getElementById("tgUsername").value.trim();const token=document.getElementById("tgToken").value.trim();state.telegramBot.backendUrl=backend;state.telegramBot.webhookUrl=backend;state.telegramBot.websiteUrl=document.getElementById("tgWebsite").value.trim();state.telegramBot.username=username||"@YourBot";state.telegramBot.enabled=document.getElementById("tgOn").checked;state.telegramBot.welcomeMessage=document.getElementById("tgWelcome").value.trim();save();if(dbReady()){try{await dbSyncAdminSettings()}catch(e){console.warn(e)} }if(token){const r=await botBackend("save_token",{token,username:state.telegramBot.username});if(r?.error)return toast(r.error);state.telegramBot.tokenConfigured=true;save();}toast(tr("Telegram bot settings saved"));adminTelegramBot()}

async function setTelegramWebhook(){const backend=document.getElementById("tgBackend")?.value.trim().replace(/\/$/,"")||telegramWebhookUrl();state.telegramBot.backendUrl=backend;state.telegramBot.webhookUrl=backend;save();const r=await botBackend("set_webhook",{webhookUrl:backend,features:state.telegramBot.features});if(r?.error)return toast(r.error);toast(tr("Telegram webhook connected"));adminTelegramBot()}

function adminUsers(){showModal(`<h3>${tr("User Management")}</h3><div class="field"><label>${tr("Search")}</label><input id="userSearch" oninput="renderUserTable()" placeholder="${tr("Search by name or email")}"></div><div id="userTable"></div><button class="outline" style="margin-top:10px" onclick="closeModal()">${tr("Close")}</button>`);renderUserTable()}
function renderUserTable(){const q=(document.getElementById("userSearch")?.value||"").trim().toLowerCase();const list=state.users.filter(u=>u.status!=="deleted"&&(u.email.toLowerCase().includes(q)||(u.first+" "+u.last).toLowerCase().includes(q)));document.getElementById("userTable").innerHTML=`<div class="tablewrap"><table class="table"><tr><th>${tr("User")}</th><th>${tr("Email")}</th><th>${tr("Role")}</th><th>${tr("Status")}</th><th>${tr("Balance")}</th><th>${tr("Manage")}</th></tr>${list.map(u=>`<tr><td>${esc(u.first+" "+u.last)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.status)}</td><td>AFN ${u.balances.AFN.toFixed(2)} / USDT ${u.balances.USDT.toFixed(2)} / AZAD ${u.balances.AZAD.toFixed(2)}</td><td><button class="outline" onclick="manageUser('${u.id}')">${tr("Manage")}</button></td></tr>`).join("")||`<tr><td colspan="6">${tr("No users")}</td></tr>`}</table></div>`}
function manageUser(id){const u=state.users.find(x=>x.id===id);if(!u)return;showModal(`<h3>${tr("Manage")}: ${esc(u.first+" "+u.last)}</h3><div class="compact-grid"><div class="tile"><b>${tr("Email")}</b><small>${esc(u.email)}</small></div><div class="tile"><b>${tr("Phone")}</b><small>${esc(u.phone)}</small></div></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>${tr("AFN Balance")}</label><input id="mA" type="number" value="${u.balances.AFN}"></div><div class="field"><label>${tr("USDT Balance")}</label><input id="mU" type="number" value="${u.balances.USDT}"></div><div class="field"><label>${tr("AZAD Balance")}</label><input id="mZ" type="number" value="${u.balances.AZAD}"></div><div class="field"><label>${tr("Role")}</label><select id="mR"><option value="user" ${u.role==="user"?"selected":""}>${tr("User")}</option><option value="admin" ${u.role==="admin"?"selected":""}>${tr("Admin")}</option></select></div><div class="field"><label>${tr("Status")}</label><select id="mS"><option value="active" ${u.status==="active"?"selected":""}>${tr("Active")}</option><option value="blocked" ${u.status==="blocked"?"selected":""}>${tr("Blocked")}</option><option value="deleted" ${u.status==="deleted"?"selected":""}>${tr("Deleted")}</option></select></div></div><div class="notice">${tr("Password not viewable")}</div><button class="primary gold" onclick="saveManagedUser('${u.id}')">${tr("Save")}</button> <button class="outline" onclick="resetUserPassword('${u.id}')">${tr("Reset Password")}</button> <button class="outline" onclick="adminUsers()">${tr("Back")}</button>`)}
function saveManagedUser(id){const u=state.users.find(x=>x.id===id);u.balances.AFN=+document.getElementById("mA").value||0;u.balances.USDT=+document.getElementById("mU").value||0;u.balances.AZAD=+document.getElementById("mZ").value||0;u.role=document.getElementById("mR").value;u.status=document.getElementById("mS").value;if(u.email.toLowerCase()===ADMIN_EMAIL)u.role="admin";save();if(dbReady())dbSaveManagedUser(u).catch(console.warn);closeModal();adminUsers();toast(tr("User updated"))}
function resetUserPassword(id){const u=state.users.find(x=>x.id===id);if(!u)return;const p=prompt(tr("Enter new password"));if(!p||p.length<8)return toast(tr("Password too short"));u.pass=p;save();toast(tr("Password reset"))}
function adminTransactions(){const all=[];state.users.forEach(u=>u.tx.forEach(t=>all.push({...t,userId:u.id,user:u.email,name:u.first+" "+u.last})));all.sort((a,b)=>b.time.localeCompare(a.time));showModal(`<h3>${tr("All Transactions")}</h3><div class="tablewrap"><table class="table"><tr><th>${tr("User")}</th><th>${tr("Type")}</th><th>${tr("Amount")}</th><th>${tr("Currency")}</th><th>${tr("Transaction Status")}</th><th>${tr("Time")}</th><th>${tr("Details")}</th></tr>${all.map(t=>`<tr><td>${esc(t.name)}<br>${esc(t.user)}</td><td>${esc(t.type)}</td><td>${t.amount}</td><td>${esc(t.currency)}</td><td><select onchange="adminSetTxStatus('${t.userId}','${t.id}',this.value)"><option value="pending" ${(!t.status||t.status==="pending")?"selected":""}>${tr("Status Pending")}</option><option value="confirmed" ${t.status==="confirmed"?"selected":""}>${tr("Status Confirmed")}</option><option value="rejected" ${t.status==="rejected"?"selected":""}>${tr("Status Rejected")}</option></select></td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.ref||t.dest||t.phone||t.address||t.to||"—")}</td></tr>`).join("")||`<tr><td colspan="7">${tr("No transactions")}</td></tr>`}</table></div><button class="outline" style="margin-top:10px" onclick="closeModal()">${tr("Close")}</button>`)}
function adminSetTxStatus(userId,txId,status){const u=state.users.find(x=>x.id===userId),t=u?.tx.find(x=>x.id===txId);if(!u||!t)return;const prev=t.status||"pending";if(prev===status)return;if(status==="rejected"&&prev!=="rejected"&&t.type==="Withdraw"){u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||0);t.balanceAfter=u.balances[t.currency];t.meta={...(t.meta||{}),refunded:true}}if(status==="confirmed"&&prev!=="confirmed"&&t.type==="Deposit"){u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||t.out||0);t.balanceAfter=u.balances[t.currency]}t.status=status;t.statusChangedAt=new Date().toISOString();save();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr("Status updated"));adminTransactions()}

  };
  window.saveAPIs=function(){

  /* Referral repair: ensure a visible direct entry and make rendering fail-safe. */
  const oldDashboard=window.dashboard;

    const root=v.querySelector('.actions');

      const b=document.createElement('button'); b.className='action'; b.setAttribute('data-dx-referral','1'); b.innerHTML='<div class="ico">🔗</div><b>'+tr('Referral')+'</b><small>Invite & earn</small>'; b.onclick=()=>window.openView('referral'); root.appendChild(b);
    }
  }catch(e){console.warn(e)}};
  window.openView=(function(original){return function(name){
    if(name==='referral' && !current()) return showAuth();
    return original(name);
  }})(window.openView);
  /* Secure financial rule: a pending withdrawal reserves balance; rejection refunds exactly once. */
  window.adminSetTxStatus=(function(original){return function(userId,txId,status){
    const u=state.users.find(x=>x.id===userId),t=u?.tx.find(x=>x.id===txId); if(!u||!t)return;
    const prev=t.status||'pending'; if(prev===status)return;
    if(status==='rejected' && prev!=='rejected' && t.type==='Withdraw' && !t.meta?.refunded){
      u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||0); t.balanceAfter=u.balances[t.currency]; t.meta={...(t.meta||{}),refunded:true};
    }
    if(status==='confirmed' && prev!=='confirmed' && t.type==='Deposit' && !t.meta?.credited){
      u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||t.out||0); t.balanceAfter=u.balances[t.currency]; t.meta={...(t.meta||{}),credited:true};
    }
    t.status=status; t.statusChangedAt=new Date().toISOString(); save(); if(dbReady())dbSyncCurrent().catch(console.warn); toast(tr('Status updated')); adminTransactions();
  }})(window.adminSetTxStatus);
})();

<script>
/* D EXCHANGE v13 FUNCTIONAL PATCH
   Frontend fixes + secure API configuration model + currency controls + tasks.
   Provider secrets are intentionally NOT stored in localStorage/HTML.
*/
(function(){
  const _save=window.save;
  function ensureV13(){
    state.currencyControl=state.currencyControl||{deposit:{AFN:true,USDT:true,AZAD:true},withdraw:{AFN:true,USDT:true,AZAD:true}};
    state.swapFeeEnabled=state.swapFeeEnabled===true;
    state.swapFee=Number.isFinite(Number(state.swapFee))?Number(state.swapFee):Number(state.fee||0);

      AFN_USDT:65,USDT_AFN:67.5,

  /* ---------- Referral: remove duplicate button created by v12 patch; keep exactly one ---------- */

  window.dashboard=function(v){
    oldDashboard(v);
    const items=[...v.querySelectorAll('[data-dx-referral], .action')];
    const refs=items.filter(x=>x.textContent.includes(tr('Referral'))||x.textContent.includes('Referral')||x.textContent.includes('ریفریل')||x.textContent.includes('معرفی'));
    refs.slice(1).forEach(x=>x.remove());
  };

  /* ---------- Directed exchange rates: six directions ---------- */
  window.calcSwap=function(f,t,a){
    if(f===t)return Number(a)||0;
    const key=f+'_'+t, rate=Number(state.prices[key]);
    if(!Number.isFinite(rate)||rate<=0)return 0;
    let out=(Number(a)||0)*rate;
    if(state.swapFeeEnabled && Number(state.swapFee)>0) out*=1-Number(state.swapFee)/100;
    return out;
  };
  window.rateMini=function(){
    const p=state.prices||{};
    const fee=state.swapFeeEnabled&&Number(state.swapFee)>0?`${Number(state.swapFee)}%`:'—';
    return `<div class="compact-grid">
      <div class="tile"><b>1 AFN → USDT</b><small>${Number(p.AFN_USDT).toFixed(6)}</small></div>
      <div class="tile"><b>1 USDT → AFN</b><small>${Number(p.USDT_AFN).toFixed(4)}</small></div>
      <div class="tile"><b>1 AFN → AZAD</b><small>${Number(p.AFN_AZAD).toFixed(6)}</small></div>
      <div class="tile"><b>1 AZAD → AFN</b><small>${Number(p.AZAD_AFN).toFixed(6)}</small></div>
      <div class="tile"><b>1 USDT → AZAD</b><small>${Number(p.USDT_AZAD).toFixed(4)}</small></div>
      <div class="tile"><b>1 AZAD → USDT</b><small>${Number(p.AZAD_USDT).toFixed(8)}</small></div>
      <div class="tile"><b>${tr('Swap Fee')}</b><small>${fee}</small></div>
    </div>`;
  };
  window.rates=function(v){v.innerHTML=`<div class="screen">${screenHead(tr('Rates'),tr('Rates subtitle'))}<div class="panel">${rateMini()}<div class="notice" style="margin-top:10px">${state.swapFeeEnabled&&Number(state.swapFee)>0?tr('Swap Fee')+': '+Number(state.swapFee)+'%':tr('Fee is not configured')}</div></div></div>`};
  window.swap=function(v){
    if(!state.features.swap)return v.innerHTML=`<div class="screen">${screenHead(tr('Swap'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;
    const opts=['AFN','USDT','AZAD'];
    v.innerHTML=`<div class="screen">${screenHead(tr('Swap'),'AFN ↔ USDT ↔ AZAD')}<div class="panel">
      <div class="quickform"><div class="field"><label>${tr('From')}</label><select id="swFrom" onchange="quoteSwap()">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>${tr('To')}</label><select id="swTo" onchange="quoteSwap()">${opts.map((x,i)=>`<option ${i===1?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="field"><label>${tr('Amount')}</label><input id="swAmt" type="number" min="0" step="any" oninput="quoteSwap()"></div>
      <div class="quote" id="swQuote">${tr('Quote here')}</div>
      <button class="primary gold" style="width:100%;margin-top:10px" onclick="doSwap()">${tr('Confirm Swap')}</button>
    </div></div>`;
  };
  window.quoteSwap=function(){const a=+document.getElementById('swAmt')?.value||0,f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value;if(!a||f===t)return document.getElementById('swQuote').textContent=tr('Quote here');const out=calcSwap(f,t,a);const fee=state.swapFeeEnabled&&Number(state.swapFee)>0?` · ${Number(state.swapFee)}% ${tr('fee')}`:'';document.getElementById('swQuote').textContent=`${a} ${f} → ${out.toFixed(8)} ${t}${fee}`};
  window.doSwap=function(){const u=current(),f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value,a=+document.getElementById('swAmt')?.value||0;if(!u||!a||f===t)return toast(tr('Invalid swap'));if((u.balances[f]||0)<a)return toast(tr('Insufficient balance'));const out=calcSwap(f,t,a),beforeFrom=Number(u.balances[f]||0),beforeTo=Number(u.balances[t]||0);u.balances[f]=beforeFrom-a;u.balances[t]=beforeTo+out;const fee=state.swapFeeEnabled?Number(state.swapFee)||0:0;if(state.pointsRules.enabled)u.points+=Number(state.pointsRules.swap)||0;u.tx.unshift({id:uid(),txId:uid(),type:'Swap',amount:a,currency:f,from:`Account ${u.email}`,to:t,out,status:'confirmed',time:new Date().toISOString(),fee,balanceBefore:beforeFrom,balanceAfter:u.balances[f],meta:{toBalanceBefore:beforeTo,toBalanceAfter:u.balances[t],rate:Number(state.prices[f+'_'+t]),atomic:true}});
    /* Referral becomes active after the referred user's first confirmed swap. */
    if(!u.refRewardGiven && u.referredBy){const inviter=state.users.find(x=>String(x.referralCode)===String(u.referredBy)&&x.status==='active');if(inviter){inviter.activeRef=(Number(inviter.activeRef)||0)+1;if(state.pointsRules.enabled){inviter.points=(Number(inviter.points)||0)+Number(state.pointsRules.referral||0)}u.refRewardGiven=true;}}
    saveV13();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr('Swap complete'));openView('dashboard')};

  /* ---------- Deposit / Withdrawal currency visibility ---------- */
  function currencyOptions(mode){return ['AFN','USDT','AZAD'].filter(c=>state.currencyControl?.[mode]?.[c]!==false)}
  window.deposit=function(v){if(!state.features.deposit)return v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;const cs=currencyOptions('deposit');v.innerHTML=`<div class="screen">${screenHead(tr('Deposit'),tr('Deposit subtitle'))}<div class="panel"><div class="field"><label>${tr('Currency')}</label><select id="depCur" onchange="renderDepositMode()">${cs.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="depositMode"></div></div></div>`;renderDepositMode()};
  window.withdraw=function(v){if(!state.features.withdraw)return v.innerHTML=`<div class="screen">${screenHead(tr('Withdraw'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;const cs=currencyOptions('withdraw');v.innerHTML=`<div class="screen">${screenHead(tr('Withdraw'),tr('Withdraw subtitle'))}<div class="panel"><div class="field"><label>${tr('Currency')}</label><select id="wdCur" onchange="renderWithdrawMode()">${cs.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="withdrawMode"></div></div></div>`;renderWithdrawMode()};

  /* ---------- Admin rates ---------- */
  window.adminRates=function(){const p=state.prices;showModal(`<h3>${tr('Rates')}</h3><div class="formgrid">
    ${[['AFN_USDT','1 AFN → USDT'],['USDT_AFN','1 USDT → AFN'],['AFN_AZAD','1 AFN → AZAD'],['AZAD_AFN','1 AZAD → AFN'],['USDT_AZAD','1 USDT → AZAD'],['AZAD_USDT','1 AZAD → USDT']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="rate_${k}" type="number" step="any" min="0" value="${Number(p[k])}"></div>`).join('')}
    <div class="field"><label>${tr('Swap Fee')}</label><input id="swapFee" type="number" step="0.01" min="0" value="${Number(state.swapFee||0)}"></div>

    </div><div class="notice">${tr('Rates are set independently for every direction.')} ${tr('Fee is not configured')}</div><button class="primary gold" onclick="saveRatesV13()">${tr('Save')}</button> <button class="outline" onclick="closeModal()">${tr('Cancel')}</button>`)};
  window.saveRatesV13=function(){const keys=['AFN_USDT','USDT_AFN','AFN_AZAD','AZAD_AFN','USDT_AZAD','AZAD_USDT'];for(const k of keys){const n=Number(document.getElementById('rate_'+k).value);if(!Number.isFinite(n)||n<=0)return toast('Invalid rate');state.prices[k]=n}state.swapFee=Number(document.getElementById('swapFee').value)||0;state.swapFeeEnabled=document.getElementById('swapFeeEnabled').value==='1';state.fee=state.swapFee;saveV13();closeModal();openView('admin');toast(tr('Rates saved'))};

  /* ---------- Admin currency + processing controls ---------- */
  window.adminCurrencyControls=function(){const c=state.currencyControl;showModal(`<h3>💱 Deposit / Withdraw Controls</h3>${['deposit','withdraw'].map(m=>`<div class="panel" style="margin:10px 0"><h4>${m==='deposit'?tr('Deposit'):tr('Withdraw')}</h4>${['AFN','USDT','AZAD'].map(cur=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><b>${cur}</b><button class="switch ${c[m][cur]!==false?'on':''}" onclick="toggleCurrency('${m}','${cur}')"></button></div>`).join('')}</div>`).join('')}<button class="outline" onclick="closeModal()">${tr('Close')}</button>`)};
  window.toggleCurrency=function(mode,cur){state.currencyControl[mode][cur]=state.currencyControl[mode][cur]===false;saveV13();adminCurrencyControls()};

  /* ---------- Secure API settings: only endpoint/config metadata in browser ---------- */
  window.adminAPIs=function(){const a=state.api;showModal(`<h3>${tr('API Settings')}</h3><div class="notice">API keys/secrets are never stored in this HTML or localStorage. Put provider secrets in the secure backend/Edge Function environment. The website only stores the backend gateway URL and integration status.</div>
    ${[['afn','AFN — HesabPay','HesabPay'],['crypto','USDT + AZAD — AZADCoin','AZADCoin'],['easyload','Easyload API','Easyload']].map(([k,title,ph])=>`<div class="panel" style="margin:10px 0"><h4>${title}</h4><div class="field"><label>Secure Gateway URL</label><input id="gw_${k}" type="url" value="${esc(a[k].endpoint||'')}" placeholder="https://YOUR_PROJECT.supabase.co/functions/v1/dexchange-gateway"></div><div class="field"><label>Provider integration name</label><input value="${ph}" readonly></div><label style="display:flex;gap:7px;align-items:center"><input id="en_${k}" type="checkbox" ${a[k].enabled?'checked':''}> ${tr('Enable')}</label><button class="outline" style="margin-top:8px" onclick="testGatewayV13('${k}')">Test Secure Gateway</button></div>`).join('')}

    <button class="primary gold" onclick="saveAPIsV13()">${tr('Save')}</button> <button class="outline" onclick="closeModal()">${tr('Cancel')}</button>`)};
  window.saveAPIsV13=function(){for(const k of ['afn','crypto','easyload']){state.api[k].endpoint=document.getElementById('gw_'+k).value.trim();state.api[k].enabled=document.getElementById('en_'+k).checked}saveV13();closeModal();openView('admin');toast(tr('API settings saved'))};
  window.testGatewayV13=async function(k){const url=state.api[k]?.endpoint||document.getElementById('gw_'+k)?.value.trim();if(!url)return toast('Secure Gateway URL is required');try{const r=await fetch(url.replace(/\/$/,'')+'/health',{method:'GET',headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);toast('Secure gateway is reachable')}catch(e){toast('Gateway not reachable: '+e.message)}};

  /* ---------- Tasks ---------- */
  window.tasks=function(v){const u=current();const active=state.tasks.filter(t=>t.enabled!==false);v.innerHTML=`<div class="screen">${screenHead('Tasks','Complete verified tasks and earn points')}<div class="panel">${active.length?active.map(t=>`<div class="task-card"><div class="task-row"><div><b>${esc(t.name)}</b><small class="muted" style="display:block">${esc(t.description||'')}</small></div><span class="task-status task-on">+${Number(t.bonus||0)} ${tr('Points')}</span></div><div style="margin-top:8px"><a class="info-link" href="${esc(t.url||'#')}" target="_blank" rel="noopener noreferrer">🔗 ${esc(t.url||'Open task')}</a></div><div class="field" style="margin-top:8px"><label>${esc(t.usernameLabel||'Username / proof')}</label><input id="taskproof_${esc(t.id)}" placeholder="@username or proof link"></div><button class="primary gold" style="margin-top:7px" onclick="submitTask('${esc(t.id)}')">Submit Task</button></div>`).join(''):`<div class="notice">No active tasks.</div>`}</div></div>`};
  window.submitTask=function(id){const u=current(),t=state.tasks.find(x=>x.id===id);if(!u||!t)return;const proof=document.getElementById('taskproof_'+id)?.value.trim();if(!proof)return toast('Proof/username is required');u.taskSubmissions=u.taskSubmissions||[];if(u.taskSubmissions.some(x=>x.taskId===id&&x.status==='pending'))return toast('This task is already submitted');u.taskSubmissions.push({taskId:id,proof,status:'pending',submittedAt:new Date().toISOString(),bonus:0});saveV13();toast('Task submitted for verification');openView('tasks')};
  window.adminTasks=function(){state.tasks=state.tasks||[];showModal(`<h3>📋 Tasks Control</h3><div class="panel"><div class="field"><label>Task name</label><input id="tn"></div><div class="field"><label>Task URL</label><input id="tu" type="url" placeholder="https://t.me/... or https://..." ></div><div class="field"><label>Description</label><textarea id="td"></textarea></div><div class="formgrid"><div class="field"><label>Bonus Points</label><input id="tb" type="number" min="0" value="0"></div><div class="field"><label>Verification</label><select id="tv"><option value="telegram">Telegram</option><option value="manual">Manual proof</option><option value="api">Platform API/OAuth</option></select></div></div><button class="primary gold" onclick="addTaskV13()">Add Task</button></div><div style="margin-top:10px">${state.tasks.map(t=>`<div class="task-card"><div class="task-row"><div><b>${esc(t.name)}</b><small class="muted">+${Number(t.bonus||0)} ${tr('Points')} · ${esc(t.verification||'manual')}</small></div><button class="danger" onclick="deleteTaskV13('${esc(t.id)}')">Delete</button></div><div class="muted">${esc(t.url||'')}</div></div>`).join('')||'<div class="notice">No tasks yet.</div>'}</div><button class="outline" style="margin-top:10px" onclick="closeModal()">${tr('Close')}</button>`)};

<script>
(function(){
  'use strict';

  /* D EXCHANGE v14 - production safety + EasyLoad manual approval patch */
  state.processingModes = state.processingModes || {deposit:'automatic',withdraw:'automatic',easyload:'manual'};
  if(state.easyloadModeInitialized !== true){
    state.processingModes.easyload='manual';
    state.easyloadModeInitialized=true;
  }
  state.processingModes.deposit = state.processingModes.deposit==='manual' ? 'manual' : 'automatic';
  state.processingModes.withdraw = state.processingModes.withdraw==='manual' ? 'manual' : 'automatic';
  state.processingModes.easyload = state.processingModes.easyload==='automatic' ? 'automatic' : 'manual';

  /* Never keep provider secrets in browser state/localStorage. */
  function sanitizeApiState(){
    state.api=state.api||{};
    for(const k of ['afn','crypto','easyload']){
      state.api[k]=state.api[k]||{};
      delete state.api[k].key;
      delete state.api[k].secret;
    }
  }
  sanitizeApiState();

  /* Keep the existing save function but make every future save sanitize first. */
  const baseSave=window.save;
  window.save=function(){sanitizeApiState(); return baseSave.apply(this,arguments)};

  /* EasyLoad: deduct/reserve AFN once, then confirm/reject from admin. */
  window.doEasy=function(){
    const u=current(), a=Number(document.getElementById('elAmt')?.value||0), p=String(document.getElementById('elPhone')?.value||'').trim();
    if(!u||!a||a<=0||!p)return toast(tr('Amount and phone required'));
    if(Number(u.balances.AFN||0)<a)return toast(tr('Insufficient balance'));
    const mode=state.processingModes?.easyload||'manual';
    const before=Number(u.balances.AFN||0), after=before-a;
    const t={
      id:uid(),txId:uid(),type:'Easyload',amount:a,currency:'AFN',
      from:`Account ${u.email}`,to:`Mobile ${p}`,phone:p,
      status:mode==='automatic'?'confirmed':'pending',approvalMode:mode,
      time:new Date().toISOString(),fee:0,balanceBefore:before,balanceAfter:after,
      meta:{processingMode:mode,phone:p,reserved:true,refunded:false,pointsAwarded:false}
    };
    u.balances.AFN=after;
    if(mode==='automatic' && state.pointsRules.enabled){
      u.points+=Number(state.pointsRules.easyload)||0;
      t.meta.pointsAwarded=true;
    }
    u.tx.unshift(t);
    saveV14();
    if(dbReady())dbSyncCurrent().catch(console.warn);
    toast(mode==='automatic'?tr('Easyload successful'):tr('Easyload request sent'));
    openView('dashboard');
  };

  /* Idempotent admin status transition for Deposit / Withdraw / EasyLoad. */
  window.adminSetTxStatus=function(userId,txId,status){
    if(!ensureAdmin())return toast(tr('Admin only'));
    const u=state.users.find(x=>x.id===userId), t=u?.tx.find(x=>x.id===txId);
    if(!u||!t)return;
    const prev=t.status||'pending';
    if(prev===status)return;
    t.meta=t.meta||{};

    if(t.type==='Withdraw' && status==='rejected' && prev!=='rejected' && !t.meta.refunded){
      u.balances[t.currency]=(Number(u.balances[t.currency])||0)+Number(t.amount||0);
      t.balanceAfter=u.balances[t.currency];
      t.meta.refunded=true;
    }

    if(t.type==='Deposit' && status==='confirmed' && prev!=='confirmed' && !t.meta.credited){
      const amount=Number(t.amount||t.out||0);
      if(amount>0){
        u.balances[t.currency]=(Number(u.balances[t.currency])||0)+amount;
        t.balanceAfter=u.balances[t.currency];
      }
      t.meta.credited=true;
    }

    if(t.type==='Easyload'){
      if(status==='confirmed' && prev!=='confirmed'){
        if(t.meta.refunded)return toast('This Easyload was already refunded and cannot be approved');
        if(!t.meta.pointsAwarded && state.pointsRules.enabled){
          u.points=(Number(u.points)||0)+Number(state.pointsRules.easyload||0);
          t.meta.pointsAwarded=true;
        }
        t.meta.approvedAt=new Date().toISOString();
      }
      if(status==='rejected' && prev!=='rejected'){
        if(!t.meta.refunded){
          u.balances.AFN=(Number(u.balances.AFN)||0)+Number(t.amount||0);
          t.balanceAfter=u.balances.AFN;
          t.meta.refunded=true;
        }
        t.meta.rejectedAt=new Date().toISOString();
      }
    }

    t.status=status;
    t.statusChangedAt=new Date().toISOString();
    saveV14();
    if(dbReady())dbSyncCurrent().catch(console.warn);
    toast(tr('Status updated'));
    adminTransactions();
  };

  /* Secure API UI: only gateway metadata is entered in the browser. */
  window.adminAPIs=function(){
    state.api=state.api||{};
    for(const k of ['afn','crypto','easyload'])state.api[k]=state.api[k]||{};
    const a=state.api;
    const gatewayDefault=String(state.db?.url||'').replace(/\/$/,'')+'/functions/v1/dexchange-gateway';
    showModal(`<h3>${tr('API Settings')}</h3>
      <div class="notice">API keys and provider secrets are not stored in this HTML or browser storage. Configure them only as secure Edge Function environment secrets. This page stores only gateway configuration.</div>
      ${[
        ['afn','AFN — HesabPay','HesabPay'],
        ['crypto','USDT + AZAD — AZADCoin','AZADCoin'],
        ['easyload','EasyLoad API','EasyLoad']
      ].map(([k,title,name])=>`<div class="panel" style="margin:10px 0">
        <h4>${title}</h4>
        <div class="field"><label>Secure Gateway URL</label><input id="gw_${k}" type="url" value="${esc(a[k].endpoint||gatewayDefault)}" placeholder="${esc(gatewayDefault)}"></div>
        <div class="field"><label>Integration</label><input value="${name}" readonly></div>
        <label style="display:flex;gap:7px;align-items:center"><input id="en_${k}" type="checkbox" ${a[k].enabled?'checked':''}> ${tr('Enable')}</label>
        <button class="outline" style="margin-top:8px" onclick="testGatewayV14('${k}')">Test Secure Gateway</button>
      </div>`).join('')}
      <div class="notice">AZADCoin uses its documented server-side API and webhook verification. HesabPay and EasyLoad provider credentials must remain on the secure backend.</div>
      <button class="primary gold" onclick="saveAPIsV14()">${tr('Save')}</button>
      <button class="outline" onclick="closeModal()">${tr('Cancel')}</button>`);
  };

  window.saveAPIsV14=function(){
    state.api=state.api||{};
    for(const k of ['afn','crypto','easyload']){
      state.api[k]=state.api[k]||{};
      state.api[k].endpoint=String(document.getElementById('gw_'+k)?.value||'').trim();
      state.api[k].enabled=!!document.getElementById('en_'+k)?.checked;
      delete state.api[k].key; delete state.api[k].secret;
    }
    saveV14();
    closeModal(); openView('admin'); toast(tr('API settings saved'));
  };

  window.testGatewayV14=async function(k){
    const url=String(document.getElementById('gw_'+k)?.value||state.api?.[k]?.endpoint||'').trim();
    if(!url)return toast('Secure Gateway URL is required');
    try{
      const r=await fetch(url.replace(/\/$/,'')+'/health',{method:'GET',headers:{Accept:'application/json'}});
      if(!r.ok)throw new Error('HTTP '+r.status);
      toast('Secure gateway is reachable');
    }catch(e){toast('Gateway not reachable: '+(e?.message||'network error'))}
  };

  /* Processing mode: preserve admin choice, but initial EasyLoad mode is manual. */
  const oldSetProcessing=window.setProcessingModeV13;
  window.setProcessingModeV13=function(k,v){
    if(!['deposit','withdraw','easyload'].includes(k))return;
    state.processingModes[k]=v==='manual'?'manual':'automatic';
    if(k==='easyload')state.easyloadModeInitialized=true;
    saveV14();
    adminProcessingModes();
  };

  /* Persist v14 settings without secrets. */
  function saveV14(){
    sanitizeApiState();
    if(typeof window.saveV13==='function')return window.saveV13();
    window.save();
    if(dbReady()&&typeof dbSyncAdminSettings==='function'&&ensureAdmin())dbSyncAdminSettings().catch(console.warn);
  }

  /* Make the admin transaction screen explicitly identify EasyLoad approval. */
  const baseAdminTransactions=window.adminTransactions;
  window.adminTransactions=function(){
    baseAdminTransactions();
    try{
      const modal=document.getElementById('modal');
      if(modal){
        const notice=document.createElement('div');
        notice.className='notice';
        notice.style.marginBottom='10px';
        notice.textContent='EasyLoad manual approval: Confirm = complete + award points; Reject = refund AFN once.';
        const first=modal.querySelector('.tablewrap');
        if(first)first.parentNode.insertBefore(notice,first);
      }
    }catch(e){console.warn(e)}
  };

  /* Ensure existing state is sanitized and EasyLoad starts in manual approval mode. */
  sanitizeApiState();
  saveV14();
})();

</script>

(function(){

      })()]).catch(console.warn);

  }

    const c=window.__dxProviderCreds.crypto||{};
    const a=window.__dxProviderCreds.afn||{};
    showModal(`<h3>${tr('API Settings')}</h3>
      <div class="notice">${tr('API security notice')}<br>${tr('API settings ready notice')}</div>
      <div class="panel" style="margin:10px 0">
        <h4>AFN — HesabPay</h4>
        <div class="field"><label>${tr('API Key')}</label><input id="afnkey17" type="password" autocomplete="new-password" value="${esc(a.key||'')}" placeholder="HesabPay API Key"></div>
        <div class="field"><label>API Secret / Merchant Secret</label><input id="afnsecret17" type="password" autocomplete="new-password" value="${esc(a.secret||'')}" placeholder="If HesabPay provides one"></div>
        <label style="display:flex;gap:7px;align-items:center"><input id="en_afn17" type="checkbox" ${state.api.afn.enabled?'checked':''}> ${tr('Enable')}</label>
        <button class="outline" style="margin-top:8px" onclick="testProvider17('afn')">Test HesabPay API</button>
      </div>
      <div class="panel" style="margin:10px 0">
        <h4>USDT + AZAD — AZADCoin</h4>
        <div class="field"><label>API Key</label><input id="cryptoKey17" type="password" autocomplete="new-password" value="${esc(c.key||'')}" placeholder="AZADCoin API Key"></div>
        <div class="field"><label>API Secret</label><input id="cryptoSecret17" type="password" autocomplete="new-password" value="${esc(c.secret||'')}" placeholder="AZADCoin API Secret"></div>
        <div class="muted" style="margin-bottom:8px">HMAC-SHA256 signing uses the API Secret on the secure backend. Both fields are required.</div>
        <label style="display:flex;gap:7px;align-items:center"><input id="en_crypto17" type="checkbox" ${state.api.crypto.enabled?'checked':''}> ${tr('Enable')}</label>
        <button class="outline" style="margin-top:8px" onclick="testProvider17('crypto')">Test AZADCoin API</button>
      </div>
      <div class="panel" style="margin:10px 0">
        <h4>Easyload</h4>
        <div class="notice">Easyload is currently <b>Manual Approval</b>. Its provider API is not required yet.</div>
        <label style="display:flex;gap:7px;align-items:center;margin-top:8px"><input id="en_easy17" type="checkbox" ${state.api.easyload.enabled?'checked':''}> ${tr('Enable')}</label>
      </div>
      <button class="primary gold" onclick="saveAPIs17()">${tr('Save')}</button>
      <button class="outline" onclick="closeModal()">${tr('Cancel')}</button>`);
  };

  window.saveAPIs17=function(){
    window.__dxProviderCreds=window.__dxProviderCreds||{};
    window.__dxProviderCreds.afn={key:document.getElementById('afnkey17')?.value.trim()||'',secret:document.getElementById('afnsecret17')?.value.trim()||''};
    window.__dxProviderCreds.crypto={key:document.getElementById('cryptoKey17')?.value.trim()||'',secret:document.getElementById('cryptoSecret17')?.value.trim()||''};
    state.api.afn.enabled=!!document.getElementById('en_afn17')?.checked;
    state.api.crypto.enabled=!!document.getElementById('en_crypto17')?.checked;
    state.api.easyload.enabled=!!document.getElementById('en_easy17')?.checked;
    // Never put API credentials into localStorage/state. Only connection status is persisted.
    saveV14(); closeModal(); openView('admin'); toast(tr('API settings saved'));
  };

  window.testProvider17=async function(kind){
    const c=window.__dxProviderCreds?.[kind]||{};
    if(!c.key||!c.secret)return toast('API Key and API Secret are required');
    if(!dbReady())return toast('Supabase backend is not connected');
    try{
      const {data,error}=await supabaseClient.functions.invoke('dexchange-gateway',{body:{action:'test_connection',integration:kind,apiKey:c.key,apiSecret:c.secret}});
      if(error)throw error;
      toast(data?.ok?'API connection successful':(data?.message||'API connection failed'));
    }catch(e){ console.error(e); toast(e?.message||'Secure API test failed'); }
  };
})();
</script>

<script>
(function(){
'use strict';
const V20_CORE=['AFN','USDT','AZAD'];
const V20_NAMES={AFN:'AFN',USDT:'Tether USD',AZAD:'Azad Coin'};
function v20Init(){
  state.currencies=Array.isArray(state.currencies)?state.currencies:V20_CORE.map(code=>({code,name:V20_NAMES[code]||code,symbol:code,enabled:true,deposit:true,withdraw:true,processing:{deposit:state.processingModes?.deposit||'automatic',withdraw:state.processingModes?.withdraw||'automatic'},api:{enabled:false,endpoint:'',integrationId:uid()}}));
  for(const code of V20_CORE){if(!state.currencies.some(c=>c.code===code))state.currencies.push({code,name:V20_NAMES[code],symbol:code,enabled:true,deposit:true,withdraw:true,processing:{deposit:'automatic',withdraw:'automatic'},api:{enabled:false,endpoint:'',integrationId:uid()}})}
  state.currencies.forEach(c=>{c.code=String(c.code||'').toUpperCase();c.name=c.name||c.code;c.symbol=c.symbol||c.code;c.enabled=c.enabled!==false;c.deposit=c.deposit!==false;c.withdraw=c.withdraw!==false;c.processing=c.processing||{};c.processing.deposit=c.processing.deposit==='manual'?'manual':'automatic';c.processing.withdraw=c.processing.withdraw==='manual'?'manual':'automatic';c.api=c.api||{};c.api.enabled=!!c.api.enabled;c.api.endpoint=c.api.endpoint||'';c.api.integrationId=c.api.integrationId||uid()});
  state.dynamicBalances=state.dynamicBalances||{};
  state.prices=state.prices||{};
  state.prices.AFN_USDT=state.prices.AFN_USDT||((Number(state.prices.usdtBuy)||67.5)>0?1/Number(state.prices.usdtBuy):1/67.5);
  state.prices.USDT_AFN=state.prices.USDT_AFN||Number(state.prices.usdtSell)||65;
  state.prices.USDT_AZAD=state.prices.USDT_AZAD||Number(state.prices.azadPerUsdt)||1715;
  state.prices.AZAD_USDT=state.prices.AZAD_USDT||1/(Number(state.prices.USDT_AZAD)||1715);
  state.prices.AFN_AZAD=state.prices.AFN_AZAD||1/(Number(state.prices.AZAD_AFN)||1715/67.5);
  state.prices.AZAD_AFN=state.prices.AZAD_AFN||Number(state.prices.USDT_AFN||65)/Number(state.prices.USDT_AZAD||1715);
  state.prices.USDT_AFN=Number(state.prices.USDT_AFN)||65;
  state.prices.AFN_USDT=Number(state.prices.AFN_USDT)||1/67.5;
  state.prices.USDT_AZAD=Number(state.prices.USDT_AZAD)||1715;
  state.prices.AZAD_USDT=Number(state.prices.AZAD_USDT)||1/1715;
  state.prices.AFN_AZAD=Number(state.prices.AFN_AZAD)||1/(1715/67.5);
  state.prices.AZAD_AFN=Number(state.prices.AZAD_AFN)||1715/67.5;
  state.tasks=[];
  save();
}
v20Init();
function v20Active(){return state.currencies.filter(c=>c.enabled!==false)}
function v20Currency(code){return state.currencies.find(c=>c.code===String(code).toUpperCase())}
function v20EnsureBalances(u){u.balances=u.balances||{};v20Active().forEach(c=>{if(u.balances[c.code]==null)u.balances[c.code]=0})}
function v20PersistSettings(){save();if(typeof dbReady==='function'&&dbReady()&&typeof ensureAdmin==='function'&&ensureAdmin()&&typeof supabaseClient!=='undefined'){supabaseClient.from('system_settings').upsert({key:'currencies_v20',value:state.currencies},{onConflict:'key'}).then(()=>supabaseClient.from('system_settings').upsert({key:'rates_v20',value:state.prices},{onConflict:'key'})).catch(console.warn)}}
function v20Esc(s){return esc(s)}
window.adminCurrencyControls=function(){
 const rows=v20Active().map(c=>`<div class="v20-currency-row"><div><b>${v20Esc(c.code)}</b><small class="muted" style="display:block">${v20Esc(c.name)}</small></div><button class="outline" onclick="v20EditCurrency('${v20Esc(c.code)}')">✏️</button><button class="danger" onclick="v20RemoveCurrency('${v20Esc(c.code)}')">${V20_CORE.includes(c.code)?'Disable':'Delete'}</button></div>`).join('');
 showModal(`<h3>💱 Currency Control</h3><div class="panel"><div class="field"><label>Currency Code</label><input id="v20ccode" maxlength="12" placeholder="مثلاً BTC"></div><div class="field"><label>Currency Name</label><input id="v20cname" placeholder="Bitcoin"></div><div class="field"><label>Symbol</label><input id="v20csymbol" maxlength="8" placeholder="BTC"></div><button class="primary gold" onclick="v20AddCurrency()">➕ Add Currency</button></div><div class="panel" style="margin-top:10px">${rows||'<div class="notice">No currencies.</div>'}</div><button class="outline" onclick="closeModal()">Close</button>`)
};
window.v20AddCurrency=function(){const code=document.getElementById('v20ccode')?.value.trim().toUpperCase(),name=document.getElementById('v20cname')?.value.trim(),symbol=(document.getElementById('v20csymbol')?.value.trim().toUpperCase()||code);if(!/^[A-Z0-9_]{2,12}$/.test(code))return toast('Invalid currency code');if(!name)return toast('Currency name is required');if(v20Currency(code))return toast('Currency already exists');state.currencies.push({code,name,symbol,enabled:true,deposit:true,withdraw:true,processing:{deposit:'manual',withdraw:'manual'},api:{enabled:false,endpoint:'',integrationId:uid()}});v20EnsureAllBalances(code);v20PersistSettings();adminCurrencyControls();toast('Currency added')};
function v20EnsureAllBalances(code){state.users.forEach(u=>{u.balances=u.balances||{};if(u.balances[code]==null)u.balances[code]=0})}
window.v20RemoveCurrency=function(code){const c=v20Currency(code);if(!c)return;if(V20_CORE.includes(code)){c.enabled=false;c.deposit=false;c.withdraw=false}else{state.currencies=state.currencies.filter(x=>x.code!==code)}v20PersistSettings();adminCurrencyControls();toast(V20_CORE.includes(code)?'Currency disabled':'Currency removed')};
window.v20EditCurrency=function(code){const c=v20Currency(code);if(!c)return;showModal(`<h3>⚙️ ${v20Esc(c.code)} Settings</h3><div class="field"><label>Name</label><input id="v20en" value="${v20Esc(c.name)}"></div><div class="field"><label>Symbol</label><input id="v20es" value="${v20Esc(c.symbol)}"></div><div class="compact-grid"><label class="tile"><input id="v20ed" type="checkbox" ${c.deposit?'checked':''}> Deposit فعال</label><label class="tile"><input id="v20ew" type="checkbox" ${c.withdraw?'checked':''}> Withdraw فعال</label></div><div class="panel" style="margin-top:10px"><b>Processing Mode</b><div class="compact-grid" style="margin-top:8px"><button class="outline" onclick="v20SetMode('${code}','deposit','automatic')">⚡ Deposit Automatic</button><button class="outline" onclick="v20SetMode('${code}','deposit','manual')">✋ Deposit Manual</button><button class="outline" onclick="v20SetMode('${code}','withdraw','automatic')">⚡ Withdraw Automatic</button><button class="outline" onclick="v20SetMode('${code}','withdraw','manual')">✋ Withdraw Manual</button></div><small class="muted">Deposit: ${c.processing.deposit} · Withdraw: ${c.processing.withdraw}</small></div><button class="primary gold" onclick="v20SaveCurrency('${code}')">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`)};
window.v20SetMode=function(code,kind,mode){const c=v20Currency(code);if(c)c.processing[kind]=mode;v20EditCurrency(code)};
window.v20SaveCurrency=function(code){const c=v20Currency(code);if(!c)return;c.name=document.getElementById('v20en').value.trim()||c.name;c.symbol=document.getElementById('v20es').value.trim().toUpperCase()||c.code;c.deposit=document.getElementById('v20ed').checked;c.withdraw=document.getElementById('v20ew').checked;c.enabled=true;v20PersistSettings();closeModal();adminCurrencyControls();toast('Currency settings saved')};
window.adminRates=function(){const cs=v20Active();const pairs=[];for(const a of cs)for(const b of cs)if(a.code!==b.code)pairs.push([a.code,b.code]);showModal(`<h3>💱 Rates</h3><div class="formgrid">${pairs.map(([a,b])=>{const k=a+'_'+b;return `<div class="field"><label>1 ${a} → ${b}</label><input id="v20r_${k}" type="number" min="0" step="any" value="${Number(state.prices[k]||0)}"></div>`}).join('')}</div><div class="notice">هره فعاله کرنسي د نورو فعالو کرنسيو لپاره خپل نرخ لري.</div><button class="primary gold" onclick="v20SaveRates()">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`) };
window.v20SaveRates=function(){for(const a of v20Active())for(const b of v20Active())if(a.code!==b.code){const k=a.code+'_'+b.code,n=Number(document.getElementById('v20r_'+k)?.value||0);if(!n||n<0)return toast('Invalid rate: '+k);state.prices[k]=n}v20PersistSettings();closeModal();toast('Rates saved');openView('admin')};
window.calcSwap=function(f,t,a){if(f===t)return Number(a)||0;const r=Number(state.prices[String(f).toUpperCase()+'_'+String(t).toUpperCase()]);if(!r||r<=0)return 0;let out=(Number(a)||0)*r;if(state.swapFeeEnabled&&Number(state.swapFee)>0)out*=1-Number(state.swapFee)/100;return out};
window.swap=function(v){const opts=v20Active().map(c=>c.code);if(!state.features.swap)return v.innerHTML=`<div class="screen">${screenHead(tr('Swap'))}<div class="panel"><div class="notice">${tr('Disabled')}</div></div></div>`;v.innerHTML=`<div class="screen">${screenHead(tr('Swap'),'Dynamic Currency Exchange')}<div class="panel"><div class="quickform"><div class="field"><label>${tr('From')}</label><select id="swFrom" onchange="quoteSwap()">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${tr('To')}</label><select id="swTo" onchange="quoteSwap()">${opts.map((x,i)=>`<option ${i===1?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>${tr('Amount')}</label><input id="swAmt" type="number" min="0" step="any" oninput="quoteSwap()"></div><div class="quote" id="swQuote">${tr('Quote here')}</div><button class="primary gold" style="width:100%;margin-top:10px" onclick="v20DoSwap()">${tr('Confirm Swap')}</button><button class="outline" style="width:100%;margin-top:8px" onclick="openView('swapHistory')">🧾 Swap History</button></div></div>`};
window.v20DoSwap=function(){const u=current(),f=document.getElementById('swFrom')?.value,t=document.getElementById('swTo')?.value,a=Number(document.getElementById('swAmt')?.value||0);if(!u||!a||f===t)return toast('Invalid swap');v20EnsureBalances(u);if(Number(u.balances[f]||0)<a)return toast(tr('Insufficient balance'));const out=calcSwap(f,t,a);if(!out)return toast('Rate is not configured');const bf=Number(u.balances[f]||0),bt=Number(u.balances[t]||0);u.balances[f]=bf-a;u.balances[t]=bt+out;u.tx.unshift({id:uid(),txId:'DX-'+uid().toUpperCase(),type:'Swap',amount:a,currency:f,out,from:`Account ${u.email}`,to:t,status:'confirmed',approvalMode:'automatic',time:new Date().toISOString(),fee:state.swapFeeEnabled?Number(state.swapFee)||0:0,balanceBefore:bf,balanceAfter:u.balances[f],meta:{toBalanceBefore:bt,toBalanceAfter:u.balances[t],rate:state.prices[f+'_'+t]}});if(state.pointsRules?.enabled)u.points=(Number(u.points)||0)+Number(state.pointsRules.swap||0);save();if(dbReady())dbSyncCurrent().catch(console.warn);toast(tr('Swap complete'));openView('swapHistory')};
function v20TxPage(type,title,icon){const u=current();const map={Deposit:'Deposit',Withdraw:'Withdraw',Swap:'Swap',Easyload:'Easyload'};const rows=(u?.tx||[]).filter(t=>t.type===map[type]);return `<div class="screen">${screenHead(title,'Full transaction history')}<div class="v20-history-tabs">${[['Deposit','💳'],['Withdraw','📤'],['Swap','⇄'],['Easyload','📱'],['Benefits','⭐']].map(([k,i])=>`<button class="${type===k?'active':''}" onclick="openView('${k.toLowerCase()}History')">${i} ${k}</button>`).join('')}</div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Amount</th><th>Currency</th><th>Status</th><th>Time</th><th>Details</th></tr>${rows.slice().reverse().map(t=>`<tr onclick="showTxDetails('${esc(t.id)}')"><td>${esc(t.type)}</td><td>${t.amount}${t.out!=null?' → '+t.out:''}</td><td>${esc(t.currency)}</td><td>${txStatusBadge(t.status)}</td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.txId||t.to||'—')}</td></tr>`).join('')||`<tr><td colspan="6">No ${type} transactions.</td></tr>`}</table></div></div>`}
function v20BenefitsHistory(){const u=current();const rows=(u?.tx||[]).filter(t=>/Points|Bonus|Referral/i.test(t.type||'')||t.currency==='POINTS');return `<div class="screen">${screenHead('Benefits Transactions','Points and rewards history')}<div class="v20-history-tabs">${[['Deposit','💳'],['Withdraw','📤'],['Swap','⇄'],['Easyload','📱'],['Benefits','⭐']].map(([k,i])=>`<button class="${'Benefits'===k?'active':''}" onclick="openView('${k.toLowerCase()}History')">${i} ${k}</button>`).join('')}</div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Amount</th><th>Currency</th><th>Status</th><th>Time</th><th>Details</th></tr>${rows.slice().reverse().map(t=>`<tr><td>${esc(t.type)}</td><td>${t.amount}</td><td>${esc(t.currency)}</td><td>${txStatusBadge(t.status)}</td><td>${new Date(t.time).toLocaleString()}</td><td>${esc(t.txId||t.to||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No benefits transactions.</td></tr>'}</table></div></div>`}
window.openView=(function(old){return function(name){if(name==='depositHistory')return document.getElementById('view').innerHTML=v20TxPage('Deposit','Deposit Transactions','💳');if(name==='withdrawHistory')return document.getElementById('view').innerHTML=v20TxPage('Withdraw','Withdraw Transactions','📤');if(name==='swapHistory')return document.getElementById('view').innerHTML=v20TxPage('Swap','Swap Transactions','⇄');if(name==='easyloadHistory')return document.getElementById('view').innerHTML=v20TxPage('Easyload','Easyload Transactions','📱');if(name==='benefitsHistory')return document.getElementById('view').innerHTML=v20BenefitsHistory();return old(name)}})(window.openView);
function v20AddHistoryButton(selector,name,label){const root=document.getElementById('view');if(!root)return;if(root.querySelector('[data-v20-history="'+name+'"]'))return;const b=document.createElement('button');b.className='outline';b.dataset.v20History=name;b.style.cssText='width:100%;margin-top:8px';b.textContent='🧾 '+label;b.onclick=()=>openView(name);root.querySelector('.panel')?.appendChild(b)}
for(const [fn,history,label] of [['deposit','depositHistory','Deposit History'],['withdraw','withdrawHistory','Withdraw History'],['easyload','easyloadHistory','Easyload History'],['benefits','benefitsHistory','Benefits Transactions']]){const old=window[fn];if(typeof old==='function')window[fn]=function(v){old(v);setTimeout(()=>v20AddHistoryButton(null,history,label),0)}}
/* Remove Tasks completely from user/admin UI. */
function v20RemoveTasks(){document.querySelectorAll('.action,.profiletile,button,a').forEach(el=>{if(/Tasks|Task Verification|Task Submissions|دندې|ټاسک/i.test(el.textContent||'')){el.remove()}})}
const oldDash=window.dashboard;window.dashboard=function(v){oldDash(v);v20RemoveTasks();v.querySelector('.walletlogo')?.remove()};
const oldAdmin=window.admin;window.admin=function(v){oldAdmin(v);v20RemoveTasks();const grid=v.querySelector('.profilegrid');if(grid&&!grid.querySelector('[data-v20-currency]')){const b=document.createElement('button');b.className='profiletile';b.dataset.v20Currency='1';b.onclick=adminCurrencyControls;b.innerHTML='<span class="pico">💱</span><span><b>Currency Control</b><small>Add, remove, rates, processing and API</small></span>';grid.prepend(b)}const oldCur=grid&&grid.querySelector('[data-v13-admin="currency"]');if(oldCur)oldCur.remove()};
window.adminAPIs=function(){const cs=v20Active();showModal(`<h3>🔌 API Settings</h3><div class="notice">د هرې کرنسي API یوازې هغه وخت ښکاري چې د هغې processing mode Automatic وي. Manual/Approval کې یوازې فعال/غیر فعال کنټرول پاتې کېږي.</div>${cs.map(c=>{const auto=c.processing.deposit==='automatic'||c.processing.withdraw==='automatic';return `<div class="panel" style="margin:10px 0"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${v20Esc(c.code)} — ${v20Esc(c.name)}</b><small class="muted" style="display:block">Deposit: ${c.processing.deposit} · Withdraw: ${c.processing.withdraw}</small></div><label><input id="v20api_on_${c.code}" type="checkbox" ${c.api.enabled?'checked':''}> فعال</label></div>${auto?`<div class="field" style="margin-top:8px"><label>Secure API / Gateway URL</label><input id="v20api_ep_${c.code}" value="${v20Esc(c.api.endpoint)}" placeholder="https://.../functions/v1/dexchange-gateway"></div><div class="notice">API Key / Secret باید یوازې په Supabase Secrets کې وساتل شي.</div>`:'<div class="notice" style="margin-top:8px">✋ Manual/Admin Approval: API settings پټ دي.</div>'}</div>`}).join('')}<button class="primary gold" onclick="v20SaveAPIs()">Save</button> <button class="outline" onclick="closeModal()">Cancel</button>`) };
window.v20SaveAPIs=function(){for(const c of v20Active()){c.api.enabled=document.getElementById('v20api_on_'+c.code)?.checked||false;if(c.processing.deposit==='automatic'||c.processing.withdraw==='automatic')c.api.endpoint=document.getElementById('v20api_ep_'+c.code)?.value.trim()||'';else{c.api.enabled=false;c.api.endpoint=''}}v20PersistSettings();closeModal();toast('API settings saved');openView('admin')};
